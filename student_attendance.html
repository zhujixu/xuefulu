        // ===== 北京时间与考勤历史 =====

        // 获取当前北京时间（优先使用页面顶部已同步的时间源）
        function getBeijingNow() {
            if (typeof window.getBeijingTime === 'function') {
                return window.getBeijingTime();
            }
            dayjs.extend(window.dayjs_plugin_utc);
            dayjs.extend(window.dayjs_plugin_timezone);
            return dayjs().tz('Asia/Shanghai');
        }

        // 格式化当前北京时间
        function formatBeijingNow() {
            return getBeijingNow().format('YYYY-MM-DD HH:mm:ss');
        }

        // 记录/移除某状态的考勤历史
        function recordStatusHistory(name, status, action) {
            if (!attendanceHistory[status]) attendanceHistory[status] = {};
            if (!attendanceHistory[status][name]) attendanceHistory[status][name] = [];
            if (action === 'add') {
                attendanceHistory[status][name].push(formatBeijingNow());
            } else if (action === 'remove') {
                attendanceHistory[status][name].pop();
            }
        }

        // 根据状态变化同步各状态的历史记录（进入某状态时新增，离开时移除）
        function updateStatusHistory(name, newStatus, previousStatus) {
            const statuses = ['迟到', '早退', '缺勤', '正常出勤'];
            statuses.forEach(s => {
                if (newStatus === s && previousStatus !== s) {
                    recordStatusHistory(name, s, 'add');
                } else if (newStatus !== s && previousStatus === s) {
                    recordStatusHistory(name, s, 'remove');
                }
            });
        }

        // 关闭所有考勤记录下拉
        function closeAllStatusDropdowns() {
            document.querySelectorAll('.status-dropdown.open').forEach(d => d.classList.remove('open'));
        }

        // 切换考勤记录下拉
        function toggleStatusDropdown(btn) {
            const wrapper = btn.closest('.status-dropdown');
            const isOpen = wrapper.classList.contains('open');
            closeAllStatusDropdowns();
            if (!isOpen) {
                const menu = wrapper.querySelector('.status-dropdown-menu');
                // 先取按钮位置作为锚点（不能等菜单展开后再测量，否则菜单自身会撑大包裹层、导致坐标偏移）
                const btnRect = btn.getBoundingClientRect();

                wrapper.classList.add('open');
                menu.style.position = 'fixed';
                const menuWidth = menu.offsetWidth || 260;
                const menuHeight = menu.offsetHeight || 240;

                // 垂直方向：优先显示在按钮下方，下方空间不足时显示在上方，始终贴近按钮
                const gap = 6;
                let top = btnRect.bottom + gap;
                if (top + menuHeight > window.innerHeight - 8 && btnRect.top - menuHeight - gap > 8) {
                    top = btnRect.top - menuHeight - gap;
                }

                // 水平方向：优先与按钮左缘对齐；右侧空间不足时与按钮右缘对齐，避免弹窗远离按钮
                let left = btnRect.left;
                const maxLeft = window.innerWidth - menuWidth - 8;
                if (left > maxLeft) {
                    left = Math.max(8, btnRect.right - menuWidth);
                } else if (left < 8) {
                    left = 8;
                }

                menu.style.top = top + 'px';
                menu.style.left = left + 'px';
            }
        }

        // 获取某状态的考勤记录（"出勤"合并正常出勤、迟到、早退，与"出勤次数"统计口径一致）
        function getStatusHistory(name, status) {
            if (status === '出勤') {
                const result = [];
                ['正常出勤', '迟到', '早退'].forEach(s => {
                    (attendanceHistory[s]?.[name] || []).forEach(t => {
                        result.push(s === '正常出勤' ? t : `${t}（${s}）`);
                    });
                });
                return result;
            }
            return attendanceHistory[status]?.[name] || [];
        }

        // 创建考勤次数单元格（含历史记录下拉）
        function createStatusCell(count, name, status, label, highlightedClass) {
            const cell = document.createElement('td');
            if (highlightedClass) cell.className = highlightedClass;

            const wrapper = document.createElement('div');
            wrapper.className = 'status-dropdown';

            const countSpan = document.createElement('span');
            countSpan.className = 'status-count';
            countSpan.textContent = count;
            wrapper.appendChild(countSpan);

            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'status-dropdown-btn';
            btn.title = `查看${label}历史记录`;
            btn.setAttribute('aria-label', `查看${label}历史记录`);
            btn.innerHTML = '<i class="fa fa-chevron-down" aria-hidden="true"></i>';
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleStatusDropdown(btn);
            });
            wrapper.appendChild(btn);

            const menu = document.createElement('div');
            menu.className = 'status-dropdown-menu';

            const history = getStatusHistory(name, status);
            const title = document.createElement('div');
            title.className = 'status-dropdown-title';
            title.textContent = `${label}记录（共 ${history.length} 次）`;
            menu.appendChild(title);

            const list = document.createElement('div');
            list.className = 'status-dropdown-list';
            if (history.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'status-dropdown-empty';
                empty.textContent = `暂无${label}记录`;
                list.appendChild(empty);
            } else {
                history.forEach((entry, i) => {
                    const item = document.createElement('div');
                    item.className = 'status-dropdown-item';
                    item.textContent = `${i + 1}. ${entry}`;
                    list.appendChild(item);
                });
            }
            menu.appendChild(list);
            wrapper.appendChild(menu);
            cell.appendChild(wrapper);
            return cell;
        }

        // ===== 历史考勤面板 =====

        // 切换历史考勤面板显示
        function toggleHistoryAttendance() {
            const isHidden = historyAttendancePanel.classList.contains('hidden');
            if (isHidden) {
                historyAttendancePanel.classList.remove('hidden');
                historyToggleBtn.classList.add('bg-blue-500', 'text-white', 'border-blue-500');
                historyToggleBtn.classList.remove('bg-white', 'text-neutral', 'border-gray-300');
                historyToggleBtn.setAttribute('aria-pressed', 'true');
            } else {
                historyAttendancePanel.classList.add('hidden');
                historyToggleBtn.classList.remove('bg-blue-500', 'text-white', 'border-blue-500');
                historyToggleBtn.classList.add('bg-white', 'text-neutral', 'border-gray-300');
                historyToggleBtn.setAttribute('aria-pressed', 'false');
            }
            // 确保展示的是最新数据
            updateAttendanceTable();
        }

        // ===== 图示数据 =====

        // HTML 转义，防止姓名中的特殊字符破坏图表
        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[c]));
        }

        // 渲染指定状态的次数统计图（缺勤/迟到/早退共用）
        function renderStatChart(chartEl, summaryEl, statusKey, label, color, chartKey) {
            const data = nameData
                .map((name, index) => ({ name, index, count: attendanceStats[name]?.[statusKey] || 0 }))
                .filter(d => d.count > 0)
                .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, 'zh'));

            const total = data.reduce((s, d) => s + d.count, 0);

            if (data.length === 0) {
                chartEl.innerHTML = `<p class="visualize-empty">暂无${label}记录</p>`;
                setSummaryWithTime(summaryEl, chartKey, `所有学生均无${label}记录`);
                return;
            }

            const maxCount = Math.max(1, ...data.map(d => d.count));

            const labelWidth = 112;
            const barHeight = 28;
            const barGap = 10;
            const rightPad = 42;
            const topPad = 16;
            const chartWidth = 640;
            const chartHeight = topPad + data.length * (barHeight + barGap) + 10;
            const maxBarWidth = chartWidth - labelWidth - rightPad;
            const gradientId = `grad-${statusKey}`;

            let svg = `<svg viewBox="0 0 ${chartWidth} ${chartHeight}" width="100%" role="img" aria-label="${label}统计图">`;
            svg += `<defs><linearGradient id="${gradientId}" x1="0" y1="0" x2="0" y2="1">`;
            svg += `<stop offset="0%" stop-color="${color}" stop-opacity="1"></stop>`;
            svg += `<stop offset="100%" stop-color="${color}" stop-opacity="0.65"></stop>`;
            svg += `</linearGradient></defs>`;

            // 柱状图起始轴线
            svg += `<line x1="${labelWidth}" y1="${topPad - 6}" x2="${labelWidth}" y2="${chartHeight - 4}" stroke="#E5E7EB" stroke-width="1"></line>`;

            // 横向刻度网格线（0 到最大值，最多 5 条）
            const gridCount = Math.min(5, maxCount);
            for (let i = 0; i <= gridCount; i++) {
                const value = (maxCount / gridCount) * i;
                const x = labelWidth + (value / maxCount) * maxBarWidth;
                svg += `<line x1="${x}" y1="${topPad - 6}" x2="${x}" y2="${chartHeight - 4}" stroke="#e5e7eb" stroke-width="1"></line>`;
                if (i > 0) {
                    svg += `<text x="${x}" y="${chartHeight - 6}" text-anchor="middle" font-size="10" fill="#9ca3af">${Math.round(value)}</text>`;
                }
            }

            data.forEach((d, i) => {
                const y = topPad + i * (barHeight + barGap);
                const barW = Math.max(d.count > 0 ? 4 : 2, (d.count / maxCount) * maxBarWidth);
                const displayName = `${d.index + 1}. ${d.name}`;
                svg += `<text x="${labelWidth - 8}" y="${y + barHeight / 2 + 4}" text-anchor="end" font-size="12" font-weight="500" fill="#374151">${escapeHtml(displayName)}</text>`;
                svg += `<rect x="${labelWidth}" y="${y}" width="${barW}" height="${barHeight}" fill="url(#${gradientId})"><title>${escapeHtml(displayName)}：${label} ${d.count} 次</title></rect>`;
                svg += `<text x="${labelWidth + barW + 6}" y="${y + barHeight / 2 + 4}" font-size="12" font-weight="600" fill="#111827">${d.count}</text>`;
            });

            svg += '</svg>';
            chartEl.innerHTML = svg;
            setSummaryWithTime(summaryEl, chartKey, `有${label}记录的学生 ${data.length} 名，累计${label} ${total} 次`);
        }

        function renderAbsenceChart() {
            renderStatChart(absenceChart, absenceSummary, '缺勤', '缺勤', '#EF4444', 'absence');
        }

        function renderLateChart() {
            renderStatChart(lateChart, lateSummary, '迟到', '迟到', '#10B981', 'late');
        }

        function renderEarlyChart() {
            renderStatChart(earlyChart, earlySummary, '早退', '早退', '#7C3AED', 'early');
        }

        // 汇总文字中的北京时间每秒更新（与页面顶部时间一致）
        let summaryTimer = null;
        let activeSummaryEl = null;
        let activeSummarySuffix = '';
        const summarySuffixes = { absence: '', late: '', early: '' };

        function updateActiveSummaryTime() {
            if (!activeSummaryEl) return;
            activeSummaryEl.textContent = `北京时间 ${formatBeijingNow()}，${activeSummarySuffix}`;
        }

        function setSummaryWithTime(summaryEl, key, suffix) {
            activeSummaryEl = summaryEl;
            activeSummarySuffix = suffix;
            summarySuffixes[key] = suffix;
            updateActiveSummaryTime();
            if (summaryTimer) clearInterval(summaryTimer);
            summaryTimer = setInterval(updateActiveSummaryTime, 1000);
        }

        // 切换统计类型
        function switchVisualizeTab(tab) {
            const panels = { absence: absencePanel, late: latePanel, early: earlyPanel };
            visualizeTabs.forEach(btn => {
                const active = btn.dataset.tab === tab;
                btn.classList.toggle('visualize-tab-active', active);
                btn.setAttribute('aria-selected', String(active));
            });
            Object.keys(panels).forEach(key => {
                panels[key].classList.toggle('hidden', key !== tab);
            });
            // 切换后让当前可见的汇总文字时间持续更新
            if (summarySuffixes[tab] !== undefined) {
                setSummaryWithTime(panels[tab].querySelector('.visualize-summary'), tab, summarySuffixes[tab]);
            }
        }

        // 打开图示数据弹窗
        function openVisualizeModal() {
            renderAbsenceChart();
            renderLateChart();
            renderEarlyChart();
            switchVisualizeTab('absence');
            visualizeModal.classList.remove('hidden');
        }

        // 关闭图示数据弹窗
        function closeVisualizeModal() {
            visualizeModal.classList.add('hidden');
            if (summaryTimer) {
                clearInterval(summaryTimer);
                summaryTimer = null;
            }
        }

        // 保存当前统计截图
        async function saveScreenshot() {
            if (typeof html2canvas === 'undefined') {
                alert('截图组件加载失败，请检查网络后重试');
                return;
            }
            // 在屏幕外复制一份图表内容，避免弹窗滚动容器把长图裁掉
            const tempContainer = document.createElement('div');
            tempContainer.style.position = 'fixed';
            tempContainer.style.left = '-10000px';
            tempContainer.style.top = '0';
            tempContainer.style.width = `${visualizeContent.offsetWidth}px`;
            tempContainer.style.backgroundColor = '#ffffff';
            tempContainer.style.paddingBottom = '24px';
            const contentClone = visualizeContent.cloneNode(true);
            // 截图内容不包含上方 4 个按钮（缺勤统计/迟到统计/早退统计/保存截图）
            const clonedTabs = contentClone.querySelector('#visualizeTabs');
            if (clonedTabs) clonedTabs.remove();
            // 内联 SVG 在 html2canvas 中可能无法按正确尺寸渲染，
            // 这里把 SVG 转成带明确宽高的图片，确保图表及下方文字完整显示
            contentClone.querySelectorAll('svg').forEach(svg => {
                const rect = svg.getBoundingClientRect();
                if (rect.width === 0 || rect.height === 0) return;
                const xml = new XMLSerializer().serializeToString(svg);
                const img = document.createElement('img');
                img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
                img.width = Math.round(rect.width);
                img.height = Math.round(rect.height);
                img.style.width = `${rect.width}px`;
                img.style.height = `${rect.height}px`;
                svg.replaceWith(img);
            });
            tempContainer.appendChild(contentClone);
            document.body.appendChild(tempContainer);
            try {
                saveScreenshotBtn.disabled = true;
                saveScreenshotBtn.innerHTML = '保存中…';
                // 等待图片解码完成，避免截图时图表尚未渲染
                await Promise.all([...tempContainer.querySelectorAll('img')].map(img =>
                    img.complete ? Promise.resolve() : new Promise(resolve => {
                        img.onload = resolve;
                        img.onerror = resolve;
                    })
                ));
                const canvas = await html2canvas(tempContainer, {
                    backgroundColor: '#ffffff',
                    scale: 2,
                    useCORS: true,
                    windowWidth: Math.max(window.innerWidth, tempContainer.scrollWidth),
                    windowHeight: Math.max(window.innerHeight, tempContainer.scrollHeight)
                });
                const now = new Date();
                const pad = n => String(n).padStart(2, '0');
                const link = document.createElement('a');
                link.download = `考勤统计截图_${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            } catch (err) {
                alert('截图保存失败，请重试');
            } finally {
                tempContainer.remove();
                saveScreenshotBtn.disabled = false;
                saveScreenshotBtn.innerHTML = '<i class="fa fa-camera mr-1"></i>保存截图';
            }
        }

        // 保存今日考勤汇总区域截图（4 张统计卡片 + 3 张名单卡片）
        async function saveMainScreenshot() {
            if (typeof htmlToImage === 'undefined') {
                alert('截图组件加载失败，请检查网络后重试');
                return;
            }
            try {
                mainScreenshotBtn.disabled = true;
                mainScreenshotBtn.innerHTML = '<i class="fa fa-spinner fa-spin mr-1"></i>保存中…';
                // 等待字体（含图标字体）加载完成，避免截图出现乱码/变形
                if (document.fonts && document.fonts.ready) await document.fonts.ready;

                // 用浏览器原生布局分别渲染两个区域，再拼合成一张图，避免布局变形
                const [summaryUrl, listsUrl] = await Promise.all([
                    htmlToImage.toPng(todaySummary, { backgroundColor: '#ffffff', pixelRatio: 2, cacheBust: true }),
                    htmlToImage.toPng(todayNameLists, { backgroundColor: '#ffffff', pixelRatio: 2, cacheBust: true })
                ]);
                const loadImage = url => new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.onerror = reject;
                    img.src = url;
                });
                const [summaryImg, listsImg] = await Promise.all([loadImage(summaryUrl), loadImage(listsUrl)]);

                const gap = 32; // 两块之间的间距（16px × pixelRatio 2）
                const canvas = document.createElement('canvas');
                canvas.width = Math.max(summaryImg.naturalWidth, listsImg.naturalWidth);
                canvas.height = summaryImg.naturalHeight + listsImg.naturalHeight + gap;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(summaryImg, 0, 0);
                ctx.drawImage(listsImg, 0, summaryImg.naturalHeight + gap);

                const now = new Date();
                const pad = n => String(n).padStart(2, '0');
                const link = document.createElement('a');
                link.download = `考勤汇总截图_${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            } catch (err) {
                alert('截图保存失败，请重试');
            } finally {
                mainScreenshotBtn.disabled = false;
                mainScreenshotBtn.innerHTML = '<i class="fa fa-camera mr-1"></i> 保存截图';
            }
        }

        // 初始化
        function init() {
            // 加载本地存储数据
            loadFromLocalStorage();

            // 事件监听器
            excelFileInput.addEventListener('change', handleFileUpload);
            lateBtn.addEventListener('click', () => updateAttendanceStatus('迟到'));
            earlyLeaveBtn.addEventListener('click', () => updateAttendanceStatus('早退'));
            absentBtn.addEventListener('click', () => updateAttendanceStatus('缺勤'));
            presentBtn.addEventListener('click', () => updateAttendanceStatus('出勤'));
            // 点击姓名区域等同于点击"出勤"
            nameDisplay.addEventListener('click', () => {
                if (nameBtn.textContent === '已完成考勤' || !nameData[currentStudentIndex]) return;
                updateAttendanceStatus('出勤');
            });
            resetStatsBtn.addEventListener('click', clearCacheAndRefresh);
            exportStatsBtn.addEventListener('click', exportStatsData);
            historyToggleBtn.addEventListener('click', toggleHistoryAttendance);
            visualizeBtn.addEventListener('click', openVisualizeModal);
            visualizeTabs.forEach(btn => {
                btn.addEventListener('click', () => switchVisualizeTab(btn.dataset.tab));
            });
            saveScreenshotBtn.addEventListener('click', saveScreenshot);
            mainScreenshotBtn.addEventListener('click', saveMainScreenshot);
            visualizeModal.addEventListener('click', (e) => {
                if (e.target === visualizeModal) closeVisualizeModal();
            });

            // 点击姓名区域之外的空白区域视为"缺勤"
            document.addEventListener('click', (e) => {
                // 考勤未开始或已结束时忽略
                if (nameBtn.textContent === '已完成考勤' || !nameData[currentStudentIndex]) return;
                // 有考勤记录下拉打开时，本次点击用于收起下拉，不触发缺勤
                if (document.querySelector('.status-dropdown.open')) {
                    closeAllStatusDropdowns();
                    return;
                }
                // 蓝色姓名区域由单独监听处理（出勤）；交互元素和内容区域不触发缺勤
                if (e.target.closest('#nameDisplay, button, a, input, label, table, .status-dropdown, .step-card, .summary-card, #attendanceSection, #historyAttendancePanel, #todayAttendanceSection, #visualizeModal, footer')) return;
                updateAttendanceStatus('缺勤');
            });

            // 全局点击/Esc/滚动时关闭考勤记录下拉
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.status-dropdown')) {
                    closeAllStatusDropdowns();
                }
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeAllStatusDropdowns();
                    closeVisualizeModal();
                }
            });
            window.addEventListener('resize', closeAllStatusDropdowns);
            window.addEventListener('scroll', closeAllStatusDropdowns, true);

            // 更新UI
            updateAttendanceTable();
            updateTodayAttendanceTable();
            updateTodaySummary();
            updateNameDisplay();
        }

        // 更新姓名显示
        function updateNameDisplay() {
            const nameText = nameBtn.textContent.split('. ')[1] || '暂无考勤';
            nameDisplay.textContent = nameText;
        }

        // 处理文件上传
        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            fileInfo.textContent = `正在处理: ${file.name}`;

            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                    // 读取各状态考勤记录表（如果导出的文件包含这些表，可还原具体时间）
                    const historySheetSpecs = [
                        ['迟到记录', '迟到'],
                        ['早退记录', '早退'],
                        ['缺勤记录', '缺勤'],
                        ['出勤记录', '正常出勤']
                    ];
                    const historyTimesByStudent = {};
                    historySheetSpecs.forEach(([sheetKeyword, status]) => {
                        historyTimesByStudent[status] = {};
                        const sheetName = workbook.SheetNames.find(s => s.includes(sheetKeyword));
                        if (!sheetName) return;
                        const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header: 1 });
                        if (rows.length <= 1) return;
                        const headers = rows[0] || [];
                        const nameIdx = headers.findIndex(h => h && (h.includes('姓名') || h.includes('名字')));
                        const timeIdx = headers.findIndex(h => h && h.includes('时间'));
                        rows.slice(1).forEach(row => {
                            const n = row[nameIdx];
                            if (!n) return;
                            const t = row[timeIdx];
                            if (t === undefined || t === null || String(t).trim() === '') return;
                            const timeStr = typeof t === 'number' ? formatExcelSerialDate(t) : String(t).trim();
                            if (!historyTimesByStudent[status][n]) historyTimesByStudent[status][n] = [];
                            historyTimesByStudent[status][n].push(timeStr);
                        });
                    });

                    // 检查是否包含所需的列
                    const headers = jsonData[0] || [];
                    const nameColumnIndex = findNameColumnIndex(headers);
                    if (nameColumnIndex === -1) {
                        fileInfo.textContent = '错误: 未找到"姓名"列';
                        return;
                    }

                    // 查找考勤统计列索引
                    const columnIndices = {
                        迟到次数: headers.findIndex(h => h.includes('迟到次数')),
                        早退次数: headers.findIndex(h => h.includes('早退次数')),
                        缺勤次数: headers.findIndex(h => h.includes('缺勤次数')),
                        正常出勤次数: headers.findIndex(h => h.includes('正常出勤次数')),
                        出勤次数: headers.findIndex(h => String(h).trim() === '出勤次数')
                    };
                    // 出勤总次数列：优先取"出勤次数"，其次兼容旧文件中的"总出勤次数"
                    const totalPresentIndex = columnIndices.出勤次数 > -1
                        ? columnIndices.出勤次数
                        : headers.findIndex(h => h.includes('总出勤次数'));

                    // 从第2行开始提取姓名数据和考勤数据
                    nameData = [];
                    attendanceStats = {};
                    attendanceHistory = {};
                    ['迟到', '早退', '缺勤', '正常出勤'].forEach(s => { attendanceHistory[s] = {}; });

                    jsonData.slice(1).forEach(row => {
                        const name = row[nameColumnIndex];
                        if (!name) return;

                        nameData.push(name);

                        // 初始化统计数据
                        const normalPresent = parseInt(row[columnIndices.正常出勤次数]) || 0;
                        const late = parseInt(row[columnIndices.迟到次数]) || 0;
                        const early = parseInt(row[columnIndices.早退次数]) || 0;
                        const absentCount = parseInt(row[columnIndices.缺勤次数]) || 0;

                        attendanceStats[name] = {
                            迟到: late,
                            早退: early,
                            缺勤: absentCount,
                            正常出勤: normalPresent,
                            总出勤: totalPresentIndex > -1
                                ? parseInt(row[totalPresentIndex]) || 0
                                : normalPresent + late + early // 计算总出勤次数
                        };

                        // 初始化各状态考勤历史记录：优先使用对应记录表中的时间，不足部分用占位项补齐
                        const statusCounts = {
                            迟到: attendanceStats[name].迟到,
                            早退: attendanceStats[name].早退,
                            缺勤: attendanceStats[name].缺勤
                        };
                        Object.entries(statusCounts).forEach(([status, count]) => {
                            const importedTimes = historyTimesByStudent[status][name] || [];
                            const history = importedTimes.slice();
                            for (let i = history.length; i < count; i++) {
                                history.push('导入数据（无具体时间）');
                            }
                            attendanceHistory[status][name] = history;
                        });
                        // 出勤记录按统计补齐，保证下拉记录数与"出勤次数"一致
                        const normalImported = historyTimesByStudent['正常出勤'][name] || [];
                        const normalHistory = normalImported.slice();
                        const normalNeeded = Math.max(
                            attendanceStats[name].正常出勤,
                            attendanceStats[name].总出勤 - attendanceStats[name].迟到 - attendanceStats[name].早退
                        );
                        for (let i = normalHistory.length; i < normalNeeded; i++) {
                            normalHistory.push('导入数据（无具体时间）');
                        }
                        attendanceHistory['正常出勤'][name] = normalHistory;
                    });

                    if (nameData.length === 0) {
                        fileInfo.textContent = '错误: 未找到有效姓名数据';
                        return;
                    }

                    totalStudents = nameData.length;

                    // 初始化今日考勤数据
                    initTodayAttendanceData();

                    // 初始化剩余学生数组
                    resetRemainingStudents();

                    // 启用按钮
                    nameBtn.disabled = false;
                    lateBtn.disabled = false;
                    earlyLeaveBtn.disabled = false;
                    absentBtn.disabled = false;
                    presentBtn.disabled = false;
                    historyToggleBtn.disabled = false;
                    visualizeBtn.disabled = false;
                    exportStatsBtn.disabled = false;
                    mainScreenshotBtn.disabled = false;

                    // 更新进度条
                    updateProgressBar();

                    // 更新汇总数据
                    updateTodaySummary();

                    // 显示第一个随机姓名
                    showNextRandomName();

                    fileInfo.textContent = `已成功导入 ${nameData.length} 个姓名及其考勤数据`;

                    // 更新历史考勤表格
                    updateAttendanceTable();

                    // 保存到本地存储
                    saveToLocalStorage();

                    // 滚动到顶部
                    window.scrollTo({
                        top: 0,
                        behavior: 'smooth'
                    });
                } catch (error) {
                    fileInfo.textContent = '错误: 文件处理失败';
                    console.error('文件处理错误:', error);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // 查找姓名列索引
        function findNameColumnIndex(headers) {
            if (!headers || headers.length === 0) return -1;

            return headers.findIndex(header =>
                header.includes('姓名') || header.includes('名字') || header.toLowerCase().includes('name')
            );
        }

        // 初始化今日考勤数据
        function initTodayAttendanceData() {
            nameData.forEach(name => {
                todayAttendance[name] = {
                    迟到: 0,
                    早退: 0,
                    缺勤: 0,
                    正常出勤: 0,
                    总出勤: 0,
                    总计: 0
                };
                attendanceToggle[name] = {
                    迟到: 1,
                    早退: 1,
                    缺勤: 1,
                    正常出勤: 1
                };
            });
        }

        // 重置剩余学生数组
        function resetRemainingStudents() {
            remainingStudents = Array.from({ length: nameData.length }, (_, i) => i);
        }

        // 显示下一个随机姓名（不重复）
        function showNextRandomName() {
            if (remainingStudents.length === 0) {
                nameBtn.textContent = '已完成考勤';
                return;
            }

            const randomIndexInRemaining = Math.floor(Math.random() * remainingStudents.length);
            currentStudentIndex = remainingStudents[randomIndexInRemaining];

            // 从剩余学生中移除当前选中的学生
            remainingStudents.splice(randomIndexInRemaining, 1);

            nameBtn.textContent = `${currentStudentIndex + 1}. ${nameData[currentStudentIndex]}`;

            // 添加动画效果
            nameBtn.classList.add('scale-105');
            setTimeout(() => {
                nameBtn.classList.remove('scale-105');
            }, 300);

            updateNameDisplay();
        }

        // 更新考勤状态
        function updateAttendanceStatus(status) {
            if (currentStudentIndex === -1 || !nameData[currentStudentIndex]) return;

            const name = nameData[currentStudentIndex];
            // 转换状态名称以匹配数据结构
            const normalizedStatus = status === '出勤' ? '正常出勤' : status;

            // 先将今日考勤之前的状态计数减1
            const previousStatus = getCurrentStatus(name, todayAttendance);
            if (previousStatus) {
                todayAttendance[name][previousStatus] -= 1;
                // 如果之前状态是出勤相关的，也要减少总出勤
                if (previousStatus !== '缺勤') {
                    todayAttendance[name].总出勤 -= 1;
                }
                todayAttendance[name].总计 -= 1;
            }

            // 再将今日考勤当前状态计数加1
            todayAttendance[name][normalizedStatus] += 1;
            // 如果当前状态是出勤相关的，增加总出勤
            if (normalizedStatus !== '缺勤') {
                todayAttendance[name].总出勤 += 1;
            }
            todayAttendance[name].总计 += 1;

            // 记录考勤历史（北京时间）：进入某状态时新增，离开时移除
            updateStatusHistory(name, normalizedStatus, previousStatus);

            // 更新历史考勤数据
            updateHistoricalAttendance(name, normalizedStatus, previousStatus);

            // 记录最后更新的单元格
            lastUpdatedCells[name] = normalizedStatus;

            // 更新表格
            updateAttendanceTable();
            updateTodayAttendanceTable();

            // 更新汇总数据
            updateTodaySummary();

            // 更新进度条
            updateProgressBar();

            // 保存到本地存储
            saveToLocalStorage();

            // 显示下一个随机姓名
            showNextRandomName();
        }

        // 更新历史考勤数据
        function updateHistoricalAttendance(name, newStatus, previousStatus) {
            // 如果之前有状态，先减去
            if (previousStatus) {
                attendanceStats[name][previousStatus] -= 1;
                // 如果之前状态是出勤相关的，也要减少总出勤
                if (previousStatus !== '缺勤') {
                    attendanceStats[name].总出勤 -= 1;
                }
            }

            // 添加新状态
            attendanceStats[name][newStatus] += 1;
            // 如果新状态是出勤相关的，增加总出勤
            if (newStatus !== '缺勤') {
                attendanceStats[name].总出勤 += 1;
            }
        }

        // 获取当前学生的状态
        function getCurrentStatus(name, attendanceData) {
            const statuses = ['迟到', '早退', '缺勤', '正常出勤'];
            for (const status of statuses) {
                if (attendanceData[name] && attendanceData[name][status] > 0) {
                    return status;
                }
            }
            return null;
        }

        // 更新考勤表格（历史考勤区域）
        function updateAttendanceTable() {
            attendanceTableBody.innerHTML = '';

            nameData.forEach((name, index) => {
                const row = document.createElement('tr');
                row.id = `row-${index}`;

                // 序号
                const indexCell = document.createElement('td');
                indexCell.textContent = index + 1;
                row.appendChild(indexCell);

                // 姓名
                const nameCell = document.createElement('td');
                nameCell.textContent = name;
                row.appendChild(nameCell);

                // 迟到次数（含历史记录下拉）
                row.appendChild(createStatusCell(attendanceStats[name]?.迟到 || 0, name, '迟到', '迟到', null));

                // 早退次数（含历史记录下拉）
                row.appendChild(createStatusCell(attendanceStats[name]?.早退 || 0, name, '早退', '早退', null));

                // 缺勤次数（含历史记录下拉）
                row.appendChild(createStatusCell(attendanceStats[name]?.缺勤 || 0, name, '缺勤', '缺勤', null));

                // 出勤次数（含历史记录下拉）
                row.appendChild(createStatusCell(attendanceStats[name]?.总出勤 || 0, name, '出勤', '出勤', null));

                attendanceTableBody.appendChild(row);
            });
        }

        // 更新今日考勤表格
        function updateTodayAttendanceTable() {
            todayAttendanceTableBody.innerHTML = '';

            nameData.forEach((name, index) => {
                const row = document.createElement('tr');
                row.id = `today-row-${index}`;

                // 序号
                const indexCell = document.createElement('td');
                indexCell.textContent = index + 1;
                row.appendChild(indexCell);

                // 姓名
                const nameCell = document.createElement('td');
                nameCell.textContent = name;
                row.appendChild(nameCell);

                // 迟到次数（含历史记录下拉）
                const lateCount = todayAttendance[name]?.迟到 || 0;
                row.appendChild(createStatusCell(lateCount, name, '迟到', '迟到', lateCount === 1 ? 'today-attendance-late' : null));

                // 早退次数（含历史记录下拉）
                const earlyCount = todayAttendance[name]?.早退 || 0;
                row.appendChild(createStatusCell(earlyCount, name, '早退', '早退', earlyCount === 1 ? 'today-attendance-early' : null));

                // 缺勤次数（含历史记录下拉）
                const absentCount = todayAttendance[name]?.缺勤 || 0;
                row.appendChild(createStatusCell(absentCount, name, '缺勤', '缺勤', absentCount === 1 ? 'today-attendance-absent' : null));

                // 出勤次数（含历史记录下拉）
                row.appendChild(createStatusCell(todayAttendance[name]?.总出勤 || 0, name, '出勤', '出勤', null));

                // 状态更新列
                const actionCell = document.createElement('td');
                actionCell.className = 'p-1 flex flex-wrap justify-center';

                // 迟到按钮
                const lateBtn = document.createElement('button');
                lateBtn.className = 'update-btn bg-attendance-late text-white';
                lateBtn.textContent = '迟到';
                lateBtn.addEventListener('click', () => updateStatusFromTable(index, '迟到'));
                actionCell.appendChild(lateBtn);

                // 早退按钮
                const earlyBtn = document.createElement('button');
                earlyBtn.className = 'update-btn bg-attendance-early text-white';
                earlyBtn.textContent = '早退';
                earlyBtn.addEventListener('click', () => updateStatusFromTable(index, '早退'));
                actionCell.appendChild(earlyBtn);

                // 缺勤按钮
                const absentBtn = document.createElement('button');
                absentBtn.className = 'update-btn bg-attendance-absent text-white';
                absentBtn.textContent = '缺勤';
                absentBtn.addEventListener('click', () => updateStatusFromTable(index, '缺勤'));
                actionCell.appendChild(absentBtn);

                // 出勤按钮
                const presentBtn = document.createElement('button');
                presentBtn.className = 'update-btn bg-attendance-present text-white';
                presentBtn.textContent = '出勤';
                presentBtn.addEventListener('click', () => updateStatusFromTable(index, '正常出勤'));
                actionCell.appendChild(presentBtn);

                row.appendChild(actionCell);

                todayAttendanceTableBody.appendChild(row);
            });
        }

        // 从表格更新状态
        function updateStatusFromTable(index, status) {
            const name = nameData[index];

            // 先将今日考勤之前的状态计数减1
            const previousStatus = getCurrentStatus(name, todayAttendance);
            if (previousStatus) {
                todayAttendance[name][previousStatus] -= 1;
                // 如果之前状态是出勤相关的，也要减少总出勤
                if (previousStatus !== '缺勤') {
                    todayAttendance[name].总出勤 -= 1;
                }
                todayAttendance[name].总计 -= 1;
            }

            // 再将今日考勤当前状态计数加1
            todayAttendance[name][status] += 1;
            // 如果当前状态是出勤相关的，增加总出勤
            if (status !== '缺勤') {
                todayAttendance[name].总出勤 += 1;
            }
            todayAttendance[name].总计 += 1;

            // 记录考勤历史（北京时间）：进入某状态时新增，离开时移除
            updateStatusHistory(name, status, previousStatus);

            // 更新历史考勤数据
            updateHistoricalAttendance(name, status, previousStatus);

            // 记录最后更新的单元格
            lastUpdatedCells[name] = status;

            // 更新表格
            updateAttendanceTable();
            updateTodayAttendanceTable();

            // 更新汇总数据
            updateTodaySummary();

            // 更新进度条
            updateProgressBar();

            // 保存到本地存储
            saveToLocalStorage();
        }

        // 更新今日考勤汇总数据
        function updateTodaySummary() {
            if (totalStudents === 0) {
                summaryPresent.textContent = '0';
                summaryLate.textContent = '0';
                summaryEarly.textContent = '0';
                summaryAbsent.textContent = '0';

                // 清空百分比
                document.querySelectorAll('#todaySummary .percent').forEach(el => {
                    el.textContent = '0%';
                });
                updateTodayNameLists();
                return;
            }

            let presentCount = 0; // 出勤人数（包含正常出勤、迟到、早退）
            let lateCount = 0;    // 迟到人数
            let earlyCount = 0;   // 早退人数
            let absentCount = 0;  // 缺勤人数

            // 统计各状态人数
            nameData.forEach(name => {
                if (todayAttendance[name]) {
                    // 判断学生是否出勤（正常出勤、迟到或早退都算出勤）
                    const isPresent = todayAttendance[name].正常出勤 > 0 ||
                        todayAttendance[name].迟到 > 0 ||
                        todayAttendance[name].早退 > 0;

                    if (isPresent) presentCount++;
                    if (todayAttendance[name].迟到 > 0) lateCount++;
                    if (todayAttendance[name].早退 > 0) earlyCount++;
                    if (todayAttendance[name].缺勤 > 0) absentCount++;
                }
            });

            // 计算百分比
            const presentPercent = Math.round((presentCount / totalStudents) * 100);
            const latePercent = Math.round((lateCount / totalStudents) * 100);
            const earlyPercent = Math.round((earlyCount / totalStudents) * 100);
            const absentPercent = Math.round((absentCount / totalStudents) * 100);

            // 更新DOM
            summaryPresent.textContent = presentCount;
            summaryLate.textContent = lateCount;
            summaryEarly.textContent = earlyCount;
            summaryAbsent.textContent = absentCount;

            // 更新百分比
            summaryPresent.nextElementSibling.textContent = `${presentPercent}%`;
            summaryLate.nextElementSibling.textContent = `${latePercent}%`;
            summaryEarly.nextElementSibling.textContent = `${earlyPercent}%`;
            summaryAbsent.nextElementSibling.textContent = `${absentPercent}%`;

            updateTodayNameLists();
        }

        // 更新今日异常人员名单（迟到/早退/缺勤，名字前带序号）
        function updateTodayNameLists() {
            // 每个名单标题带上当前北京时间日期（与页面顶部一致）
            const dateText = `（${getBeijingNow().format('YYYY年MM月DD日')}）`;
            document.querySelectorAll('.name-list-date').forEach(el => {
                el.textContent = dateText;
            });
            const lists = [
                { status: '迟到', el: lateNameList, emptyText: '今日无迟到' },
                { status: '早退', el: earlyNameList, emptyText: '今日无早退' },
                { status: '缺勤', el: absentNameList, emptyText: '今日无缺勤' }
            ];
            lists.forEach(item => {
                const names = [];
                nameData.forEach((name, index) => {
                    if ((todayAttendance[name]?.[item.status] || 0) > 0) {
                        names.push(`${index + 1}. ${name}`);
                    }
                });
                if (names.length === 0) {
                    item.el.innerHTML = `<span class="name-list-empty">${item.emptyText}</span>`;
                } else {
                    item.el.innerHTML = names.map(n => `<span class="name-list-item">${escapeHtml(n)}</span>`).join('');
                }
            });
        }

        // 更新进度条
        function updateProgressBar() {
            if (totalStudents === 0) return;

            // 计算已考勤的学生数（今日考勤至少有一项记录的学生）
            let checkedStudents = 0;
            nameData.forEach(name => {
                if (todayAttendance[name] && todayAttendance[name].总计 > 0) {
                    checkedStudents++;
                }
            });

            // 进度条范围从0到学生总数
            const progress = (checkedStudents / totalStudents) * 100;
            progressBar.style.width = `${progress}%`;
            progressText.textContent = `${checkedStudents} / ${totalStudents}`;

            // 如果所有学生都考勤完毕，显示提示
            if (checkedStudents === totalStudents) {
                nameBtn.textContent = '已完成考勤';
            }
        }

        // 清除缓存并刷新页面
        function clearCacheAndRefresh() {
            if (confirm('确定要清除页面缓存并刷新吗？')) {
                try {
                    // 清除本地存储
                    localStorage.clear();

                    // 清除缓存并重新加载页面
                    if (caches) {
                        caches.keys().then(function (names) {
                            names.forEach(function (name) {
                                caches.delete(name);
                            });
                        });
                    }

                    // 强制刷新页面（不使用缓存）
                    window.location.reload(true);
                } catch (error) {
                    console.error('清除缓存时出错:', error);
                    alert('清除缓存时出错，请手动刷新页面');
                }
            }
        }

        // 导出统计数据
        function exportStatsData() {
            try {
                if (!nameData || nameData.length === 0) {
                    alert('没有可导出的学生数据');
                    return;
                }

                // 创建导出数据
                const exportData = [
                    ['序号', '姓名', '迟到次数', '早退次数', '缺勤次数', '出勤次数']
                ];

                // 添加每个学生的数据
                nameData.forEach((name, index) => {
                    exportData.push([
                        index + 1,
                        name,
                        attendanceStats[name]?.迟到 || 0,
                        attendanceStats[name]?.早退 || 0,
                        attendanceStats[name]?.缺勤 || 0,
                        attendanceStats[name]?.总出勤 || 0
                    ]);
                });

                // 创建工作簿
                const ws = XLSX.utils.aoa_to_sheet(exportData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "历史考勤");

                // 创建各状态记录表（含具体北京时间），供再次导入时还原
                const historySheetSpecs = [
                    ['迟到记录', '迟到时间', '迟到'],
                    ['早退记录', '早退时间', '早退'],
                    ['缺勤记录', '缺勤时间', '缺勤'],
                    ['出勤记录', '出勤时间', '正常出勤']
                ];
                historySheetSpecs.forEach(([sheetName, timeHeader, status]) => {
                    const rows = [['姓名', timeHeader]];
                    nameData.forEach(name => {
                        (attendanceHistory[status]?.[name] || []).forEach(t => {
                            rows.push([name, t]);
                        });
                    });
                    const wsHistory = XLSX.utils.aoa_to_sheet(rows);
                    XLSX.utils.book_append_sheet(wb, wsHistory, sheetName);
                });

                // 获取当前时间（年月日时分秒）
                const now = new Date();
                const timestamp = `${now.getFullYear()}${padZero(now.getMonth() + 1)}${padZero(now.getDate())}${padZero(now.getHours())}${padZero(now.getMinutes())}${padZero(now.getSeconds())}`;

                // 生成文件名
                const fileName = `历史考勤_${timestamp}.xlsx`;

                // 导出文件
                XLSX.writeFile(wb, fileName);

                alert('历史考勤数据已成功导出');
            } catch (error) {
                console.error('导出错误:', error);
                alert('导出历史考勤数据时出错');
            }
        }

        // 辅助函数：数字补零
        function padZero(num) {
            return num < 10 ? '0' + num : num;
        }

        // 辅助函数：将 Excel 日期序列号格式化为 YYYY-MM-DD HH:mm:ss
        function formatExcelSerialDate(serial) {
            const d = XLSX.SSF.parse_date_code(serial);
            if (!d) return String(serial);
            const p = n => (n < 10 ? '0' + n : '' + n);
            return `${d.y}-${p(d.m)}-${p(d.d)} ${p(d.H)}:${p(d.M)}:${p(d.S)}`;
        }

        // 保存到本地存储
        function saveToLocalStorage() {
            localStorage.setItem('nameData', JSON.stringify(nameData));
            localStorage.setItem('attendanceStats', JSON.stringify(attendanceStats));
            localStorage.setItem('attendanceHistory', JSON.stringify(attendanceHistory));
            localStorage.setItem('todayAttendance', JSON.stringify(todayAttendance));
            localStorage.setItem('attendanceToggle', JSON.stringify(attendanceToggle));
            localStorage.setItem('totalStudents', totalStudents);
            localStorage.setItem('remainingStudents', JSON.stringify(remainingStudents));
            localStorage.setItem('currentStudentIndex', currentStudentIndex);
        }

        // 从本地存储加载
        function loadFromLocalStorage() {
            const savedNameData = localStorage.getItem('nameData');
            const savedAttendanceStats = localStorage.getItem('attendanceStats');
            const savedTodayAttendance = localStorage.getItem('todayAttendance');
            const savedAttendanceToggle = localStorage.getItem('attendanceToggle');
            const savedTotalStudents = localStorage.getItem('totalStudents');
            const savedRemainingStudents = localStorage.getItem('remainingStudents');
            const savedCurrentStudentIndex = localStorage.getItem('currentStudentIndex');

            if (savedNameData) {
                nameData = JSON.parse(savedNameData);
            }

            if (savedAttendanceStats) {
                attendanceStats = JSON.parse(savedAttendanceStats);
            }

            const savedAttendanceHistory = localStorage.getItem('attendanceHistory');
            if (savedAttendanceHistory) {
                attendanceHistory = JSON.parse(savedAttendanceHistory);
            } else {
                // 兼容旧缓存数据：缺勤历史从旧的 absenceHistory 键读取，其余状态为空
                attendanceHistory = { 迟到: {}, 早退: {}, 缺勤: {}, 正常出勤: {} };
                const savedAbsenceHistory = localStorage.getItem('absenceHistory');
                if (savedAbsenceHistory) {
                    attendanceHistory['缺勤'] = JSON.parse(savedAbsenceHistory);
                }
            }

            // 兼容旧缓存数据：为已有各状态次数补齐历史记录占位项，保证下拉记录数与统计一致
            ['迟到', '早退', '缺勤', '正常出勤'].forEach(status => {
                if (!attendanceHistory[status]) attendanceHistory[status] = {};
            });
            Object.keys(attendanceStats).forEach(name => {
                const late = attendanceStats[name]?.迟到 || 0;
                const early = attendanceStats[name]?.早退 || 0;
                const absent = attendanceStats[name]?.缺勤 || 0;
                const normal = attendanceStats[name]?.正常出勤 || 0;
                const total = attendanceStats[name]?.总出勤 || 0;

                const padHistory = (status, count) => {
                    const history = attendanceHistory[status][name] || (attendanceHistory[status][name] = []);
                    for (let i = history.length; i < count; i++) {
                        history.push('导入数据（无具体时间）');
                    }
                };

                padHistory('迟到', late);
                padHistory('早退', early);
                padHistory('缺勤', absent);
                // 出勤记录数 = 总出勤 - 迟到 - 早退（不足时补齐，保证下拉与"出勤次数"一致）
                padHistory('正常出勤', Math.max(normal, total - late - early));
            });

            if (savedTodayAttendance) {
                todayAttendance = JSON.parse(savedTodayAttendance);
            } else {
                // 如果没有今日考勤数据，初始化它
                initTodayAttendanceData();
            }

            if (savedAttendanceToggle) {
                attendanceToggle = JSON.parse(savedAttendanceToggle);
            }

            if (savedTotalStudents) {
                totalStudents = parseInt(savedTotalStudents);
            }

            if (savedRemainingStudents) {
                remainingStudents = JSON.parse(savedRemainingStudents);
            }

            if (savedCurrentStudentIndex) {
                currentStudentIndex = parseInt(savedCurrentStudentIndex);
            }

            // 更新进度条
            updateProgressBar();

            // 更新汇总数据
            updateTodaySummary();
        }

        // 初始化应用
        document.addEventListener('DOMContentLoaded', init);
    </script>
	    <script>
	    // ===== 时间同步与显示 =====
	    (function() {
	        dayjs.extend(window.dayjs_plugin_utc);
	        dayjs.extend(window.dayjs_plugin_timezone);
	        const BJ_TZ = 'Asia/Shanghai';
	        const SYNC_INTERVAL_MS = 5 * 60 * 1000;
        let timeOffset = 0, syncTimer = null;
        const timeEl = document.getElementById('currentDateTime');
        const syncStatusEl = document.getElementById('timeSyncStatus');
        function getBeijingTime() { return dayjs(Date.now() + timeOffset).tz(BJ_TZ); }
        window.getBeijingTime = getBeijingTime;
        function updateDisplay() {
	            if (!timeEl) return;
	            const now = getBeijingTime();
	            const weekdays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
	            timeEl.textContent = now.format('YYYY年MM月DD日 ') + weekdays[now.day()] + ' ' + now.format('HH:mm:ss');
	        }
	        function updateFooterYear(isLocal) {
	            const yearEl = document.getElementById('footerYear');
	            if (!yearEl) return;
	            yearEl.textContent = isLocal ? new Date().getFullYear() : getBeijingTime().year();
	        }
	        async function syncTime() {
	            if (syncStatusEl) syncStatusEl.innerHTML = '<i class="fa fa-spinner fa-spin"></i>';
	            try { await fetch('https://api.shijian.online/timestamp/',{cache:'no-store',mode:'cors'}); } catch(e){}
	            let best = null, bestRtt = Infinity;
	            for (let a = 0; a < 3; a++) {
	                const t0 = performance.now();
	                try {
	                    const res = await fetch('https://api.shijian.online/timestamp/',{cache:'no-store',mode:'cors'});
	                    const data = await res.json();
	                    const t1 = performance.now();
	                    if (data.status === 1 && data.data && data.data.timestamp) {
	                        const rtt = t1 - t0;
	                        if (rtt < bestRtt) { bestRtt = rtt; best = data.data.timestamp + Math.round(rtt/2); }
	                    }
	                } catch(e){ continue; }
	            }
	            if (best) {
	                timeOffset = best - Date.now();
	                if (syncStatusEl) syncStatusEl.innerHTML = '';
	                updateFooterYear();
	            } else {
	                if (syncStatusEl) syncStatusEl.innerHTML = '<i class="fa fa-exclamation-circle" style="color:#f59e0b;opacity:0.8" title="时间同步失败，显示为本机时间"></i>';
	                updateFooterYear(true);
	            }
	            updateDisplay();
	        }
	        function startSync() { syncTime(); if(syncTimer) clearInterval(syncTimer); syncTimer = setInterval(syncTime, SYNC_INTERVAL_MS); }
	        setInterval(updateDisplay, 1000);
	        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', startSync); else startSync();
	    })();
	    </script>
