<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="学府路1号（xuefulu.ai）：快捷导航。打开浏览器，在地址栏输入 xuefulu.ai，按下 Enter 键即可访问学府路1号！">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生考勤</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/plugin/utc.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/plugin/timezone.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#F59E0B',
                        secondary: '#10B981',
                        accent: '#EF4444',
                        neutral: '#1F2937',
                        attendance: {
                            present: '#10B981',
                            late: '#FBBF24',
                            early: '#F97316',
                            absent: '#EF4444',
                            pending: '#6B7280'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }

            .btn-shadow {
                box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            }

            .btn-hover {
                transition: all 0.3s ease;
            }

            .btn-hover:hover {
                transform: translateY(-2px);
            }

            .name-btn {
                @apply flex items-center justify-center rounded-xl font-medium transition-all duration-300 ease-in-out border-2 shadow-md;
            }

            .control-btn {
                @apply px-6 py-3 rounded-xl font-medium transition-all duration-300 ease-in-out shadow-lg;
            }

            .rating-btn {
                @apply px-3 py-1 rounded-md font-medium transition-all duration-200 ease-in-out;
            }

            .stats-card {
                @apply bg-white rounded-xl p-4 border border-gray-200 hover:shadow-md transition-shadow;
            }

            /* 闪烁动画 */
            @keyframes blink {
                0% {
                    background-color: #d1fae5;
                }

                50% {
                    background-color: #a7f3d0;
                }

                100% {
                    background-color: #d1fae5;
                }
            }

            .blink {
                animation: blink 1s infinite;
            }

            .step-card {
                @apply bg-white rounded-xl shadow-lg p-6 border-2 border-dashed border-gray-200 transition-all duration-300 hover:border-primary/50 h-full;
            }

            .step-number {
                @apply inline-flex items-center justify-center w-10 h-10 rounded-full bg-primary text-white font-bold text-xl mb-4;
            }

            .attendance-btn {
                @apply flex items-center justify-center rounded-lg font-medium transition-all duration-300 ease-in-out shadow-md h-10 min-w-0 text-sm w-[80px] md:w-[100px];
            }

            .attendance-btn:hover {
                @apply transform scale-105 shadow-lg;
            }

            .attendance-btn:active {
                @apply transform scale-95;
            }

            /* 美化进度条 */
            .progress-container {
                @apply relative w-full bg-gray-200 rounded-full h-6 shadow-inner overflow-hidden;
            }

            .progress-value {
                @apply absolute top-0 left-0 h-full rounded-full transition-all duration-500 ease-out shadow-md;
            }

            .progress-text {
                @apply absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-white font-medium text-sm;
            }

            /* 表格样式 */
            .attendance-table {
                @apply w-full border-collapse;
            }

            .attendance-table th,
            .attendance-table td {
                @apply border border-gray-200 px-4 py-2 text-center;
            }

            .attendance-table th {
                @apply bg-gray-100 font-semibold text-neutral;
            }

            /* 优化奇偶行样式 - 仅保留奇偶行背景色 */
            .attendance-table tbody tr:nth-child(odd) {
                @apply bg-gray-50;
            }

            .attendance-table tbody tr:nth-child(even) {
                @apply bg-white;
            }

            /* 状态更新按钮样式 */
            .update-btn {
                @apply px-2 py-1 rounded text-xs font-medium transition-all duration-200 ease-in-out mx-0.5;
            }

            /* 今日考勤表格的特殊样式 */
            .today-attendance-late {
                background-color: rgba(251, 191, 36, 0.2);
                color: #92400E;
            }
            .today-attendance-early {
                background-color: rgba(249, 115, 22, 0.2);
                color: #92400E;
            }
            .today-attendance-absent {
                background-color: rgba(239, 68, 68, 0.2);
                color: #7F1D1D;
            }
            .today-attendance-present {
                background-color: rgba(16, 185, 129, 0.2);
                color: #065F46;
            }

            /* 汇总卡片样式 */
            .summary-card {
                @apply rounded-xl p-4 flex flex-row items-center justify-center gap-2 shadow-sm border transition-all duration-300;
            }
            
            .summary-card .count {
                @apply text-2xl font-bold;
            }
            
            .summary-card .label {
                @apply text-sm font-medium whitespace-nowrap;
            }

            /* 今日异常人员名单 */
            .name-list-card {
                @apply rounded-xl p-4 border shadow-sm;
            }

            .name-list-title {
                @apply font-semibold text-sm mb-2;
            }

            .name-list-date {
                @apply text-xs font-normal text-gray-400 ml-1;
            }

            .name-list-content {
                @apply flex flex-wrap gap-1.5;
            }

            .name-list-item {
                @apply inline-block bg-white border border-gray-200 rounded px-2 py-0.5 text-xs text-neutral;
            }

            .name-list-empty {
                @apply text-xs text-gray-400;
            }

            /* 图示数据统计类型切换按钮 */
            .visualize-tabs {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 8px;
                /* 左右内边距对应 SVG viewBox(640) 中 labelWidth(112) 与 rightPad(42) 的比例 */
                padding: 0 6.5625% 2px 17.5%;
                margin-bottom: 16px;
                white-space: nowrap;
                overflow-x: auto;
            }

            .visualize-tab {
                display: inline-block;
                flex: 0 0 auto;
                margin: 0;
                padding: 0 16px;
                height: 40px;
                line-height: 40px;
                font-size: 14px;
                font-weight: 500;
                color: #FFFFFF;
                cursor: pointer;
                vertical-align: middle;
                white-space: nowrap;
                transition: all 0.3s ease;
            }

            /* 选中的统计按钮使用对应的纯色，未选中为 90% 透明度 */
            .visualize-tab.visualize-tab-active[data-tab="absence"] {
                background-color: #EF4444;
                border-color: #EF4444;
            }

            .visualize-tab.visualize-tab-active[data-tab="late"] {
                background-color: #10B981;
                border-color: #10B981;
            }

            .visualize-tab.visualize-tab-active[data-tab="early"] {
                background-color: #7C3AED;
                border-color: #7C3AED;
            }

            /* 图示数据汇总文字 */
            .visualize-summary {
                display: block;
                text-align: center;
                margin-top: 12px;
                font-size: 13px;
                color: #6B7280;
                line-height: 1.5;
            }

            /* 图示数据空状态 */
            .visualize-empty {
                text-align: center;
                color: #9CA3AF;
                padding: 40px 0;
                font-size: 14px;
            }

            /* 考勤记录下拉样式（各状态通用） */
            .status-dropdown {
                position: relative;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 4px;
                user-select: none;
            }

            .status-dropdown-btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 22px;
                height: 22px;
                border: 1px solid #e5e7eb;
                border-radius: 6px;
                background: #f9fafb;
                color: #6b7280;
                font-size: 10px;
                line-height: 1;
                cursor: pointer;
                padding: 0;
                transition: all 0.2s ease;
            }

            .status-dropdown-btn:hover {
                background: #eef2ff;
                color: #4f46e5;
                border-color: #c7d2fe;
            }

            .status-dropdown-menu {
                display: none;
                z-index: 50;
                min-width: 260px;
                max-width: 320px;
                background: #ffffff;
                border: 1px solid #e5e7eb;
                border-radius: 10px;
                box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.18);
                padding: 10px;
                text-align: left;
            }

            .status-dropdown.open .status-dropdown-menu {
                display: block;
            }

            .status-dropdown-title {
                font-weight: 600;
                font-size: 12px;
                color: #374151;
                padding-bottom: 6px;
                margin-bottom: 6px;
                border-bottom: 1px solid #f3f4f6;
            }

            .status-dropdown-list {
                max-height: 220px;
                overflow-y: auto;
            }

            .status-dropdown-item {
                font-size: 12px;
                color: #4b5563;
                padding: 4px 6px;
                border-radius: 6px;
                line-height: 1.4;
            }

            .status-dropdown-item:nth-child(odd) {
                background: #f9fafb;
            }

            .status-dropdown-item:hover {
                background: #eef2ff;
            }

            .status-dropdown-empty {
                font-size: 12px;
                color: #9ca3af;
                text-align: center;
                padding: 8px 0;
            }

            /* 蓝色姓名区域：选中文本时不显示任何选区高亮 */
            #nameDisplay::selection {
                background: transparent;
                color: inherit;
            }
        }
    </style>
</head>

<body class="bg-gray-50 font-sans text-neutral">
    <div class="container mx-auto px-4 pt-8 pb-5 max-w-7xl">
        <!-- 头部区域 -->
        <header class="mb-4 text-center">
            <h1
                class="inline-flex items-center justify-center gap-3 sm:gap-4 text-[clamp(1.8rem,5vw,2.8rem)] font-bold text-neutral mb-3">
                <a href="https://xuefulu.ai/" target="_blank" rel="noopener" style="text-decoration:none;color:inherit;display:inline-flex;align-items:center;gap:inherit;">
                    <i class="fa fa-graduation-cap"
                        style="color:#F59E0B;filter:drop-shadow(0 0 8px rgba(245,158,11,0.3));"></i>
                    <span>学府路1号 · 学生考勤 · <span style="color:#F59E0B">xuefulu</span><span
                            style="color:#EF4444">.ai</span></span>
                </a>
            </h1>

            <a href="https://xuefulu.ai/" target="_blank" rel="noopener"
                class="block text-center text-sm text-gray-500 mb-3 hover:text-primary transition-all duration-300">
                <i class="fa fa-external-link text-primary mr-1"></i>打开浏览器，在地址栏输入 <span class="bg-yellow-300 text-gray-900 font-bold px-1.5 py-0.5 rounded">xuefulu.ai</span>，按下 <span class="bg-yellow-300 text-gray-900 font-bold px-1.5 py-0.5 rounded">Enter</span> 即可访问学府路1号！
            </a>

            <!-- 时间显示 -->
            <div class="text-center py-1.5 text-gray-500 relative z-10 mb-3">
                <span class="text-base font-normal tracking-wide">
                    <span id="currentDateTime">--</span>
                    <span class="text-xs opacity-50 ml-1.5 align-middle" id="timeSyncStatus"><i class="fa fa-spinner fa-spin"></i></span>
                </span>
            </div>

            <!-- 步骤区域 - 左右并排 -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-4">
                <!-- 步骤卡片 - 重置统计数据 -->
                <div class="step-card">
                    <div class="step-number">1</div>
                    <h3 class="text-xl font-semibold mb-4">初始化</h3>
                    <button id="resetStatsBtn"
                        class="w-full control-btn bg-red-500 text-white hover:bg-red-600 btn-hover">
                        <i class="fa fa-refresh mr-2"></i>清除缓存并刷新
                    </button>
                    <p class="mt-4 text-gray-500 text-sm">点击此按钮清除页面缓存并刷新页面</p>
                </div>

                <!-- 新增区域，显示姓名 -->
                <div id="nameDisplay"
                    class="bg-blue-500 text-white font-bold text-center flex items-center justify-center text-[clamp(5rem,3vw,10rem)] rounded-xl p-6 border-2 border-dashed border-gray-200 transition-all duration-300 hover:border-primary/50 h-full cursor-pointer active:scale-95 select-none"
                    style="box-shadow:none;-webkit-tap-highlight-color:transparent;"
                    title="点击此处标记为出勤；点击区域外空白处标记为缺勤">
                    暂无考勤
                </div>

                <!-- 步骤卡片 - 导入Excel文件 -->
                <div class="step-card">
                    <div class="step-number">2</div>
                    <h3 class="text-xl font-semibold mb-4">导入学生名单</h3>
                    <input type="file" id="excelFile" accept=".xlsx,.xls" class="hidden">
                    <label for="excelFile"
                        class="block w-full cursor-pointer bg-primary/10 hover:bg-primary/20 text-primary px-8 py-4 rounded-xl inline-flex items-center justify-center gap-2 transition-all duration-300 ease-in-out">
                        <i class="fa fa-file-excel-o text-xl"></i>
                        <span class="font-medium">选择Excel文件</span>
                    </label>
                    <p id="fileInfo" class="mt-4 text-gray-500">请选择Excel文件导入学生名单(需包含"姓名"列)</p>
                </div>
            </div>
        </header>

        <!-- 主内容区域 -->
        <main class="space-y-4">
            <!-- 考勤区域 -->
            <div id="attendanceSection" class="bg-white rounded-xl shadow-lg p-6 mb-4">
                <div class="flex flex-col gap-3 mb-6">
                    <div class="progress-container">
                        <div id="progressBar" class="progress-value bg-gradient-to-r from-blue-500 to-blue-700"></div>
                        <div id="progressText" class="progress-text"></div>
                    </div>
                </div>

                <div id="attendanceButtons" class="flex flex-wrap justify-center gap-2">
                    <button id="nameBtn" class="attendance-btn bg-white text-neutral border-gray-300" disabled>
                        <span class="font-bold">序号和姓名</span>
                    </button>
                    <button id="historyToggleBtn"
                        class="attendance-btn bg-white text-neutral border-gray-300" aria-pressed="false" disabled>
                        <i class="fa fa-history mr-1"></i>历史考勤
                    </button>
                    <button id="lateBtn"
                        class="attendance-btn bg-attendance-late/90 text-white hover:bg-attendance-late border border-attendance-late/30"
                        disabled>
                        <i class="fa fa-clock-o mr-1"></i>迟到
                    </button>
                    <button id="earlyLeaveBtn"
                        class="attendance-btn bg-attendance-early/90 text-white hover:bg-attendance-early border border-attendance-early/30"
                        disabled>
                        <i class="fa fa-sign-out mr-1"></i>早退
                    </button>
                    <button id="absentBtn"
                        class="attendance-btn bg-attendance-absent/90 text-white hover:bg-attendance-absent border border-attendance-absent/30"
                        disabled>
                        <i class="fa fa-times mr-1"></i>缺勤
                    </button>
                    <button id="presentBtn"
                        class="attendance-btn bg-attendance-present/90 text-white hover:bg-attendance-present border border-attendance-present/30"
                        disabled>
                        <i class="fa fa-check mr-1"></i>出勤
                    </button>
                    <button id="visualizeBtn"
                        class="attendance-btn bg-purple-500 text-white hover:bg-purple-600 transition-colors" disabled>
                        <i class="fa fa-bar-chart mr-1"></i> 图示数据
                    </button>
                    <button id="exportStatsBtn"
                        class="attendance-btn bg-blue-500 text-white hover:bg-blue-600 transition-colors" disabled>
                        <i class="fa fa-download mr-1"></i> 导出数据
                    </button>
                    <button id="mainScreenshotBtn"
                        class="attendance-btn bg-green-500 text-white hover:bg-green-600 transition-colors" disabled>
                        <i class="fa fa-camera mr-1"></i> 保存截图
                    </button>
                </div>
            </div>

            <!-- 历史考勤面板（默认隐藏，点击"历史考勤"按钮后展示） -->
            <div id="historyAttendancePanel" class="bg-white rounded-xl shadow-lg p-6 hidden">
                <div class="overflow-x-auto">
                    <table id="attendanceTable" class="attendance-table">
                        <thead>
                            <tr>
                                <th>序号</th>
                                <th>姓名</th>
                                <th>迟到次数</th>
                                <th>早退次数</th>
                                <th>缺勤次数</th>
                                <th>出勤次数</th>
                            </tr>
                        </thead>
                        <tbody id="attendanceTableBody">
                            <!-- 表格内容将通过JavaScript动态生成 -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 今日考勤区域 -->
            <div id="todayAttendanceSection" class="bg-white rounded-xl shadow-lg p-6 mb-4">
                <!-- 今日考勤汇总数据 -->
                <div id="todaySummary" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-3">
                    <div class="summary-card border-attendance-present/30 bg-attendance-present/5">
                        <div class="label text-attendance-present">出勤人数</div>
                        <div id="summaryPresent" class="count text-attendance-present">0</div>
                        <div class="percent text-xs text-gray-500">0%</div>
                    </div>
                    <div class="summary-card border-attendance-absent/30 bg-attendance-absent/5">
                        <div class="label text-attendance-absent">缺勤人数</div>
                        <div id="summaryAbsent" class="count text-attendance-absent">0</div>
                        <div class="percent text-xs text-gray-500">0%</div>
                    </div>
                    <div class="summary-card border-attendance-late/30 bg-attendance-late/5">
                        <div class="label text-attendance-late">迟到人数</div>
                        <div id="summaryLate" class="count text-attendance-late">0</div>
                        <div class="percent text-xs text-gray-500">0%</div>
                    </div>
                    <div class="summary-card border-attendance-early/30 bg-attendance-early/5">
                        <div class="label text-attendance-early">早退人数</div>
                        <div id="summaryEarly" class="count text-attendance-early">0</div>
                        <div class="percent text-xs text-gray-500">0%</div>
                    </div>
                </div>

                <!-- 今日异常人员名单 -->
                <div id="todayNameLists" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                    <div class="name-list-card border-attendance-absent/30 bg-attendance-absent/5">
                        <div class="name-list-title text-attendance-absent">
                            <i class="fa fa-times mr-1"></i>缺勤名单<span class="name-list-date"></span>
                        </div>
                        <div id="absentNameList" class="name-list-content"></div>
                    </div>
                    <div class="name-list-card border-attendance-late/30 bg-attendance-late/5">
                        <div class="name-list-title text-attendance-late">
                            <i class="fa fa-clock-o mr-1"></i>迟到名单<span class="name-list-date"></span>
                        </div>
                        <div id="lateNameList" class="name-list-content"></div>
                    </div>
                    <div class="name-list-card border-attendance-early/30 bg-attendance-early/5">
                        <div class="name-list-title text-attendance-early">
                            <i class="fa fa-sign-out mr-1"></i>早退名单<span class="name-list-date"></span>
                        </div>
                        <div id="earlyNameList" class="name-list-content"></div>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table id="todayAttendanceTable" class="attendance-table">
                        <thead>
                            <tr>
                                <th>序号</th>
                                <th>姓名</th>
                                <th>迟到次数</th>
                                <th>早退次数</th>
                                <th>缺勤次数</th>
                                <th>出勤次数</th>
                                <th>状态更新</th>
                            </tr>
                        </thead>
                        <tbody id="todayAttendanceTableBody">
                            <!-- 表格内容将通过JavaScript动态生成 -->
                        </tbody>
                    </table>
                </div>

            </div>
        </main>

        <!-- 图示数据弹窗 -->
        <div id="visualizeModal"
            class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4 backdrop-blur-sm">
            <div class="bg-white shadow-2xl w-full max-w-2xl max-h-[85vh] overflow-y-auto">
                <div class="h-1.5 bg-gradient-to-r from-attendance-absent via-attendance-late to-attendance-present">
                </div>
                <div class="p-6">
                    <div id="visualizeContent">
                        <!-- 统计类型切换 -->
                        <div id="visualizeTabs" class="visualize-tabs" role="tablist"
                            aria-label="图示数据统计类型">
                            <button
                                class="visualize-tab visualize-tab-active bg-attendance-absent/90 text-white hover:bg-attendance-absent border border-attendance-absent/30"
                                data-tab="absence" role="tab" aria-selected="true">
                                <i class="fa fa-times mr-1"></i>缺勤统计
                            </button>
                            <button
                                class="visualize-tab bg-attendance-present/90 text-white hover:bg-attendance-present border border-attendance-present/30"
                                data-tab="late" role="tab" aria-selected="false">
                                <i class="fa fa-clock-o mr-1"></i>迟到统计
                            </button>
                            <button
                                class="visualize-tab bg-purple-500/90 text-white hover:bg-purple-600 border border-purple-500/30"
                                data-tab="early" role="tab" aria-selected="false">
                                <i class="fa fa-sign-out mr-1"></i>早退统计
                            </button>
                            <button id="saveScreenshotBtn"
                                class="visualize-tab bg-green-500 text-white hover:bg-green-600"
                                type="button">
                                <i class="fa fa-camera mr-1"></i>保存截图
                            </button>
                        </div>
                        <div id="absencePanel">
                            <div id="absenceChart" class="w-full"></div>

        // 全局变量

        // DOM 元素
