<head data-page-node-id="Tf6hdUMUuWhLRbPCz31pSs">
<meta charset="UTF-8" data-page-node-id="ixFGYuhwBIIM8A9Fw8l2hf">
<meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="EZ9aiVMH20Q3tzBx74CmKH">
<title>每日任务清单 · 周计划</title>
<style>
  :root {
    --bg-page: #FAFAF8;
    --bg-card: #FFFFFF;
    --text-primary: #1A1A1A;
    --text-secondary: #555;
    --text-tertiary: #999;
    --border-soft: rgba(0,0,0,0.08);
    --border-mid: rgba(0,0,0,0.20);
    --accent: #3B6D11;
    --radius-md: 8px;
    --radius-lg: 12px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg-page);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC",
                 "Helvetica Neue", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 28px 24px 56px;
  }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
  }
  .toolbar .hint { font-size: 12px; color: var(--text-tertiary); }
  .print-btn {
    background: var(--text-primary);
    color: white;
    border: none;
    border-radius: var(--radius-md);
    padding: 8px 16px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
  }
  .print-btn:hover { opacity: 0.85; }

  header h1 {
    font-size: 19px;
    font-weight: 500;
    margin: 0 0 10px 0;
  }
  .meta-row {
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 18px;
  }
  .meta-row input[type="date"] {
    font-family: inherit;
    font-size: 12px;
    padding: 4px 8px;
    border: 0.5px solid var(--border-mid);
    border-radius: 6px;
    background: white;
    cursor: pointer;
    color: var(--text-primary);
  }
  .line {
    display: inline-block;
    min-width: 120px;
    border-bottom: 0.5px solid var(--border-mid);
    height: 1em;
  }
  .name-input {
    border: none;
    border-bottom: 0.5px solid var(--border-mid);
    background: transparent;
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
    padding: 2px 8px;
    min-width: 140px;
    text-align: center;
    outline: none;
  }
  .name-input:focus {
    border-bottom-color: var(--text-primary);
    border-bottom-width: 1px;
  }

  .grid {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    background: white;
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  .grid th, .grid td {
    border: 1px solid var(--border-soft);
    text-align: center;
    padding: 10px 4px;
    font-weight: 400;
    font-size: 12px;
    color: var(--text-primary);
  }
  .grid tbody tr:nth-child(even) td { background: rgba(0,0,0,0.018); }

  .col-task { width: 22%; text-align: left; padding-left: 16px; }
  .col-day  { width: 4.5%; }
  .col-points { width: 15%; }

  .grid thead th {
    background: var(--bg-page);
    font-weight: 500;
    color: var(--text-secondary);
  }
  .day-name { font-size: 11px; margin-bottom: 1px; }
  .day-date { font-size: 10px; color: var(--text-tertiary); font-weight: 400; }
  .col-day.today .day-date { color: var(--accent); font-weight: 500; }
  .col-points th { font-size: 12px; }

  .task-name {
    text-align: left;
    padding-left: 16px;
    font-size: 13px;
    color: var(--text-primary);
  }

  .box {
    display: inline-block;
    width: 18px;
    height: 18px;
    border: 1.5px solid var(--text-tertiary);
    border-radius: 4px;
    background: white;
    cursor: pointer;
    transition: all 0.15s;
    vertical-align: middle;
    position: relative;
  }
  .box:hover { border-color: var(--text-primary); }
  .box.done {
    background: var(--accent);
    border-color: var(--accent);
  }
  .box.done::after {
    content: '';
    position: absolute;
    left: 5px;
    top: 1px;
    width: 6px;
    height: 11px;
    border-right: 2px solid white;
    border-bottom: 2px solid white;
    transform: rotate(45deg);
  }

  .totals-row td {
    background: var(--bg-page) !important;
    font-size: 11px;
    color: var(--text-secondary);
  }
  .totals-cell {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-weight: 500;
  }
  .totals-cell.full { color: var(--accent); }

  .points-cell {
    font-weight: 500;
    font-size: 13px;
    color: var(--text-secondary);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .points-cell.big {
    color: var(--accent);
    font-weight: 500;
  }
  .points-total {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-weight: 500;
    font-size: 11px;
  }
  .points-total.full { color: var(--accent); }

  .actions-row {
    margin-top: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .reset-btn {
    background: transparent;
    border: 0.5px solid var(--border-mid);
    border-radius: var(--radius-md);
    padding: 6px 12px;
    font-size: 12px;
    color: var(--text-secondary);
    cursor: pointer;
    font-family: inherit;
  }
  .reset-btn:hover { border-color: var(--text-primary); color: var(--text-primary); }
  .tip { font-size: 11px; color: var(--text-tertiary); }

  @media print {
    @page {
      size: A4 landscape;
      margin: 10mm 12mm;
    }
    body { background: white !important; font-size: 11px; }
    main { max-width: 100% !important; padding: 0 !important; }
    .no-print { display: none !important; }

    header h1 { font-size: 17px; color: #000; }
    .meta-row,
    .meta-row .line,
    .meta-row .name-input { color: #000; }
    .meta-row .name-input { border-bottom-color: #000; }

    .grid { border: 1.5px solid #000; border-radius: 0; }
    .grid th, .grid td {
      border: 1px solid #000;
      padding: 6px 2px;
      font-size: 10px;
      color: #000;
    }
    .col-task, .task-name { padding-left: 12px !important; }
    .grid thead th { background: white !important; color: #000; font-weight: 500; }
    .day-name { font-size: 10px; color: #000; line-height: 1.2; }
    .day-date { font-size: 9px; color: #000 !important; }

    .box {
      border: 1.5px solid #000 !important;
      background: white !important;
      cursor: default;
      width: 14px;
      height: 14px;
    }
    .box.done { background: white !important; border-color: #000 !important; }
    .box.done::after { display: none !important; }

    .grid tbody tr:nth-child(even) td { background: white !important; }
    .totals-row td { background: white !important; color: #000; }
    .totals-cell.full { color: #000 !important; }
    .points-cell { color: #000 !important; }
    .points-cell.big { color: #000 !important; font-weight: 500; }
    .points-total { color: #000 !important; }
    .points-total.full { color: #000 !important; }
  }

  @media (max-width: 900px) {
    main { padding: 20px 14px 40px; overflow-x: auto; }
    .grid { min-width: 900px; }
  }
</style>
</head>

<script>
  const DAY_NAMES = ["周一", "周二", "周三", "周四", "周五", "周六", "周日"];
  const POINT = [100, 50, 50, 100, 100, 50, 50];
  const TOTAL_POINTS = POINT.reduce((a, b) => a + b, 0);
  const STORAGE_KEY = "weekly-checklist-v1";

  function startKey(d) {
    return d.getFullYear() + "-" +
           String(d.getMonth() + 1).padStart(2, "0") + "-" +
           String(d.getDate()).padStart(2, "0");
  }

  function getStartDate() {
    const v = document.getElementById("start-date").value;
    if (!v) return new Date();
    const d = new Date(v + "T00:00:00");
    return isNaN(d) ? new Date() : d;
  }

  function renderHeaders(start) {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    document.querySelectorAll("th.col-day").forEach(th => {
      const i = parseInt(th.dataset.d, 10);
      const d = new Date(start);
      d.setDate(start.getDate() + i);
      const wd = (d.getDay() + 6) % 7;
      th.classList.toggle("today", d.getTime() === today.getTime());
      th.querySelector(".day-name").textContent = DAY_NAMES[wd];
      th.querySelector(".day-date").textContent = (d.getMonth() + 1) + "/" + d.getDate();
    });
  }

  function refreshTotals() {
    let weekTotal = 0;
    document.querySelectorAll(".totals-cell").forEach(cell => {
      const d = parseInt(cell.dataset.d, 10);
      let n = 0, pts = 0;
      document.querySelectorAll('.box[data-d="' + d + '"]').forEach(box => {
        const t = parseInt(box.dataset.t, 10);
        if (box.classList.contains("done")) {
          n++;
          pts += POINT[t];
        }
      });
      cell.textContent = n ? (n + " 项 · " + pts + " 分") : "";
      cell.classList.toggle("full", n === POINT.length);
      if (pts === TOTAL_POINTS && n === POINT.length) weekTotal++;
    });
    const pt = document.querySelector(".points-total");
    if (pt) {
      pt.textContent = TOTAL_POINTS + " 分";
      pt.classList.toggle("full", weekTotal > 0);
    }
  }

  function currentKey() { return startKey(getStartDate()); }

  function applyState(state) {
    document.querySelectorAll(".box").forEach(box => {
      const key = box.dataset.t + "-" + box.dataset.d;
      box.classList.toggle("done", !!state[key]);
    });
  }

  function loadState(key) {
    try {
      const all = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      return all[key] || {};
    } catch (e) { return {}; }
  }
  function saveState(key, state) {
    try {
      const all = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      all[key] = state;
      const keys = Object.keys(all).sort().slice(-30);
      const trimmed = {};
      keys.forEach(k => trimmed[k] = all[k]);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(trimmed));
    } catch (e) {}
  }

  function rebuild() {
    const start = getStartDate();
    renderHeaders(start);
    applyState(loadState(currentKey()));
    refreshTotals();
  }

  document.addEventListener("click", e => {
    const box = e.target.closest(".box");
    if (!box) return;
    const key = box.dataset.t + "-" + box.dataset.d;
    const state = loadState(currentKey());
    if (state[key]) delete state[key]; else state[key] = true;
    saveState(currentKey(), state);
    box.classList.toggle("done", !!state[key]);
    refreshTotals();
  });

  document.getElementById("start-date").addEventListener("change", rebuild);

  document.getElementById("reset").addEventListener("click", () => {
    if (!confirm("确认清空本周所有勾选？")) return;
    const key = currentKey();
    saveState(key, {});
    document.querySelectorAll(".box.done").forEach(b => b.classList.remove("done"));
    refreshTotals();
  });

  const NAME_KEY = "weekly-checklist-name";
  const DEFAULT_NAME = "朱伯睿";

  const nameInput = document.getElementById("name-input");
  try {
    const savedName = localStorage.getItem(NAME_KEY);
    if (savedName) nameInput.value = savedName;
  } catch (e) {}
  nameInput.addEventListener("input", () => {
    try { localStorage.setItem(NAME_KEY, nameInput.value); } catch (e) {}
  });

  const dateInput = document.getElementById("start-date");
  dateInput.value = startKey(new Date());
  rebuild();
</script>
