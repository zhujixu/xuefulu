<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的任务清单 · 打卡表</title>
<style>
  :root {
    --cream: #FFFBF3;
    --card: #FFFFFF;
    --ink: #33415C;
    --ink-2: #6B7A99;
    --ink-3: #A8B4C9;
    --line: #EEF2F9;
    --line-2: #DFE7F3;
    --coral: #FF7A59;
    --sky: #3E9BE9;
    --mint: #17C3B2;
    --sun: #FFC93C;
    --grape: #9B8CFA;
    --pink: #FF6FA5;
    --radius: 22px;
    --shadow: 0 2px 4px rgba(51,65,92,.03), 0 14px 30px -18px rgba(51,65,92,.35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    background:
      radial-gradient(circle at 6% 0%, #FFE7D8 0%, rgba(255,231,216,0) 34%),
      radial-gradient(circle at 96% 2%, #DDEEFF 0%, rgba(221,238,255,0) 32%),
      radial-gradient(circle at 50% 108%, #E2F8F0 0%, rgba(226,248,240,0) 42%),
      var(--cream);
    background-attachment: fixed;
    color: var(--ink);
    font-family: "Yuanti SC", "Yuanti TC", "PingFang SC", "Hiragino Sans GB",
                 "Microsoft YaHei", system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* 背景圆点 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: radial-gradient(rgba(255,196,166,.55) 1.6px, rgba(255,196,166,0) 1.7px);
    background-size: 24px 24px;
    opacity: .55;
    pointer-events: none;
    z-index: 0;
  }

  .page {
    position: relative;
    z-index: 1;
    max-width: 1440px;
    margin: 0 auto;
    padding: 38px 32px 70px;
  }

  /* ─── 顶部 ──────────────────────────────────── */
  .hero { margin-bottom: 22px; }

  .hero-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 22px;
    flex-wrap: wrap;
  }

  .brand { display: flex; align-items: center; gap: 14px; }

  .logo {
    width: 54px;
    height: 54px;
    border-radius: 18px;
    display: grid;
    place-items: center;
    font-size: 27px;
    background: #fff;
    box-shadow: 0 8px 18px -10px rgba(51,65,92,.45);
    transform: rotate(-6deg);
    flex: 0 0 auto;
  }

  h1 {
    margin: 0;
    font-size: 29px;
    font-weight: 800;
    letter-spacing: .01em;
    line-height: 1.15;
    color: var(--ink);
  }
  .tagline {
    margin: 4px 0 0;
    font-size: 12.5px;
    color: var(--ink-2);
    letter-spacing: .01em;
  }

  .controls { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .is-hidden { display: none !important; }

  /* 模式切换 */
  .segmented {
    display: inline-flex;
    padding: 3px;
    gap: 2px;
    background: #fff;
    border: 2px solid #FFE4D5;
    border-radius: 16px;
  }
  .seg {
    border: none;
    background: transparent;
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: #96A2B8;
    padding: 7px 14px;
    border-radius: 12px;
    cursor: pointer;
    white-space: nowrap;
    transition: color .18s, background .18s, box-shadow .18s;
  }
  .seg:hover { color: var(--ink-2); }
  .seg.active {
    background: linear-gradient(180deg, #FF9169, #FF7A59);
    color: #fff;
    box-shadow: 0 5px 12px -5px rgba(255,122,89,.95);
  }

  .month-input {
    appearance: none;
    -webkit-appearance: none;
    border: 2px solid #E3EBF7;
    background: #fff;
    border-radius: 14px;
    padding: 8px 12px;
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
    outline: none;
    transition: border-color .18s, box-shadow .18s;
  }
  .month-input:hover { border-color: #BFDCF7; }
  .month-input:focus {
    border-color: var(--sky);
    box-shadow: 0 0 0 4px rgba(62,155,233,.14);
  }

  .btn-print {
    border: none;
    font: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: #fff;
    padding: 9px 18px;
    border-radius: 14px;
    cursor: pointer;
    background: linear-gradient(180deg, #43D6BC, #17C3B2);
    box-shadow: 0 8px 16px -8px rgba(23,195,178,.95), inset 0 1px 0 rgba(255,255,255,.35);
    transition: transform .14s, box-shadow .18s;
  }
  .btn-print:hover {
    transform: translateY(-1px);
    box-shadow: 0 12px 20px -8px rgba(23,195,178,.85), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .btn-print:active { transform: translateY(0); }

  /* 姓名 / 周期 */
  .infobar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 16px;
  }

  .name-chip, .date-chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: #fff;
    border-radius: 999px;
    padding: 7px 15px;
    font-size: 12.5px;
    color: var(--ink-2);
    font-weight: 600;
    box-shadow: 0 4px 12px -8px rgba(51,65,92,.5);
  }
  .name-chip { border: 2px dashed #FFD3BF; }
  .date-chip { border: 2px solid #E3EBF7; color: var(--ink); }

  .name-input {
    border: none;
    background: transparent;
    font: inherit;
    font-size: 14px;
    font-weight: 800;
    color: var(--coral);
    width: 84px;
    padding: 0;
    text-align: center;
    outline: none;
  }
  .name-input::placeholder { color: #FFC0A8; }

  .date-chip .soft { color: var(--ink-3); font-weight: 600; }

  /* ─── 表卡 ──────────────────────────────────── */
  .panel {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    margin-bottom: 18px;
  }

  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 20px;
    background: linear-gradient(90deg, #FFF1E7, #FFF8F1 60%, #FFFDFA);
    border-bottom: 2px dashed #F6DFCD;
  }
  .panel:nth-child(2) .panel-head {
    background: linear-gradient(90deg, #E8F3FF, #F3F9FF 60%, #FBFDFF);
    border-bottom-color: #D6E7F9;
  }

  .range-tag {
    font-size: 13px;
    font-weight: 800;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    letter-spacing: .01em;
  }
  .range-tag em {
    font-style: normal;
    color: var(--ink-3);
    font-weight: 700;
    margin: 0 6px;
  }

  .half-badge {
    font-size: 11px;
    font-weight: 700;
    color: #C4713F;
    background: #FFE0CB;
    padding: 3px 11px;
    border-radius: 999px;
  }
  .panel:nth-child(2) .half-badge {
    color: #3C7FB8;
    background: #D6E9FB;
  }

  .table-wrap { overflow-x: auto; }

  .grid {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }

  .grid th, .grid td {
    border-left: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    text-align: center;
    padding: 0;
  }
  .grid tr > *:first-child { border-left: none; }

  .grid thead th {
    background: #F9FBFF;
    padding: 11px 2px 9px;
    position: relative;
  }

  .dnum {
    font-size: 16px;
    font-weight: 800;
    color: var(--ink);
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }
  .dw {
    font-size: 10px;
    color: var(--ink-3);
    margin-top: 3px;
    font-weight: 600;
  }

  th.sat { background: #FFF5F9; }
  th.sun { background: #F1F8FF; }
  th.sat .dw { color: #FF9DB8; }
  th.sun .dw { color: #79B9EC; }
  th.weekend .dnum { color: #5C6C8A; }

  th.today { background: #FFF8DF; }
  th.today::before {
    content: '';
    position: absolute;
    inset: 0 0 auto 0;
    height: 3px;
    background: linear-gradient(90deg, #FFC93C, #FFB300);
  }
  th.today::after {
    content: '★';
    position: absolute;
    top: 3px;
    right: 4px;
    font-size: 9px;
    color: #FFB300;
    line-height: 1;
  }
  th.today .dnum { color: #C98A00; }
  th.today .dw { color: #C98A00; }

  .grid thead .th-task {
    text-align: left;
    padding-left: 20px;
    padding-right: 12px;
    font-size: 11px;
    font-weight: 700;
    color: var(--ink-3);
    background: #F9FBFF;
  }
  .grid thead .th-pts {
    font-size: 11px;
    font-weight: 700;
    color: var(--ink-3);
    background: #F9FBFF;
  }

  /* 跨月：月初分隔 */
  .dm {
    height: 11px;
    font-size: 9px;
    line-height: 1;
    font-weight: 800;
    color: var(--sky);
    margin-bottom: 3px;
  }
  th.month-start, td.month-start {
    border-left: 2px solid #CFE3F8 !important;
  }

  .grid tbody td { height: 42px; }
  .grid tbody tr { transition: background .14s ease; }
  .grid tbody tr:hover td { background: #FBFDFF; }

  td.today-col { background: #FFFCF0; }
  .grid tbody tr:hover td.today-col { background: #FFF7DC; }

  td.task-cell {
    text-align: left;
    padding-left: 16px;
    padding-right: 10px;
    border-right: 1px solid var(--line-2);
    background: var(--rc-soft, #fff);
    box-shadow: inset 3px 0 0 var(--rc, transparent);
  }

  .t-ico {
    display: inline-grid;
    place-items: center;
    width: 26px;
    height: 26px;
    border-radius: 9px;
    font-size: 14px;
    margin-right: 9px;
    vertical-align: middle;
    line-height: 1;
  }
  .t-name {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
    vertical-align: middle;
  }

  td.box-cell { text-align: center; vertical-align: middle; }

  .box {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 25px;
    height: 25px;
    border-radius: 9px;
    border: 2.5px solid #DCE4F2;
    background: #fff;
    cursor: pointer;
    vertical-align: middle;
    transition: transform .12s ease, border-color .16s;
    position: relative;
  }
  .box:hover {
    border-color: var(--rc);
    box-shadow: 0 0 0 4px rgba(51,65,92,.06);
  }
  .box:active { transform: scale(.9); }
  .box.done {
    background: var(--rc);
    border-color: var(--rc);
    box-shadow: 0 3px 8px -3px var(--rc);
  }
  .box.done::after {
    content: '';
    width: 6px;
    height: 10px;
    border-right: 2.5px solid #fff;
    border-bottom: 2.5px solid #fff;
    transform: rotate(43deg) translate(-1px, -1px);
    margin-top: -3px;
  }
  .box.pop { animation: pop .3s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop {
    0% { transform: scale(.78); }
    60% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }

  td.pts-cell {
    border-left: 1px solid var(--line-2);
    font-size: 12.5px;
    font-weight: 800;
    color: var(--ink-2);
    font-variant-numeric: tabular-nums;
    background: #FCFDFF;
  }
  td.pts-cell.hi {
    color: var(--coral);
    background: #FFF7F3;
  }

  .grid tfoot td {
    background: #FFFCF5;
    border-top: 2px solid #F6E7D4;
    height: 36px;
    font-size: 12px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--ink-3);
  }
  td.sum-label {
    text-align: left;
    padding-left: 20px;
    color: #B98A56;
    border-right: 1px solid var(--line-2);
    font-size: 11.5px;
  }
  td.sum-cell { font-weight: 800; }
  td.sum-cell:empty::after {
    content: '·';
    color: #D5DEEB;
    font-weight: 400;
  }
  td.sum-cell.has { color: #E08A3C; }
  td.sum-cell.full {
    background: #FFF1CE;
    color: #C98A00;
  }
  td.sum-total {
    color: #C98A00;
    border-left: 1px solid var(--line-2);
    background: #FFFDF7;
  }

  /* ─── 底部 ──────────────────────────────────── */
  .actions-row {
    margin-top: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .reset-btn {
    background: #fff;
    border: 2px solid #E7EDF7;
    border-radius: 999px;
    padding: 7px 16px;
    font: inherit;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-2);
    cursor: pointer;
    transition: all .18s;
  }
  .reset-btn:hover {
    border-color: #FFC9B4;
    color: var(--coral);
  }
  .tip { font-size: 11.5px; color: var(--ink-3); }

  /* ─── 响应式 ────────────────────────────────── */
  @media (max-width: 900px) {
    .page { padding: 24px 14px 48px; }
    h1 { font-size: 23px; }
    .logo { width: 46px; height: 46px; font-size: 23px; border-radius: 15px; }
    .grid { min-width: 880px; }
  }

  /* ─── 打印：A4 横向 · 单页 · 黑白清爽 ─────────── */
  @media print {
    @page { size: A4 landscape; margin: 8mm 9mm; }

    html, body {
      background: #fff !important;
      width: 100%;
    }
    body::before { display: none !important; }
    body { font-size: 10px; color: #000; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }

    .page {
      max-width: none;
      width: 100%;
      margin: 0;
      padding: 0;
    }
    .no-print { display: none !important; }

    .hero { margin-bottom: 4mm; }
    .logo { display: none; }
    h1 { font-size: 16px; color: #000; font-weight: 700; }
    .tagline { display: none; }

    .infobar { margin-top: 2.5mm; gap: 5mm; }
    .name-chip, .date-chip {
      border: none;
      box-shadow: none;
      padding: 0;
      background: transparent !important;
      font-size: 9.5px;
      color: #000;
    }
    .name-input {
      width: auto;
      min-width: 18mm;
      font-size: 10.5px;
      font-weight: 700;
      color: #000;
      border-bottom: none;
      padding: 0;
      text-align: left;
    }
    .date-chip .soft { color: #000; }

    .panel {
      border: 0.8pt solid #000;
      border-radius: 0;
      box-shadow: none;
      margin-bottom: 3.2mm;
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .panel-head {
      padding: 1.3mm 2mm;
      border-bottom: 0.6pt solid #000;
      background: #fff !important;
    }
    .range-tag { font-size: 9.5px; color: #000; }
    .range-tag em { color: #000; }
    .half-badge, .panel:nth-child(2) .half-badge {
      background: #fff !important;
      color: #000 !important;
      font-size: 8px;
      padding: 0;
    }

    .table-wrap { overflow: visible !important; }
    .grid { min-width: 0 !important; width: 100%; }

    .grid th, .grid td {
      border: 0.4pt solid #000 !important;
      background: #fff !important;
    }
    .grid thead th { padding: 1.3mm 0.3mm; }
    .grid thead .th-task, .grid thead .th-pts {
      background: #fff !important;
      color: #000;
      font-size: 8px;
      padding-left: 2mm;
    }
    .dnum { font-size: 10px; color: #000; }
    .dw { font-size: 7px; color: #000; margin-top: 0.4mm; }
    .dm { font-size: 6.5px; color: #000; height: 2.6mm; margin-bottom: 0; }
    th.sat .dw, th.sun .dw, th.weekend .dnum { color: #000 !important; }
    th.today::before, th.today::after { display: none; }
    th.today .dnum, th.today .dw, th.today .dm { color: #000; }
    th.month-start, td.month-start { border-left: 0.9pt solid #000 !important; }

    .grid tbody td { height: 6.6mm; }
    .grid tbody tr:hover td { background: #fff !important; }
    td.today-col, .grid tbody tr:hover td.today-col { background: #fff !important; }

    td.task-cell {
      padding-left: 2mm;
      padding-right: 1mm;
      background: #fff !important;
      box-shadow: none !important;
    }
    th.sat, th.sun, th.weekend { background: #fff !important; }
    .t-ico { display: none; }
    .t-name { font-size: 9.5px; color: #000; font-weight: 700; }

    .box {
      width: 4.2mm;
      height: 4.2mm;
      border: 0.7pt solid #000 !important;
      border-radius: 0.8mm;
      background: #fff !important;
      box-shadow: none !important;
    }
    .box.done { background: #fff !important; border-color: #000 !important; }
    .box.done::after { display: none !important; }

    td.pts-cell { font-size: 9px; color: #000; background: #fff !important; }
    td.pts-cell.hi { color: #000; }

    .grid tfoot td {
      background: #fff !important;
      height: 6mm;
      font-size: 9px;
      color: #000;
      border-top: 0.6pt solid #000 !important;
    }
    td.sum-label { color: #000; font-size: 8px; padding-left: 2mm; }
    td.sum-cell, td.sum-cell.has, td.sum-cell.full { color: #000; background: #fff !important; }
    td.sum-cell:empty::after { color: #000; }
    td.sum-total { color: #000; background: #fff !important; }
  }
</style>
</head>
<body>
<div class="page">

  <header class="hero">
    <div class="hero-top">
      <div class="brand">
        <div class="logo">🌈</div>
        <div>
          <h1>我的任务清单</h1>
          <p class="tagline">每天画一个小勾勾，攒满一整个月的星星 ✨</p>
        </div>
      </div>

      <div class="controls no-print">
        <div class="segmented" id="mode-switch">
          <button class="seg active" data-mode="month" type="button">按月份</button>
          <button class="seg" data-mode="range" type="button">指定起始日期</button>
        </div>
        <input type="month" id="month-input" class="month-input">
        <input type="date" id="date-input" class="month-input is-hidden">
        <button class="btn-print" onclick="window.print()">打印</button>
      </div>
    </div>

    <div class="infobar">
      <label class="name-chip">
        <span>我是</span>
        <input type="text" class="name-input" id="name-input" value="朱伯睿" maxlength="20" spellcheck="false">
      </label>
      <span class="date-chip"><span id="month-label"></span></span>
    </div>
  </header>

  <div id="month-tables"></div>

  <div class="actions-row no-print">
    <button class="reset-btn" id="reset">清空本月</button>
    <span class="tip">点一下格子就能打勾 · 取消再点一次 · 数据会自动存在这台设备上</span>
  </div>
</div>

<script>
  const DAY_NAMES = ["周一", "周二", "周三", "周四", "周五", "周六", "周日"];
  const POINT = [100, 100, 100, 200, 100, 100, 100, 100, 100];
  const TOTAL_POINTS = POINT.reduce((a, b) => a + b, 0);
  const STORAGE_KEY = "monthly-checklist-v1";
  const NAME_KEY = "weekly-checklist-name";
  const MODE_KEY = "checklist-mode-v1";

  /* 图标 + 主题色 + 任务名 + 序号 + 分值 */
  const TASKS = [
    ["📖", "英文阅读", 0, 100, "#3E9BE9"],
    ["🧮", "数学拓展", 1, 100, "#9B8CFA"],
    ["📚", "中文阅读", 2, 100, "#FF9F43"],
    ["🏊", "游泳长训", 3, 200, "#17C3B2"],
    ["💻", "线上英语", 7, 100, "#46B8F0"],
    ["✏️", "数学计算", 4, 100, "#FF6FA5"],
    ["🔤", "单词学习", 5, 100, "#F5B301"],
    ["🧹", "家务劳动", 6, 100, "#63C132"],
    ["⭐", "三好孩子", 8, 100, "#FF7A59"]
  ];

  /* ── 日期工具 ───────────────────────────────── */
  const pad = n => String(n).padStart(2, "0");
  const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const monthKeyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
  const dayKey = d => `${monthKeyOf(d)}|${pad(d.getDate())}`;

  function parseISO(s) {
    const [y, m, d] = s.split("-").map(Number);
    return new Date(y, m - 1, d || 1);
  }

  const TODAY = new Date();
  const TODAY_KEY = isoOf(TODAY);

  /* ── 状态 ───────────────────────────────────── */
  const monthInput = document.getElementById("month-input");
  const dateInput = document.getElementById("date-input");
  const monthLabel = document.getElementById("month-label");
  const resetBtn = document.getElementById("reset");
  const modeSwitch = document.getElementById("mode-switch");

  let mode = "month";
  let monthVal = TODAY_KEY.slice(0, 7);
  let startVal = TODAY_KEY;
  let buckets = {};

  try {
    const saved = localStorage.getItem(MODE_KEY);
    if (saved === "range" || saved === "month") mode = saved;
  } catch (e) {}

  /* ── 存储 ───────────────────────────────────── */
  function loadBuckets() {
    try {
      buckets = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}") || {};
    } catch (e) { buckets = {}; }
  }
  function persist() {
    try {
      const keys = Object.keys(buckets).sort().slice(-36);
      const trimmed = {};
      keys.forEach(k => { trimmed[k] = buckets[k]; });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(trimmed));
    } catch (e) {}
  }

  /* ── 日期集合 ───────────────────────────────── */
  function buildDates() {
    if (mode === "month") {
      const s = parseISO(monthVal + "-01");
      const y = s.getFullYear(), m = s.getMonth();
      const n = new Date(y, m + 1, 0).getDate();
      return Array.from({ length: n }, (_, i) => new Date(y, m, i + 1));
    }
    const s = parseISO(startVal);
    return Array.from({ length: 30 },
      (_, i) => new Date(s.getFullYear(), s.getMonth(), s.getDate() + i));
  }

  const shortDate = d => `${pad(d.getMonth() + 1)}.${pad(d.getDate())}`;

  /* ── 渲染 ───────────────────────────────────── */
  function render() {
    const dates = buildDates();
    const chunkSize = mode === "month" ? 16 : 15;

    const chunks = [];
    for (let i = 0; i < dates.length; i += chunkSize) {
      chunks.push({ offset: i, list: dates.slice(i, i + chunkSize) });
    }

    const first = dates[0];
    const last = dates[dates.length - 1];

    monthLabel.innerHTML = mode === "month"
      ? `${first.getFullYear()} 年 ${first.getMonth() + 1} 月 <span class="soft">· 一共 ${dates.length} 天</span>`
      : `${shortDate(first)} — ${shortDate(last)} <span class="soft">· 连续 ${dates.length} 天</span>`;

    document.getElementById("month-tables").innerHTML = chunks.map((chunk, ci) => {
      const list = chunk.list;

      const headCells = list.map((date, j) => {
        const wd = date.getDay();
        const isToday = isoOf(date) === TODAY_KEY;
        const isMonthStart = date.getDate() === 1;
        const abs = chunk.offset + j;

        const cls = ["day-col"];
        if (wd === 6) cls.push("weekend", "sat");
        if (wd === 0) cls.push("weekend", "sun");
        if (isToday) cls.push("today");
        if (isMonthStart && abs > 0) cls.push("month-start");

        const dm = mode === "range"
          ? `<div class="dm">${isMonthStart ? (date.getMonth() + 1) + " 月" : ""}</div>`
          : "";

        return `<th class="${cls.join(" ")}">${dm}` +
               `<div class="dnum">${date.getDate()}</div>` +
               `<div class="dw">${DAY_NAMES[(wd + 6) % 7]}</div></th>`;
      }).join("");

      const body = TASKS.map(([icon, name, t, points, color]) => {
        const cells = list.map((date, j) => {
          const cls = ["box-cell"];
          if (isoOf(date) === TODAY_KEY) cls.push("today-col");
          if (date.getDate() === 1 && chunk.offset + j > 0) cls.push("month-start");
          return `<td class="${cls.join(" ")}">` +
                 `<span class="box" data-m="${monthKeyOf(date)}" data-d="${date.getDate()}"` +
                 ` data-t="${t}" data-key="${dayKey(date)}" role="checkbox" tabindex="0"` +
                 ` aria-label="${date.getMonth() + 1}月${date.getDate()}日 ${name}"></span></td>`;
        }).join("");

        return `<tr style="--rc:${color};--rc-soft:${color}0D">` +
               `<td class="task-cell">` +
               `<span class="t-ico" style="background:${color}1F">${icon}</span>` +
               `<span class="t-name">${name}</span></td>` +
               `${cells}<td class="pts-cell${points > 100 ? " hi" : ""}">${points}</td></tr>`;
      }).join("");

      const sums = list.map(date =>
        `<td class="sum-cell" data-key="${dayKey(date)}"></td>`).join("");

      const rangeText = mode === "month"
        ? `${pad(list[0].getDate())}<em>—</em>${pad(list[list.length - 1].getDate())} 日`
        : `${shortDate(list[0])}<em>—</em>${shortDate(list[list.length - 1])}`;

      const subText = mode === "month"
        ? (ci === 0 ? "上半月" : "下半月")
        : `第 ${chunk.offset + 1}–${chunk.offset + list.length} 天`;

      return `<section class="panel">
        <div class="panel-head">
          <span class="range-tag">${rangeText}</span>
          <span class="half-badge">${subText}</span>
        </div>
        <div class="table-wrap">
          <table class="grid">
            <colgroup>
              <col style="width:180px">
              <col span="${list.length}">
              <col style="width:66px">
            </colgroup>
            <thead><tr>
              <th class="th-task">任务</th>${headCells}<th class="th-pts">分数</th>
            </tr></thead>
            <tbody>${body}</tbody>
            <tfoot><tr>
              <td class="sum-label">每日得分</td>${sums}<td class="sum-total">${TOTAL_POINTS}</td>
            </tr></tfoot>
          </table>
        </div>
      </section>`;
    }).join("");

    applyState();
    refreshSummary();
    resetBtn.textContent = mode === "month" ? "清空本月" : "清空这 30 天";
  }

  function applyState() {
    document.querySelectorAll(".box").forEach(box => {
      const bucket = buckets[box.dataset.m] || {};
      box.classList.toggle("done", !!bucket[box.dataset.t + "-" + box.dataset.d]);
    });
  }

  function refreshSummary() {
    const perDay = {};

    document.querySelectorAll(".box.done").forEach(box => {
      const k = box.dataset.key;
      const pts = POINT[parseInt(box.dataset.t, 10)];
      if (!perDay[k]) perDay[k] = { n: 0, pts: 0 };
      perDay[k].n += 1;
      perDay[k].pts += pts;
    });

    document.querySelectorAll(".sum-cell").forEach(cell => {
      const s = perDay[cell.dataset.key];
      cell.textContent = s ? s.pts : "";
      cell.classList.toggle("has", !!s);
      cell.classList.toggle("full", !!s && s.n === POINT.length);
    });
  }

  /* ── 交互 ───────────────────────────────────── */
  function toggle(box) {
    const mk = box.dataset.m;
    const k = box.dataset.t + "-" + box.dataset.d;
    if (!buckets[mk]) buckets[mk] = {};
    if (buckets[mk][k]) delete buckets[mk][k];
    else buckets[mk][k] = true;
    persist();

    box.classList.toggle("done", !!buckets[mk][k]);
    box.classList.remove("pop");
    void box.offsetWidth;
    box.classList.add("pop");
    refreshSummary();
  }

  document.addEventListener("click", e => {
    const box = e.target.closest(".box");
    if (box) toggle(box);
  });

  document.addEventListener("keydown", e => {
    if (e.key !== " " && e.key !== "Enter") return;
    const box = document.activeElement;
    if (box && box.classList.contains("box")) {
      e.preventDefault();
      toggle(box);
    }
  });

  function setMode(next) {
    mode = next;
    try { localStorage.setItem(MODE_KEY, mode); } catch (e) {}
    document.querySelectorAll(".seg").forEach(b => {
      const on = b.dataset.mode === mode;
      b.classList.toggle("active", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
    monthInput.classList.toggle("is-hidden", mode !== "month");
    dateInput.classList.toggle("is-hidden", mode !== "range");
    render();
  }

  modeSwitch.addEventListener("click", e => {
    const btn = e.target.closest(".seg");
    if (btn && btn.dataset.mode !== mode) setMode(btn.dataset.mode);
  });

  monthInput.addEventListener("change", () => {
    if (!monthInput.value) return;
    monthVal = monthInput.value;
    render();
  });

  dateInput.addEventListener("change", () => {
    if (!dateInput.value) return;
    startVal = dateInput.value;
    render();
  });

  resetBtn.addEventListener("click", () => {
    const msg = mode === "month"
      ? "要把这个月的勾勾全部擦掉吗？"
      : "要把这 30 天的勾勾全部擦掉吗？";
    if (!confirm(msg)) return;

    buildDates().forEach(d => { buckets[monthKeyOf(d)] = {}; });
    persist();
    document.querySelectorAll(".box.done").forEach(b => b.classList.remove("done"));
    refreshSummary();
  });

  /* ── 姓名 ───────────────────────────────────── */
  const nameInput = document.getElementById("name-input");
  try {
    const savedName = localStorage.getItem(NAME_KEY);
    if (savedName) nameInput.value = savedName;
  } catch (e) {}
  nameInput.addEventListener("input", () => {
    try { localStorage.setItem(NAME_KEY, nameInput.value); } catch (e) {}
  });

  /* ── 初始化 ─────────────────────────────────── */
  monthInput.value = monthVal;
  dateInput.value = startVal;
  loadBuckets();
  setMode(mode);
</script>
</body>
</html>
