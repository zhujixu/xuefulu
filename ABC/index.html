<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Grammar Test · 50 Questions</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  :root{
    --paper:#FFF8ED;
    --surface:#FFFFFF;
    --ink:#233150;
    --ink-2:#44536F;
    --muted:#7E8AA4;
    --faint:#AAB4C6;
    --line:#EDF0F7;
    --line-2:#DDE4F0;

    --blue:#4C86F9;
    --blue-deep:#2E63D6;
    --blue-soft:#EAF1FF;

    --mint:#33C48D;
    --mint-deep:#1B9A6B;
    --mint-soft:#E8F9F1;

    --coral:#FF7D67;
    --coral-deep:#DE5238;
    --coral-soft:#FFF0EC;

    --sun:#FFC24B;
    --sun-deep:#E19A20;
    --sun-soft:#FFF6E0;

    --lav:#9B8CF6;
    --lav-soft:#F2EFFF;

    --round:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN","Avenir Next","Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

    --shadow-card:0 30px 60px -34px rgba(35,49,80,.34), 0 8px 22px -16px rgba(35,49,80,.18);
  }

  body{
    font-family:var(--round);
    color:var(--ink);
    background:var(--paper);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  body::before,body::after{
    content:"";
    position:fixed;
    border-radius:50%;
    pointer-events:none;
    z-index:0;
    filter:blur(72px);
  }
  body::before{
    width:520px;height:520px;left:-180px;top:-200px;
    background:radial-gradient(circle,#FFE0AD 0%,rgba(255,231,196,.55) 55%,rgba(255,255,255,0) 72%);
  }
  body::after{
    width:620px;height:620px;right:-220px;bottom:-280px;
    background:radial-gradient(circle,#CFE0FF 0%,rgba(224,234,255,.5) 55%,rgba(255,255,255,0) 72%);
  }

  /* ================= Shell ================= */
  .shell{
    position:relative;
    z-index:1;
    display:grid;
    grid-template-columns:268px minmax(0,1fr);
    min-height:100vh;
  }

  /* ================= Rail ================= */
  .rail{
    position:sticky;
    top:0;
    height:100vh;
    display:flex;
    flex-direction:column;
    padding:24px 20px 16px;
    background:linear-gradient(180deg,#E9F0FF 0%,#EDF3FF 52%,#F3F6FF 100%);
    border-right:2px solid #DEE7F8;
    overflow-y:auto;
    overflow-x:hidden;
    min-width:0;
    z-index:30;
  }

  .brand{display:flex;align-items:flex-start;gap:10px;min-width:0;}
  .brand .logo{
    flex:0 0 auto;
    width:36px;height:36px;
    border-radius:12px;
    display:grid;
    place-items:center;
    background:linear-gradient(150deg,#FFD881,#FFBE3F);
    box-shadow:0 3px 0 #EDAF2E, inset 0 1px 0 rgba(255,255,255,.7);
  }
  .brand .logo svg{width:19px;height:19px;display:block;}
  .brand-txt{min-width:0;padding-top:1px;}
  .brand h1{
    margin:0;
    font-size:14.5px;
    line-height:1.25;
    font-weight:800;
    letter-spacing:-.01em;
    color:var(--ink);
  }
  .brand p{
    margin:4px 0 0;
    font-size:9.5px;
    font-weight:700;
    letter-spacing:.03em;
    color:var(--faint);
  }

  .score-card{
    display:flex;
    align-items:center;
    gap:13px;
    margin-top:18px;
    padding:13px 14px;
    background:#fff;
    border:2px solid #E9EFFB;
    border-radius:20px;
    box-shadow:0 10px 22px -18px rgba(35,49,80,.5);
  }
  .ring-wrap{position:relative;width:68px;height:68px;flex:0 0 auto;}
  .ring{display:block;width:100%;height:100%;transform:rotate(-90deg);}
  .ring circle{fill:none;stroke-width:9;}
  .ring .bg{stroke:#E8EEFA;}
  .ring .fg{
    stroke:url(#ringGrad);
    stroke-linecap:round;
    stroke-dasharray:270.18;
    stroke-dashoffset:270.18;
    transition:stroke-dashoffset .6s cubic-bezier(.22,1,.36,1);
  }
  .ring-num{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:1px;
  }
  .ring-num b{font-size:23px;font-weight:800;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;}
  .ring-num span{font-size:9.5px;font-weight:700;color:var(--faint);}

  .score-meta{display:flex;flex-direction:column;gap:9px;min-width:0;}
  .score-meta div{display:flex;flex-direction:column;gap:0;}
  .score-meta b{font-size:14.5px;font-weight:800;line-height:1.2;color:var(--ink);font-variant-numeric:tabular-nums;}
  .score-meta span{font-size:9px;font-weight:700;letter-spacing:.05em;color:var(--faint);}
  .score-mini{display:none;}

  .rail-nav{
    flex:1 1 auto;
    margin-top:16px;
    overflow-y:auto;
    overflow-x:hidden;
    min-width:0;
    padding-right:2px;
    scrollbar-width:thin;
    scrollbar-color:#D7E1F3 transparent;
  }
  .rail-nav::-webkit-scrollbar{width:6px;}
  .rail-nav::-webkit-scrollbar-thumb{background:#D7E1F3;border-radius:99px;}
  .rail-nav.scrollable{
    -webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 30px),rgba(0,0,0,0));
    mask-image:linear-gradient(180deg,#000 calc(100% - 30px),rgba(0,0,0,0));
  }

  .group{margin-bottom:13px;}
  .group:last-child{margin-bottom:0;}
  .group-label{
    display:flex;
    align-items:baseline;
    gap:6px;
    margin-bottom:7px;
    font-size:10px;
    font-weight:800;
    color:var(--muted);
    letter-spacing:.02em;
  }
  .group-label b{color:var(--blue);letter-spacing:.08em;}
  .p1 .group-label b{color:#3E77E8;}
  .p2 .group-label b{color:#7C68E8;}
  .p3 .group-label b{color:#D99214;}
  .p4 .group-label b{color:#2297C4;}
  .group-label span{font-weight:700;color:#8E9AB2;}
  .group-label i{
    margin-left:auto;
    font-style:normal;
    font-size:9.5px;
    font-weight:700;
    color:var(--faint);
    font-variant-numeric:tabular-nums;
  }

  .rail-nav .grid{
    display:grid;
    grid-template-columns:repeat(5,minmax(0,1fr));
    gap:6px;
  }
  .num{
    position:relative;
    height:35px;
    padding:0;
    display:grid;
    place-items:center;
    font:inherit;
    font-size:12.5px;
    font-weight:800;
    font-variant-numeric:tabular-nums;
    color:#5D6B87;
    background:#fff;
    border:2px solid #E6ECF8;
    border-radius:12px;
    cursor:pointer;
    transition:transform .13s ease, border-color .13s ease, background .13s ease, color .13s ease, box-shadow .13s ease;
  }
  .num:hover{
    border-color:#BFD2F6;
    color:var(--blue-deep);
    transform:translateY(-2px);
    box-shadow:0 3px 0 #E2EAF9;
  }
  .num.right{
    background:var(--mint-soft);
    border-color:#ADE8D2;
    color:var(--mint-deep);
  }
  .num.wrong{
    background:var(--coral-soft);
    border-color:#FFCCC2;
    color:var(--coral-deep);
  }
  .num.keyed{
    background:var(--sun-soft);
    border-color:#FFE1A6;
    color:#B37A11;
  }
  .num.current{
    outline:3px solid rgba(76,134,249,.24);
    outline-offset:2px;
  }
  .num.current:not(.right):not(.wrong):not(.keyed){
    background:var(--blue);
    border-color:var(--blue);
    color:#fff;
    box-shadow:0 3px 0 var(--blue-deep);
    transform:translateY(-1px);
  }
  .num.current:not(.right):not(.wrong):not(.keyed):hover{color:#fff;}

  .rail-foot{
    flex:0 0 auto;
    display:flex;
    gap:6px;
    margin-top:12px;
    padding-top:12px;
    border-top:2px dashed #E3EAF8;
  }
  .lnk{
    flex:1;
    font:inherit;
    font-size:11.5px;
    font-weight:800;
    padding:9px 4px;
    border-radius:13px;
    border:2px solid #E6ECF8;
    background:#fff;
    color:#5D6B87;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 3px 0 #E9EFFA;
    transition:transform .12s ease, background .12s ease, color .12s ease, border-color .12s ease, box-shadow .12s ease;
  }
  .lnk:hover{border-color:#C2D4F7;color:var(--blue-deep);}
  .lnk:active{transform:translateY(3px);box-shadow:none;}
  .lnk.on{
    background:var(--sun-soft);
    border-color:#FFDE9E;
    color:#A8720C;
    box-shadow:0 3px 0 #F3DFB2;
  }
  .lnk .short{display:none;}

  .lnk.snd{
    flex:0 0 auto;
    width:38px;
    display:grid;
    place-items:center;
    padding:9px 0;
  }
  .lnk.snd svg{display:block;width:16px;height:16px;}
  .lnk.snd .slash{display:none;}
  .lnk.snd.muted{
    color:#AAB4C6;
    border-color:#EDF1F8;
    background:#FAFBFE;
    box-shadow:0 3px 0 #EFF2F8;
  }
  .lnk.snd.muted .wave{display:none;}
  .lnk.snd.muted .slash{display:block;}

  /* ================= Stage ================= */
  .stage{
    display:flex;
    flex-direction:column;
    min-height:100vh;
    min-width:0;
    padding:24px 44px 30px;
  }
  .stage-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    width:100%;
    max-width:780px;
    margin:0 auto;
  }
  .crumb{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:10.5px;
    font-weight:800;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--muted);
    min-width:0;
  }
  .crumb::before{
    content:"";
    flex:0 0 auto;
    width:8px;height:8px;
    border-radius:3px;
    background:var(--sun);
    transform:rotate(45deg);
    transition:background .2s ease;
  }
  .crumb[data-part="1"]::before{background:#5B8DF2;}
  .crumb[data-part="2"]::before{background:#9B8CF6;}
  .crumb[data-part="3"]::before{background:#FFC24B;}
  .crumb[data-part="4"]::before{background:#46B8E8;}
  .crumb b{color:var(--blue);letter-spacing:.1em;}
  .crumb .cn{
    text-transform:none;
    letter-spacing:0;
    font-weight:700;
    color:var(--faint);
  }
  .counter{
    font-size:10.5px;
    font-weight:800;
    letter-spacing:.05em;
    color:var(--faint);
    white-space:nowrap;
  }
  .counter b{font-size:15px;color:var(--ink);}

  .track{
    position:relative;
    width:100%;
    max-width:780px;
    height:10px;
    margin:12px auto 0;
    border-radius:99px;
    background:#F2ECDF;
  }
  .track i{
    display:block;
    height:100%;
    border-radius:99px;
    background:linear-gradient(90deg,#7FB0FF 0%,#4C86F9 45%,#2FC291 100%);
    transition:width .45s cubic-bezier(.22,1,.36,1);
    position:relative;
  }
  .track i.empty::after{display:none;}
  .track i::after{
    content:"";
    position:absolute;
    right:-6px;top:50%;
    width:15px;height:15px;
    margin-top:-7.5px;
    border-radius:50%;
    background:#fff;
    border:3px solid var(--blue);
    box-shadow:0 2px 5px rgba(35,49,80,.22);
  }

  #stageBody{
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    padding:16px 0 4px;
  }

  /* ================= Card ================= */
  .card{
    position:relative;
    width:100%;
    max-width:780px;
    margin:auto auto 0;
    padding:42px 46px 38px;
    background:var(--surface);
    border:2px solid #F1F4FB;
    border-radius:30px;
    box-shadow:var(--shadow-card);
  }

  .q-body{display:grid;grid-template-columns:60px minmax(0,1fr);}
  .q-gutter{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
    padding-top:2px;
  }
  .q-num{
    width:52px;height:52px;
    display:grid;
    place-items:center;
    border-radius:17px;
    background:var(--blue-soft);
    color:var(--blue-deep);
    font-size:19px;
    font-weight:800;
    line-height:1;
    letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;
    box-shadow:inset 0 -2.5px 0 rgba(76,134,249,.14);
  }
  .q-of{font-size:8.5px;font-weight:800;color:var(--faint);letter-spacing:.06em;}
  .q-main{min-width:0;padding-left:22px;}

  .stem{
    margin:0 0 24px;
    font-size:clamp(24px,2.55vw,35px);
    line-height:1.46;
    font-weight:700;
    letter-spacing:-.012em;
    color:var(--ink);
  }
  .stem code{
    font-family:var(--mono);
    font-size:.86em;
    padding:2px 7px;
    border-radius:8px;
    background:#F4F7FE;
    border:1.5px solid #E6EDFA;
    color:var(--blue-deep);
  }

  .blank{
    display:inline-block;
    min-width:112px;
    margin:0 5px;
    padding:0 14px 2px;
    border-radius:12px;
    background:var(--blue-soft);
    border:2px dashed #BDD3FA;
    color:var(--blue-deep);
    text-align:center;
    font-weight:800;
    line-height:1.14;
    vertical-align:-0.1em;
    transition:background .18s ease, border-color .18s ease, color .18s ease;
  }
  .blank:not(.filled)::after{
    content:"?";
    font-size:.72em;
    color:#9FB9EE;
  }
  .blank.filled{
    background:#fff;
    border-style:solid;
    border-color:#B6D0FA;
  }
  .blank.bad{
    background:#fff;
    border-color:#FFC0B4;
    color:var(--coral-deep);
  }

  .bank-hint{
    display:flex;
    align-items:center;
    gap:7px;
    margin:-8px 0 14px;
    font-size:11px;
    font-weight:800;
    color:var(--muted);
  }
  .bank-hint::before{
    content:"";
    width:5px;height:5px;
    border-radius:50%;
    background:var(--sun);
  }

  .choices{display:flex;flex-direction:column;gap:11px;}
  .choice{
    position:relative;
    display:flex;
    align-items:center;
    gap:13px;
    width:100%;
    min-height:64px;
    padding:15px 18px;
    font:inherit;
    font-size:18px;
    font-weight:700;
    color:var(--ink);
    text-align:left;
    background:#fff;
    border:2px solid #E7EDF8;
    border-radius:18px;
    box-shadow:0 3px 0 #EDF1F9;
    cursor:pointer;
    transition:transform .13s ease, border-color .13s ease, background .13s ease, box-shadow .13s ease, color .13s ease;
  }
  .choice:hover:not(:disabled){
    border-color:#BCD3F9;
    background:#F9FBFF;
    transform:translateY(-2px);
    box-shadow:0 5px 0 #E9EFFA;
  }
  .choice:active:not(:disabled){
    transform:translateY(2px);
    box-shadow:0 1px 0 #EDF1F9;
  }
  .choice:disabled{cursor:default;}

  .letter{
    flex:0 0 auto;
    width:33px;height:33px;
    border-radius:50%;
    display:grid;
    place-items:center;
    font-size:13.5px;
    font-weight:800;
    background:#EFF3FB;
    color:#64748F;
    transition:background .13s ease, color .13s ease;
  }
  .choice:nth-child(1) .letter{background:#E9F0FF;color:#3B6FD4;}
  .choice:nth-child(2) .letter{background:#FFF0E7;color:#D4703C;}
  .choice:nth-child(3) .letter{background:#E7F7EF;color:#289A6E;}
  .choice:nth-child(4) .letter{background:#F1EEFF;color:#6B57C9;}
  .choice .label{flex:1 1 auto;min-width:0;}

  .mark{
    margin-left:auto;
    flex:0 0 auto;
    width:27px;height:27px;
    border-radius:50%;
    display:grid;
    place-items:center;
    font-size:14px;
    font-weight:800;
    color:#fff;
    background:var(--mint);
  }

  .choice.correct{
    background:var(--mint-soft);
    border-color:#8CE0BC;
    color:var(--mint-deep);
    box-shadow:0 3px 0 #CBEFDD;
  }
  .choice.correct .letter{background:#fff;color:var(--mint-deep);}
  .choice.correct .mark{background:var(--mint);}
  .choice.bad{
    background:var(--coral-soft);
    border-color:#FFB3A2;
    color:var(--coral-deep);
    box-shadow:0 3px 0 #FFDAD1;
  }
  .choice.bad .letter{background:#fff;color:var(--coral-deep);}
  .choice.bad .mark{background:var(--coral);}
  .choice.faded{opacity:.5;box-shadow:none;}
  .choice.faded:hover{transform:none;background:#fff;border-color:#E7EDF8;}
  .choice.correct:hover{transform:none;background:var(--mint-soft);border-color:#8CE0BC;box-shadow:0 3px 0 #CBEFDD;}

  .choice.just.correct{animation:pop .42s cubic-bezier(.2,1.5,.36,1);}
  .choice.just.bad{animation:shake .42s cubic-bezier(.36,.07,.19,.97);}

  /* word bank grid */
  .choices.grid{
    display:grid;
    grid-template-columns:repeat(5,minmax(0,1fr));
    gap:9px;
  }
  .choices.grid .choice{
    justify-content:center;
    min-height:54px;
    padding:12px 4px;
    font-size:15.5px;
    gap:0;
  }
  .choices.grid .choice .mark{
    position:absolute;
    top:-7px;
    right:-6px;
    width:21px;height:21px;
    font-size:11px;
    box-shadow:0 2px 5px rgba(35,49,80,.18);
  }

  /* ================= Explanation ================= */
  .explain{
    margin-top:22px;
    padding:16px 18px 14px;
    border-radius:20px;
    border:2px solid #E9EDF6;
    background:#FAFBFE;
  }
  .explain.ok{background:var(--mint-soft);border-color:#C3EDDA;}
  .explain.no{background:var(--coral-soft);border-color:#FFD4CB;}
  .explain.key{background:var(--sun-soft);border-color:#FFE3AF;}

  .verdict{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:12.5px;
    font-weight:800;
    letter-spacing:.01em;
    color:var(--ink-2);
  }
  .explain.ok .verdict{color:var(--mint-deep);}
  .explain.no .verdict{color:var(--coral-deep);}
  .explain.key .verdict{color:#A8720C;}
  .vicon{
    flex:0 0 auto;
    width:24px;height:24px;
    border-radius:50%;
    display:grid;
    place-items:center;
    font-size:12px;
    color:#fff;
    background:var(--muted);
  }
  .explain.ok .vicon{background:var(--mint);}
  .explain.no .vicon{background:var(--coral);}
  .explain.key .vicon{background:var(--sun);}
  .verdict .sep{font-weight:700;opacity:.75;}

  .ex{display:flex;gap:11px;margin-top:11px;}
  .ex-tag{
    flex:0 0 auto;
    width:30px;height:20px;
    border-radius:7px;
    display:grid;
    place-items:center;
    font-size:9.5px;
    font-weight:800;
    letter-spacing:.03em;
    background:#fff;
    color:#5D6B87;
    border:1.5px solid #E3E9F4;
  }
  .ex-tag.cn{color:#B4692F;border-color:#F2DFC7;}
  .ex p{
    margin:0;
    font-family:var(--sans);
    font-size:13.5px;
    line-height:1.68;
    color:var(--ink-2);
  }
  .ex p code{
    font-family:var(--mono);
    font-size:.9em;
    padding:1px 5px;
    border-radius:6px;
    background:#fff;
    border:1px solid #E4EAFC;
    color:var(--blue-deep);
  }

  /* ================= Foot nav ================= */
  .stage-foot{
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    max-width:780px;
    margin:22px auto auto;
  }
  .hint{
    flex:1 1 auto;
    text-align:center;
    font-size:10.5px;
    font-weight:700;
    color:#B3BCCC;
    letter-spacing:.01em;
  }
  kbd{
    display:inline-block;
    min-width:17px;
    padding:1px 4px 2px;
    font-family:inherit;
    font-size:9.5px;
    font-weight:800;
    color:#8492AB;
    background:#fff;
    border:1.5px solid #E4E9F3;
    border-bottom-width:2.5px;
    border-radius:6px;
    text-align:center;
  }
  .navbtn{
    font:inherit;
    font-size:13.5px;
    font-weight:800;
    color:var(--ink);
    background:#fff;
    border:2px solid #E4EAF5;
    border-radius:16px;
    padding:12px 20px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 4px 0 #E8EDF7;
    transition:transform .12s ease, box-shadow .12s ease, background .12s ease, border-color .12s ease;
  }
  .navbtn:hover:not(:disabled){transform:translateY(-2px);border-color:#C4D5F6;box-shadow:0 6px 0 #E4EBF8;}
  .navbtn:active:not(:disabled){transform:translateY(3px);box-shadow:none;}
  .navbtn:disabled{opacity:.45;cursor:default;box-shadow:0 4px 0 #F1F4FA;}
  .navbtn.primary{
    background:var(--blue);
    border-color:var(--blue);
    color:#fff;
    box-shadow:0 4px 0 var(--blue-deep);
  }
  .navbtn.primary:hover:not(:disabled){background:#5C90FA;border-color:#5C90FA;box-shadow:0 6px 0 var(--blue-deep);}

  /* ================= Summary ================= */
  .eyebrow{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:10px;
    font-weight:800;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .eyebrow b{color:var(--blue);letter-spacing:.14em;}
  .eyebrow .cn{text-transform:none;letter-spacing:0;font-weight:700;color:var(--faint);}
  .sum{
    text-align:center;
    max-width:620px;
    margin:auto;
    padding:40px 38px 34px;
  }
  .sum .eyebrow{justify-content:center;margin-bottom:12px;}
  .sum-score{
    font-size:74px;
    font-weight:800;
    line-height:1;
    letter-spacing:-.03em;
    color:var(--blue);
    font-variant-numeric:tabular-nums;
  }
  .sum-score span{font-size:20px;font-weight:800;color:var(--faint);letter-spacing:0;}
  .sum-msg{
    font-family:var(--sans);
    font-size:13.5px;
    line-height:1.75;
    color:var(--muted);
    max-width:400px;
    margin:14px auto 24px;
  }
  .sum-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    max-width:420px;
    margin:0 auto 22px;
  }
  .sum-grid div{
    padding:14px 6px;
    border-radius:16px;
    background:#F8FAFF;
    border:2px solid #EBF1FC;
  }
  .sum-grid b{display:block;font-size:20px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;}
  .sum-grid span{font-size:10px;font-weight:700;color:var(--muted);}
  .sum-wrong{font-size:11.5px;font-weight:800;color:var(--muted);}
  .sum-wrong .list{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:10px;}
  .sum-wrong button{
    width:36px;height:36px;
    font:inherit;
    font-size:12px;
    font-weight:800;
    color:var(--coral-deep);
    background:var(--coral-soft);
    border:2px solid #FFD0C6;
    border-radius:12px;
    cursor:pointer;
    box-shadow:0 2px 0 #FFE0D9;
    transition:transform .12s ease;
  }
  .sum-wrong button:hover{transform:translateY(-2px);}
  .sum-actions{display:flex;gap:10px;justify-content:center;margin-top:24px;}

  /* ================= Motion ================= */
  .entry{animation:rise .44s cubic-bezier(.22,1,.36,1) both;}
  @keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
  @keyframes pop{0%{transform:scale(.985);}55%{transform:scale(1.028);}100%{transform:scale(1);}}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    18%{transform:translateX(-7px);}
    38%{transform:translateX(6px);}
    58%{transform:translateX(-4px);}
    78%{transform:translateX(2px);}
  }
  .spark{
    position:absolute;
    width:8px;height:8px;
    border-radius:50%;
    pointer-events:none;
    z-index:5;
    transform:translate(-50%,-50%);
    animation:spark .62s cubic-bezier(.2,.6,.4,1) forwards;
  }
  @keyframes spark{
    0%{opacity:1;transform:translate(-50%,-50%) scale(.7);}
    100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.15);}
  }

  /* ================= Responsive ================= */
  @media (max-width:1180px){
    .shell{grid-template-columns:246px minmax(0,1fr);}
    .stage{padding:22px 30px 26px;}
    .card{padding:34px 32px 30px;}
  }

  @media (max-width:900px){
    .shell{display:block;min-height:0;}
    .rail{
      position:sticky;
      top:0;
      height:auto;
      display:grid;
      grid-template-columns:minmax(0,1fr) auto auto;
      grid-template-areas:"brand score foot" "nav nav nav";
      align-items:center;
      gap:7px 10px;
      padding:9px 13px 7px;
      background:rgba(250,252,255,.95);
      backdrop-filter:blur(16px) saturate(170%);
      -webkit-backdrop-filter:blur(16px) saturate(170%);
      border-right:0;
      border-bottom:2px solid #E7EEFA;
      overflow:visible;
    }
    .brand{grid-area:brand;align-items:center;gap:8px;}
    .brand .logo{width:29px;height:29px;border-radius:9px;box-shadow:0 2px 0 #EDAF2E;}
    .brand .logo svg{width:15px;height:15px;}
    .brand h1{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .brand p{display:none;}
    .score-card{display:none;}
    .score-mini{
      grid-area:score;
      display:flex;
      align-items:baseline;
      gap:1px;
      margin:0;
    }
    .score-mini b{font-size:16px;font-weight:800;color:var(--blue);}
    .score-mini span{font-size:10px;font-weight:800;color:var(--faint);}
    .rail-foot{
      grid-area:foot;
      margin:0;
      padding:0;
      border:0;
      gap:6px;
    }
    .lnk{flex:0 0 auto;font-size:11px;padding:6px 10px;border-radius:10px;box-shadow:0 2px 0 #E9EFFA;}
    .lnk .long{display:none;}
    .lnk .short{display:inline;}
    .lnk.snd{width:32px;padding:6px 0;}
    .rail-nav{
      grid-area:nav;
      width:auto;
      margin:0;
      padding:1px 0 3px;
      display:flex;
      gap:13px;
      overflow-x:auto;
      overflow-y:hidden;
      scrollbar-width:none;
    }
    .rail-nav::-webkit-scrollbar{display:none;}
    .rail-nav.scrollable{-webkit-mask-image:none;mask-image:none;}
    .group{margin:0;display:flex;align-items:center;gap:7px;flex:0 0 auto;}
    .group-label{margin:0;padding:0;border:0;flex:0 0 auto;font-size:9.5px;gap:4px;}
    .group-label span{display:none;}
    .group-label i{display:none;}
    .rail-nav .grid{display:flex;gap:5px;}
    .num{
      width:31px;height:31px;
      border-radius:10px;
      font-size:11.5px;
      box-shadow:none;
    }
    .num:hover{transform:none;box-shadow:none;}
    .num.current{box-shadow:0 2px 0 var(--blue-deep);}

    .stage{padding:12px 13px 26px;min-height:0;}
    #stageBody{padding:10px 0 0;}
    .stage-top{max-width:none;}
    .track{max-width:none;margin-top:9px;height:8px;}
    .track i::after{width:13px;height:13px;margin-top:-6.5px;border-width:2.5px;right:-5px;}

    .card{padding:20px 17px 18px;border-radius:22px;border-width:2px;}
    .q-body{display:block;}
    .q-gutter{display:none;}
    .q-main{padding-left:0;}
    .stem{font-size:21.5px;line-height:1.52;margin-bottom:19px;}
    .blank{min-width:80px;padding:0 10px 1px;border-radius:10px;margin:0 3px;}
    .bank-hint{font-size:10px;margin:-6px 0 11px;}

    .choices{gap:9px;}
    .choice{font-size:15px;padding:11px 13px;border-radius:15px;min-height:52px;gap:10px;}
    .letter{width:28px;height:28px;font-size:11.5px;}
    .mark{width:24px;height:24px;font-size:12px;}

    .choices.grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;}
    .choices.grid .choice{min-height:46px;padding:10px 2px;font-size:12.5px;border-radius:13px;}
    .choices.grid .choice .mark{width:18px;height:18px;font-size:10px;top:-6px;right:-5px;}

    .explain{margin-top:17px;padding:13px 13px 12px;border-radius:16px;}
    .verdict{font-size:11.5px;gap:8px;}
    .vicon{width:21px;height:21px;font-size:11px;}
    .ex{gap:9px;margin-top:10px;}
    .ex-tag{width:26px;height:18px;font-size:9px;border-radius:6px;}
    .ex p{font-size:12.5px;line-height:1.62;}

    .hint{display:none;}
    .stage-foot{gap:8px;margin-top:16px;}
    .navbtn{flex:1;text-align:center;padding:11px 8px;font-size:13px;border-radius:14px;}

    .sum{padding:30px 18px 26px;}
    .sum-score{font-size:56px;}
    .sum-msg{font-size:12.5px;margin:10px auto 18px;}
    .sum-grid{margin-bottom:18px;}
    .sum-grid b{font-size:18px;}
    .sum-actions .navbtn{flex:1;}
  }

  @media (max-width:380px){
    .brand h1{font-size:12px;}
    .choices.grid{grid-template-columns:repeat(4,minmax(0,1fr));}
  }

  @media (min-width:1500px){
    .card{max-width:840px;padding:44px 48px 38px;}
    .stage-top,.track,.stage-foot{max-width:840px;}
    .stem{font-size:32px;}
  }

  @media print{
    body{background:#fff;}
    body::before,body::after{display:none;}
    .rail,.stage-foot,.track,.hint{display:none !important;}
    .shell{display:block;}
    .stage{display:block;min-height:0;padding:0;max-width:none;}
    .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid;max-width:100%;}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;animation:none !important;}
  }

</style>
</head>
<body>

<div class="shell">
  <aside class="rail">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="#fff">
          <path d="M12 2.9l2.72 5.56 6.13.9-4.44 4.31 1.05 6.1L12 16.9l-5.46 2.87 1.05-6.1L3.15 9.36l6.13-.9z"/>
        </svg>
      </span>
      <div class="brand-txt">
        <h1>English Grammar Test</h1>
        <p>50 Questions · 每题 1 分</p>
      </div>
    </div>

    <div class="score-card">
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
          <defs>
            <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#7FB0FF"/>
              <stop offset="55%" stop-color="#4C86F9"/>
              <stop offset="100%" stop-color="#33C48D"/>
            </linearGradient>
          </defs>
          <circle class="bg" cx="50" cy="50" r="43"/>
          <circle class="fg" cx="50" cy="50" r="43"/>

        <div class="ring-num"><b id="scoreNum">0</b><span>/50</span></div>
      </div>

    <nav class="rail-nav" id="railNav"></nav>

    <div class="rail-foot">

        <span class="long">显示答案</span><span class="short">答案</span>
      </button>
      <button class="lnk" id="resetBtn" title="清空所有作答">重做</button>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9.5h3L11.5 6v12L7 14.5H4z"/>
          <path class="wave" d="M15.2 9.2a4.6 4.6 0 0 1 0 5.6"/>
          <path class="slash" d="M5.5 18.5L18.5 5.5"/>
        </svg>
      </button>
    </div>
  </aside>

  <main class="stage">
    <div class="stage-top">
      <div class="crumb" id="crumb"></div>
      <div class="counter" id="counter"></div>
    </div>
    <div class="track"><i id="trackFill"></i></div>
    <div id="stageBody"></div>
  </main>
</div>

<script>
const WORD_BOX_2 = ["I","You","He","She","We","They","It","Me","Him","Her"];
const WORD_BOX_3 = ["am","is","are","was","were","have","has","had","my","your"];

const DATA = [
{
  id:"p1", num:"1", title:"Multiple Choice", cn:"单项选择",
  desc:"Choose the correct answer. (1 mark each)",
  pool:null,
  qs:[
    {n:1,s:"___ am a little boy.",o:["He","I","She"],a:"I",
     en:"Only <em>I</em> can be the subject with <code>am</code>. Full sentence: <em>I am a little boy.</em>",
     cn:"am 只能和 I 搭配。I 是第一人称单数主格，在这里作主语。"},
    {n:2,s:"She ___ my mother.",o:["am","are","is"],a:"is",

    {n:3,s:"They ___ my friends.",o:["is","are","am"],a:"are",

    {n:5,s:"We ___ at school yesterday.",o:["was","were","is"],a:"were",

    {n:6,s:"Give the book to ___.",o:["I","my","me"],a:"me",

     cn:"介词 to 后面要接宾格。I 的宾格是 me。"},
    {n:7,s:"I love ___.",o:["they","them","their"],a:"them",

    {n:8,s:"This is ___ pencil.",o:["I","my","me"],a:"my",

    {n:11,s:"I ___ a red ball.",o:["has","have","does"],a:"have",
     en:"With the subject <em>I</em> we always use <code>have</code>.",
     cn:"主语是 I 时，用 have，不能用 has。"},
    {n:12,s:"Yesterday, he ___ a big cake.",o:["have","has","had"],a:"had",

     cn:"yesterday 提示过去时，have 的过去式是 had。"},
    {n:13,s:"___ you like bananas?",o:["Does","Do","Is"],a:"Do",
     en:"Present-tense questions with <em>you</em> start with <code>Do</code>. <code>Does</code> is only for he / she / it.",

    {n:15,s:"___ you watch TV yesterday?",o:["Did","Do","Does"],a:"Did",

    {n:17,s:"I ___ like spiders.",o:["doesn't","didn't","don't"],a:"don't",

    {n:18,s:"He ___ at home yesterday.",o:["wasn't","weren't","isn't"],a:"wasn't",

    {n:19,s:"They ___ hungry yesterday.",o:["wasn't","weren't","isn't"],a:"weren't",

    {n:20,s:"I ___ sad.",o:["am not","is not","are not"],a:"am not",

  ]
},
{
  id:"p2", num:"2", title:"Fill in the Blanks", cn:"选词填空",

  qs:[
    {n:21,s:"___ am a student.",o:WORD_BOX_2,a:"I",

    {n:22,s:"___ is my father.",o:WORD_BOX_2,a:"He",

    {n:24,s:"___ are good friends.",o:WORD_BOX_2,a:"We",

    {n:27,s:"I can see ___. (a boy)",o:WORD_BOX_2,a:"Him",

    {n:28,s:"Give the toy to ___. (a girl)",o:WORD_BOX_2,a:"Her",

    {n:29,s:"___ are my parents.",o:WORD_BOX_2,a:"They",

    {n:30,s:"___ are my teacher.",o:WORD_BOX_2,a:"You",

  ]
},
{
  id:"p3", num:"3", title:"Complete the Sentences", cn:"完成句子",
  desc:"Choose the correct word from the word box. (1 mark each)",
  pool:"am / is / are / was / were / have / has / had / my / your",
  qs:[
    {n:31,s:"I ___ six years old.",o:WORD_BOX_3,a:"am",
     en:"Subject <em>I</em> + <code>am</code>: <em>I am six years old.</em>",

    {n:32,s:"She ___ a good girl.",o:WORD_BOX_3,a:"is",

    {n:33,s:"We ___ very happy.",o:WORD_BOX_3,a:"are",

    {n:34,s:"He ___ sick yesterday.",o:WORD_BOX_3,a:"was",

     cn:"yesterday 表示过去，he 的过去式 be 动词是 was。"},
    {n:35,s:"They ___ at the park yesterday.",o:WORD_BOX_3,a:"were",
     en:"Past tense + plural <em>they</em> → <code>were</code>.",

    {n:36,s:"I ___ two eyes.",o:WORD_BOX_3,a:"have",

    {n:37,s:"My dog ___ four legs.",o:WORD_BOX_3,a:"has",

    {n:38,s:"Yesterday, I ___ a birthday party.",o:WORD_BOX_3,a:"had",

    {n:42,s:"She ___ my sister.",o:["aren't","isn't","am not"],a:"isn't",

    {n:43,s:"They ___ at school.",o:["isn't","am not","aren't"],a:"aren't",

const scoreMiniEl = document.getElementById("scoreMini");
const rateEl    = document.getElementById("rate");
const doneEl    = document.getElementById("doneCount");
const ringFg    = document.querySelector(".ring .fg");
const revealBtn = document.getElementById("revealBtn");
const RING_C    = 270.18;

function stats(){
  let answered = 0, correct = 0;
  const per = {};
  DATA.forEach(p=>{
    per[p.id] = {answered:0, right:0, total:p.qs.length};
    p.qs.forEach(q=>{
      if(state[q.n] !== undefined){
        answered++; per[p.id].answered++;
        if(state[q.n] === q.a){ correct++; per[p.id].right++; }
      }
    });
  });
  return {answered:answered, correct:correct, per:per};
}

/* ---------------- rail ---------------- */
function renderRail(){
  const s = stats();
  let html = "";
  DATA.forEach(part=>{
    const p = s.per[part.id];
    html += '<div class="group p'+part.num+'">';
    html += '<div class="group-label"><b>PART '+part.num+'</b><span>'+part.cn+'</span><i>'+p.right+' / '+p.total+'</i></div>';
    html += '<div class="grid">';
    part.qs.forEach(q=>{
      const ans = state[q.n];
      let cls = "num";
      if(ans !== undefined) cls += (ans === q.a) ? " right" : " wrong";
      else if(revealAll) cls += " keyed";
      if(idx < TOTAL && FLAT[idx].q.n === q.n) cls += " current";
      html += '<button class="'+cls+'" data-jump="'+q.n+'" aria-label="第 '+q.n+' 题">'+q.n+'</button>';
    });
    html += '</div></div>';
  });
  railNav.innerHTML = html;
  railNav.classList.toggle("scrollable", railNav.scrollHeight > railNav.clientHeight + 2);

  scoreNumEl.textContent = s.correct;
  scoreMiniEl.textContent = s.correct;
  doneEl.textContent = s.answered;
  rateEl.textContent = s.answered ? Math.round(s.correct / s.answered * 100) + "%" : "—";
  ringFg.style.strokeDashoffset = (RING_C * (1 - s.correct / TOTAL)).toFixed(2);

  const cur = railNav.querySelector(".num.current");
  if(cur && railNav.scrollWidth > railNav.clientWidth + 4){
    const r = cur.getBoundingClientRect(), c = railNav.getBoundingClientRect();
    railNav.scrollLeft += (r.left - c.left) - (c.width - r.width) / 2;
  }
}

function markEntry(){
  stageBody.querySelectorAll(".card, .stage-foot").forEach(function(el){
    el.classList.remove("entry");
    void el.offsetWidth;
    el.classList.add("entry");
  });
}

/* ---------------- stage ---------------- */
function render(){
  renderRail();
  const s = stats();
  const changed = (idx !== lastIdx);
  lastIdx = idx;

  if(idx >= TOTAL){ renderSummary(s, changed); return; }

  const item = FLAT[idx], q = item.q, part = item.part;
  crumbEl.dataset.part = part.num;
  crumbEl.innerHTML = '<b>Part '+part.num+'</b> &nbsp;'+part.title+' <span class="cn">· '+part.cn+'</span>';
  counterEl.innerHTML = 'No. <b>'+String(idx+1).padStart(2,"0")+'</b> / '+TOTAL;
  trackFill.style.width = ((idx+1)/TOTAL*100) + "%";
  trackFill.classList.toggle("empty", idx === 0);

  const chosen = state[q.n];
  const answered = chosen !== undefined;
  const isRight = answered && chosen === q.a;
  const showEx = answered || revealAll;

  const parts = q.s.split("___");
  const displayWord = answered ? chosen : (revealAll ? q.a : null);
  let blankCls = "blank";
  if(displayWord !== null){
    blankCls += " filled";
    if(answered && !isRight) blankCls += " bad";
  }

  let html = '<section class="card">';
  html += '<div class="q-body">';
  html += '<div class="q-gutter"><span class="q-num">'+String(idx+1).padStart(2,"0")+'</span><span class="q-of">/ '+TOTAL+'</span></div>';
  html += '<div class="q-main">';

  html += '<p class="stem">'+parts[0]+'<span class="'+blankCls+'">'+(displayWord !== null ? displayWord : "&nbsp;")+'</span>'+(parts[1]||"")+'</p>';

  if(part.pool) html += '<div class="bank-hint">Choose one word · 从下列词中选一个</div>';

  html += '<div class="choices'+(part.pool ? " grid" : "")+'">';
  q.o.forEach((opt,i)=>{
    let cls = "choice";
    let disabled = answered ? " disabled" : "";
    let mark = "";
    if(answered || revealAll){
      if(opt === q.a){ cls += " correct"; mark = '<span class="mark">✓</span>'; }
      else if(answered && opt === chosen){ cls += " bad"; mark = '<span class="mark">✕</span>'; }
      else cls += " faded";
    }
    const letter = part.pool ? "" : '<span class="letter">'+String.fromCharCode(65+i)+'</span>';
    html += '<button class="'+cls+'" data-pick="'+opt.replace(/"/g,"&quot;")+'"'+disabled+'>'+letter+'<span class="label">'+opt+'</span>'+mark+'</button>';
  });
  html += '</div>';

  if(showEx){
    let tone, verdict;
    if(answered && isRight){
      tone = "ok";
      verdict = '<span class="vicon">✓</span><span>Correct</span><span class="sep">· 回答正确</span>';
    } else if(answered){
      tone = "no";
      verdict = '<span class="vicon">✕</span><span>Your answer</span><span class="sep">· 你选了 '+chosen+'，正确答案是 '+q.a+'</span>';
    } else {
      tone = "key";
      verdict = '<span class="vicon">!</span><span>Answer</span><span class="sep">· 正确答案 '+q.a+'</span>';
    }
    html += '<div class="explain '+tone+'">'+'<div class="verdict">'+verdict+'</div>'+
            '<div class="ex"><span class="ex-tag">EN</span><p>'+q.en+'</p></div>'+
            '<div class="ex"><span class="ex-tag cn">中</span><p>'+q.cn+'</p></div>'+
            '</div>';
  }
  html += '</div></div></section>';

  const nextLabel = (idx === TOTAL-1) ? "查看成绩" : "下一题";
  html += '<div class="stage-foot">'+
            '<button class="navbtn" id="prevBtn"'+(idx===0?' disabled':'')+'>← 上一题</button>'+
            '<span class="hint"><kbd>←</kbd> <kbd>→</kbd> 切换 · <kbd>A</kbd>–<kbd>'+String.fromCharCode(64+Math.max(q.o.length,2))+'</kbd> 选择</span>'+
            '<button class="navbtn primary" id="nextBtn">'+nextLabel+' →</button>'+
          '</div>';

  stageBody.innerHTML = html;
  if(changed) markEntry();
}

function renderSummary(s, changed){
  crumbEl.innerHTML = '<b>Finished</b> &nbsp;全部 50 题';
  counterEl.innerHTML = 'No. <b>50</b> / 50';
  trackFill.style.width = "100%";

  const wrong = FLAT.filter(it => state[it.q.n] !== undefined && state[it.q.n] !== it.q.a).map(it => it.q.n);
  const acc = s.answered ? Math.round(s.correct / s.answered * 100) : 0;

  let msg;
  if(s.answered === 0){
    msg = "还没有作答记录，回到第 1 题开始吧。";
  } else if(s.correct >= 48){
    msg = "几乎全对。be 动词、人称代词和否定句的规则，你已经很稳了。";
  } else if(s.correct >= 40){
    msg = "很扎实。只差一点点就满分，把标红的几道题再读一遍就够了。";
  } else if(s.correct >= 25){
    msg = "基础不错。重点看错题的解析，把 am / is / are 与 have / has 的搭配再理一遍。";
  } else {
    msg = "别急着求快，一次做一个部分。先记住：I → am，he / she / it → is，you / we / they → are。";
  }

  let html = '<section class="card sum">';
  html += '<div class="eyebrow"><b>Final Score</b><span class="cn">成绩单</span></div>';
  html += '<div class="sum-score">'+s.correct+'<span> / 50</span></div>';
  html += '<p class="sum-msg">'+msg+'</p>';
  html += '<div class="sum-grid">';
  html += '<div><b>'+acc+'%</b><span>正确率</span></div>';
  html += '<div><b>'+s.answered+'</b><span>已作答</span></div>';
  html += '<div><b>'+wrong.length+'</b><span>错题</span></div>';
  html += '</div>';
  if(wrong.length){
    html += '<div class="sum-wrong">错题号 · 点击回看解析<div class="list">';
    wrong.forEach(n => { html += '<button data-jump="'+n+'">'+n+'</button>'; });
    html += '</div></div>';
  }
  html += '<div class="sum-actions">'+
          '<button class="navbtn" id="backBtn">← 回到最后一题</button>'+
          (wrong.length ? '<button class="navbtn primary" id="firstWrong">查看错题 →</button>' : '')+
          '</div>';
  html += '</section>';

  stageBody.innerHTML = html;
  stageBody.dataset.wrong = wrong.join(",");
  if(changed) markEntry();
}

/* ---------------- interactions ---------------- */
function go(i){
  idx = Math.max(0, Math.min(TOTAL, i));
  render();
  if(window.scrollY > 8) window.scrollTo({top:0, behavior:"smooth"});
}

/* ---------------- answer sounds ---------------- */
let soundOn = true;
try { soundOn = localStorage.getItem("egt50.snd") !== "0"; } catch(e){}

const SFX = {};
Object.keys(SFX_SRC).forEach(function(k){
  const a = new Audio();
  a.preload = "auto";
  a.src = SFX_SRC[k];
  SFX[k] = a;
});

function sfxPlay(ok){
  if(!soundOn) return;
  const a = SFX[ok ? "yes" : "no"];
  if(!a) return;
  try { a.currentTime = 0; } catch(e){}
  const pr = a.play();
  if(pr && pr.catch) pr.catch(function(){});
}

const sndBtn = document.getElementById("sndBtn");
function syncSnd(){
  sndBtn.classList.toggle("muted", !soundOn);
  sndBtn.setAttribute("aria-pressed", soundOn ? "true" : "false");
  sndBtn.title = soundOn ? "音效：开（点击关闭）" : "音效：关（点击开启）";
}
sndBtn.addEventListener("click", function(){
  soundOn = !soundOn;
  try { localStorage.setItem("egt50.snd", soundOn ? "1" : "0"); } catch(e){}
  syncSnd();
  if(soundOn) sfxPlay(true);
});
syncSnd();

function burst(node){
  if(!node) return;
  try{
    if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  }catch(e){}
  const card = stageBody.querySelector(".card");
  if(!card) return;
  const cr = card.getBoundingClientRect();
  const mr = node.getBoundingClientRect();
  const cx = mr.left - cr.left + mr.width / 2;
  const cy = mr.top - cr.top + mr.height / 2;
  const colors = ["#4C86F9","#33C48D","#FFC24B","#FF7D67","#9B8CF6"];
  for(let i = 0; i < 10; i++){
    const sp = document.createElement("i");
    sp.className = "spark";
    sp.style.left = cx + "px";
    sp.style.top  = cy + "px";
    const ang  = (Math.PI * 2 * i) / 10 + Math.random() * 0.5;
    const dist = 30 + Math.random() * 26;
    sp.style.setProperty("--dx", (Math.cos(ang) * dist).toFixed(1) + "px");
    sp.style.setProperty("--dy", (Math.sin(ang) * dist).toFixed(1) + "px");
    sp.style.background = colors[i % colors.length];
    sp.style.animationDelay = (Math.random() * 0.05).toFixed(3) + "s";
    card.appendChild(sp);
    setTimeout(function(){ sp.remove(); }, 780);
  }
}

function pick(opt){
  if(idx >= TOTAL) return;
  const q = FLAT[idx].q;
  if(state[q.n] !== undefined) return;
  state[q.n] = opt;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e){}
  const oldCard = stageBody.querySelector(".card");
  const oldTop = oldCard ? oldCard.getBoundingClientRect().top : null;
  render();
  const newCard = stageBody.querySelector(".card");
  if(oldTop !== null && newCard){
    const dy = oldTop - newCard.getBoundingClientRect().top;
    if(Math.abs(dy) > 1){
      newCard.style.transition = "none";
      newCard.style.transform = "translateY(" + dy + "px)";
      requestAnimationFrame(function(){
        newCard.style.transition = "transform .34s cubic-bezier(.22,1,.36,1)";
        newCard.style.transform = "";
        setTimeout(function(){ newCard.style.transition = ""; }, 400);
      });
    }
  }
  const right = (opt === q.a);
  sfxPlay(right);
  const el = Array.prototype.slice.call(stageBody.querySelectorAll(".choice")).filter(function(b){ return b.dataset.pick === opt; })[0];
  if(el){
    el.classList.add("just");
    setTimeout(function(){ el.classList.remove("just"); }, 540);
    if(right) burst(el.querySelector(".mark"));
  }
}

stageBody.addEventListener("click", function(e){
  const jump = e.target.closest("[data-jump]");
  if(jump){ go(FLAT.findIndex(it => it.q.n === Number(jump.dataset.jump))); return; }

  const choice = e.target.closest("[data-pick]");
  if(choice){ pick(choice.dataset.pick); return; }

  if(e.target.closest("#nextBtn")){ go(idx+1); return; }
  if(e.target.closest("#prevBtn")){ go(idx-1); return; }
  if(e.target.closest("#backBtn")){ go(TOTAL-1); return; }
  if(e.target.closest("#firstWrong")){
    const first = Number(stageBody.dataset.wrong.split(",")[0]);
    const at = FLAT.findIndex(it => it.q.n === first);
    if(at >= 0) go(at);
    return;
  }
});

railNav.addEventListener("click", function(e){
  const btn = e.target.closest("[data-jump]");
  if(!btn) return;
  const at = FLAT.findIndex(it => it.q.n === Number(btn.dataset.jump));
  if(at >= 0) go(at);
});

revealBtn.addEventListener("click", function(){
  revealAll = !revealAll;
  this.classList.toggle("on", revealAll);
  this.querySelector(".long").textContent = revealAll ? "隐藏答案" : "显示答案";
  this.querySelector(".short").textContent = revealAll ? "隐藏" : "答案";
  render();
});

document.getElementById("resetBtn").addEventListener("click", function(){
  state = {};
  revealAll = false;
  idx = 0;
  lastIdx = -1;
  revealBtn.classList.remove("on");
  revealBtn.querySelector(".long").textContent = "显示答案";
  revealBtn.querySelector(".short").textContent = "答案";
  try { localStorage.removeItem(STORE_KEY); } catch(e){}
  render();
  window.scrollTo({top:0, behavior:"smooth"});
});

document.addEventListener("keydown", function(e){
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  if(e.key === "ArrowRight"){ e.preventDefault(); go(idx+1); return; }
  if(e.key === "ArrowLeft"){ e.preventDefault(); go(idx-1); return; }
  if(idx >= TOTAL) return;
  const k = e.key.toUpperCase();
  if(k.length === 1 && k >= "A" && k <= "J"){
    const i = k.charCodeAt(0) - 65;
    const q = FLAT[idx].q;
    if(i < q.o.length) pick(q.o[i]);
  }
});

render();
</script>
</body>
</html>
