<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="学府路1号（xuefulu.ai）：快捷导航与教学工具。打开浏览器，在地址栏输入 xuefulu.ai，按下 Enter 键即可访问学府路1号！">
  <title>学府路1号 xuefulu.ai</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css">
  <style>
    /* ==================== CSS变量系统（暖灰极简主题） ==================== */
    :root {
      --page-bg: #f5f3ef;
      --text-primary: #1d1d1f;
      --text-secondary: #86868b;
      --glass-bg: rgba(255, 255, 255, 0.85);
      --glass-hover: rgba(255, 255, 255, 0.95);
      --accent: #0071e3;
      --accent-hover: #0077ed;
      --accent-soft: rgba(0, 113, 227, 0.1);
      --accent-glow: rgba(0, 113, 227, 0.3);
      --accent-focus: rgba(0, 113, 227, 0.12);
      --border-subtle: rgba(0, 0, 0, 0.06);
      --bg-subtle: rgba(0, 0, 0, 0.05);
      --bg-active: rgba(0, 0, 0, 0.1);
      --glass-border: var(--border-subtle);
      --btn-shadow: var(--accent-glow);
      --shadow-md: 0 2px 12px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.1);
      --transition-fast: 0.2s ease;
      --transition-normal: 0.3s ease;
      --radius-sm: 10px;
      --radius-md: 15px;
      --radius-lg: 20px;
    }

    /* ==================== 基础重置 ==================== */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-size: 100%;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
      background: var(--page-bg);
      color: var(--text-primary);
      min-height: 100dvh;
      padding: clamp(10px, 3vw, 20px);
      overflow-x: hidden;
      line-height: 1.6;
    }

    /* 背景装饰 */
    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
      animation: float 8s ease-in-out infinite;
    }

    .bg-orb-1 {
      top: -10%;
      right: -5%;
      width: min(500px, 50vw);
      height: min(500px, 50vw);
      background: radial-gradient(circle, rgba(0,113,227,0.06) 0%, transparent 70%);
    }

    .bg-orb-2 {
      bottom: -10%;
      left: -5%;
      width: min(400px, 40vw);
      height: min(400px, 40vw);
      background: radial-gradient(circle, rgba(0,0,0,0.03) 0%, transparent 70%);
      animation-delay: -2s;
      animation-direction: reverse;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0) translateX(0);
      }

      50% {
        transform: translateY(-30px) translateX(20px);
      }
    }

    /* ==================== 布局容器 ==================== */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    /* ==================== 头部 ==================== */
    header {
      text-align: center;
      padding: clamp(20px, 5vw, 30px) 20px;
      color: var(--text-primary);
      margin-bottom: 0;
    }

    .logo {
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
    }

    .logo i {
      color: var(--accent);
      filter: drop-shadow(0 0 8px var(--accent-glow));
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.05);
      }
    }

    .download-tip {
      display: block;
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.875rem;
      padding: 8px 20px;
      text-decoration: none;
      transition: color var(--transition-fast);
    }
    .download-tip:hover { color: var(--accent); }
    .download-tip i { margin-right: 6px; color: var(--text-secondary); }
    .download-tip .highlight {
      background-color: #fde047;
      color: #111827;
      font-weight: 700;
      padding: 0.125rem 0.375rem;
      border-radius: 0.25rem;
    }

    /* ==================== 链接类 ==================== */
    .header-logo-link {
      text-decoration: none;
      color: inherit;
      display: block;
    }

    /* 品牌强调色（蓝色） */
    .brand-accent {
      color: var(--accent);
      text-shadow: 0 0 10px var(--accent-glow);
    }

    /* ==================== 主内容区 ==================== */
    .main-content {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .links-container {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: var(--radius-lg);
      padding: clamp(20px, 4vw, 30px);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--glass-border);
    }

    .links-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .links-header h2 {
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.05rem;
      font-weight: 600;
    }

    /* ==================== 按钮系统 ==================== */
    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all var(--transition-normal);
      font-size: 0.95rem;
      outline: none;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--border-subtle);
      white-space: nowrap;
      color: #fff;
    }

    .btn:focus-visible,
    .link-item:focus-visible {
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px var(--btn-shadow);
    }

    .btn-primary {
      background: var(--accent);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-success {
      --btn-shadow: rgba(52, 199, 89, 0.4);
      background: #34c759;
    }

    .btn-success:hover {
      background: #28a745;
    }

    .btn-wechat {
      --btn-shadow: rgba(7, 193, 96, 0.4);
      background: #07c160;
    }

    .btn-wechat:hover {
      background: #06ad56;
    }

    .btn-wechat i {
      transform: scale(1.05);
    }

    .btn-danger {
      --btn-shadow: rgba(255, 59, 48, 0.4);
      background: #ff3b30;
    }

    .btn-danger:hover {
      background: #d6342a;
    }

    .btn-cancel {
      background: var(--bg-subtle);
      color: var(--text-primary);
      --btn-shadow: transparent;
    }

    .btn-cancel:hover {
      background: var(--bg-active);
    }

    /* ==================== 链接网格 ==================== */
    .links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
      min-height: 100px;
    }

    @media (max-width: 640px) {
      .links-grid {
        grid-template-columns: 1fr;
      }
    }

    /* ==================== 链接卡片 ==================== */
    .link-item {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      border: 1px solid var(--glass-border);
      position: relative;
      user-select: none;
      outline: none;
      overflow: hidden;
    }

    /* 左侧彩色强调条 */
    .link-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 4px;
      bottom: 4px;
      width: 4px;
      background: var(--card-accent, rgba(0, 113, 227, 0.3));
      border-radius: 0 4px 4px 0;
      transition: all var(--transition-normal);
    }

    .link-item:hover {
      background: var(--glass-hover);
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg), 0 0 20px var(--card-glow, transparent);
      border-color: var(--card-accent-border, var(--glass-border));
    }

    .link-item:hover::before {
      width: 5px;
      box-shadow: 0 0 10px var(--card-accent, transparent);
      top: 0;
      bottom: 0;
      border-radius: 0 3px 3px 0;
    }

    .link-item.dragging {
      opacity: 0.6;
      transform: rotate(2deg) scale(1.02);
      box-shadow: var(--shadow-lg);
      z-index: 100;
      background: rgba(255, 255, 255, 0.95);
    }

    /* 拖拽时屏蔽子元素指针事件，避免 dragenter/dragleave 在子元素间反复触发造成闪烁 */
    .link-item.dragging * {
      pointer-events: none;
    }

    .link-item.drag-over {
      border: 2px dashed var(--accent);
      transform: scale(1.02);
      background: rgba(0, 113, 227, 0.08);
    }

    .link-item.drag-over::before {
      opacity: 0;
    }

    .link-item.drag-over::after {
      content: "释放放置";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 113, 227, 0.9);
      color: white;
      font-weight: bold;
      border-radius: inherit;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      font-size: 0.9rem;
    }

    /* 链接Favicon */
    .link-favicon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      flex-shrink: 0;
      background: rgba(0, 0, 0, 0.03);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: all var(--transition-normal);
      position: relative;
      border: 1px solid var(--border-subtle);
    }

    .link-favicon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: inherit;
      padding: 4px;
    }

    .link-favicon .favicon-fallback {
      color: var(--card-accent, var(--accent));
      font-size: 1.1rem;
    }

    .link-item:hover .link-favicon {
      transform: scale(1.08);
      border-color: var(--card-accent-border, rgba(0, 0, 0, 0.1));
      background: rgba(255, 255, 255, 0.5);
    }

    /* 拖拽手柄 */
    .drag-handle {
      color: rgba(0, 0, 0, 0.2);
      font-size: 1rem;
      cursor: grab;
      padding: 4px;
      transition: all var(--transition-fast);
      flex-shrink: 0;
    }

    .link-item:hover .drag-handle,
    .link-item.dragging .drag-handle {
      color: rgba(0, 0, 0, 0.4);
      transform: scale(1.1);
    }

    .link-item.dragging .drag-handle {
      cursor: grabbing;
    }

    /* 链接内容 */
    .link-content {
      flex: 1;
      min-width: 0;
    }

    .link-title {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 2px;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .link-url {
      font-size: 0.78rem;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 操作按钮 */
    .link-actions {
      display: flex;
      gap: 5px;
      opacity: 0;
      transition: all var(--transition-fast);
      transform: translateX(8px);
    }

    .link-item:hover .link-actions,
    .link-item:focus-within .link-actions {
      opacity: 1;
      transform: translateX(0);
    }

    @media (pointer: coarse) {
      .link-actions {
        opacity: 1;
        transform: translateX(0);
      }

      .move-btn {
        display: flex;
      }
    }

    .action-btn {
      background: rgba(0, 0, 0, 0.04);
      border: 1px solid var(--border-subtle);
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition-fast);
      color: var(--text-secondary);
      flex-shrink: 0;
      font-size: 0.8rem;
    }

    .action-btn:hover {
      background: rgba(0, 0, 0, 0.08);
      transform: scale(1.1);
      color: var(--text-primary);
    }

    .edit-btn:hover {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .delete-btn:hover {
      background: rgba(255, 59, 48, 0.1);
      color: #ff3b30;
    }

    /* 移动按钮：桌面端用拖拽排序，触屏设备用上下移动替代 */
    .move-btn {
      display: none;
    }

    .move-btn:hover {
      background: var(--accent-soft);
      color: var(--accent);
    }

    /* ==================== 空状态 ==================== */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .empty-state i {
      font-size: 3.5rem;
      margin-bottom: 20px;
      opacity: 0.4;
      animation: bounce 2s infinite;
      color: var(--accent);
    }

    @keyframes bounce {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    /* ==================== 模态框 ==================== */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity var(--transition-normal);
      padding: 20px;
    }

    .modal.show {
      display: flex;
      opacity: 1;
    }

    .modal-content {
      background: #ffffff;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 480px;
      padding: 28px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--glass-border);
      transform: scale(0.95);
      transition: transform var(--transition-normal);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal.show .modal-content {
      transform: scale(1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .modal-header h3 {
      color: var(--text-primary);
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .close-modal {
      background: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .close-modal:hover {
      background: var(--bg-active);
      transform: rotate(90deg);
      color: var(--text-primary);
    }

    /* ==================== 表单 ==================== */
    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--text-primary);
      font-size: 0.95rem;
    }

    .form-control {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: var(--radius-sm);
      font-size: 1rem;
      transition: all var(--transition-fast);
      outline: none;
      background: rgba(0, 0, 0, 0.02);
      color: var(--text-primary);
    }

    .form-control::placeholder {
      color: var(--text-secondary);
    }

    .form-control:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-focus);
      background: #fff;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 28px;
    }

    /* 删除确认特殊样式 */
    .delete-confirm-content {
      text-align: center;
      padding: 20px;
    }

    .delete-confirm-content>i {
      font-size: 3.5rem;
      color: #ff6b6b;
      margin-bottom: 20px;
      display: inline-block;
      animation: shake 0.5s ease-in-out;
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-5px);
      }

      75% {
        transform: translateX(5px);
      }
    }

    .delete-confirm-content p {
      color: var(--text-primary);
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .confirm-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    /* ==================== 通知 ==================== */
    .notification {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #34c759;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      color: white;
      padding: 14px 24px;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 1001;
      transform: translateY(100px) scale(0.9);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      max-width: min(400px, 90vw);
    }

    .notification.show {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    .notification.error {
      background: #ff3b30;
    }

    /* ==================== 页脚 ==================== */
    .footer {
      text-align: center;
      color: var(--text-secondary);
      padding: 30px 0 20px;
      font-size: 0.9rem;
    }

    .footer-content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .footer-link {
      color: var(--accent);
      text-decoration: none;
      transition: all var(--transition-fast);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
    }

    .footer-link:hover {
      color: var(--text-primary);
      text-decoration: underline;
      transform: translateY(-2px);
    }

    .separator {
      opacity: 0.4;
    }

    /* ==================== 时间显示 ==================== */
    .time-display {
      text-align: center;
      padding: 6px 0;
      color: var(--text-secondary);
      position: relative;
      z-index: 1;
    }
    .time-display .time-main {
      font-size: 1.05rem;
      font-weight: 400;
      letter-spacing: 0.5px;
    }
    .time-display .time-sync-status {
      font-size: 0.7rem;
      opacity: 0.5;
      margin-left: 6px;
      vertical-align: middle;
    }

    /* ==================== 响应式优化 ==================== */
    @media (max-width: 768px) {
      .links-header {
        flex-direction: column;
        align-items: stretch;
      }

      .actions {
        width: 100%;
      }

      .btn {
        flex: 1;
        justify-content: center;
      }

      .modal-actions {
        flex-direction: column-reverse;
      }

      .modal-actions .btn {
        width: 100%;
        justify-content: center;
      }

      .notification {
        left: 16px;
        right: 16px;
        bottom: 16px;
      }
    }

    @media (max-width: 480px) {
      .logo {
        flex-direction: column;
        gap: 10px;
      }

      .confirm-actions {
        flex-direction: column-reverse;
      }

      .confirm-actions .btn {
        width: 100%;
      }

      .footer-content {
        flex-direction: column;
        gap: 8px;
      }

      .separator {
        display: none;
      }
    }

    /* 减少动画偏好 */
    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* 打印样式 */
    @media print {
      body {
        background: white;
        color: black;
      }

      .bg-orb,
      .actions,
      .link-actions,
      .drag-handle {
        display: none !important;
      }

      .links-container {
        background: white;
        border: 1px solid #ddd;
        box-shadow: none;
      }

      .link-item {
        background: #f5f5f5;
        border: 1px solid #ddd;
        break-inside: avoid;
      }
    }
  </style>
</head>

<body>
  <!-- 背景装饰 -->
  <div class="bg-orb bg-orb-1" aria-hidden="true"></div>
  <div class="bg-orb bg-orb-2" aria-hidden="true"></div>

  <div class="container">
    <header>
      <a href="https://xuefulu.ai/" target="_blank" rel="noopener noreferrer" class="header-logo-link">
        <h1 class="logo">
          <i class="fas fa-graduation-cap" aria-hidden="true"></i>

  <!-- 数据存储：初始兜底链接数据。

  <script>
    /**
     * 学府路1号 - 链接管理器
     */

    // ==================== 配置常量 ====================
    const CONFIG = {
      NOTIFICATION_DURATION: 3000
    };

    // 卡片配色方案 - Apple 生态色系（适配浅色背景）
    const CARD_COLORS = [
      { accent: '#0071e3', glow: 'rgba(0,113,227,0.08)', border: 'rgba(0,113,227,0.2)' },
      { accent: '#34c759', glow: 'rgba(52,199,89,0.08)', border: 'rgba(52,199,89,0.2)' },
      { accent: '#ff9500', glow: 'rgba(255,149,0,0.08)', border: 'rgba(255,149,0,0.2)' },
      { accent: '#ff3b30', glow: 'rgba(255,59,48,0.08)', border: 'rgba(255,59,48,0.2)' },
      { accent: '#af52de', glow: 'rgba(175,82,222,0.08)', border: 'rgba(175,82,222,0.2)' },
      { accent: '#5ac8fa', glow: 'rgba(90,200,250,0.08)', border: 'rgba(90,200,250,0.2)' },
      { accent: '#ff6482', glow: 'rgba(255,100,130,0.08)', border: 'rgba(255,100,130,0.2)' },
      { accent: '#00c7be', glow: 'rgba(0,199,190,0.08)', border: 'rgba(0,199,190,0.2)' },
    ];

    // ==================== 状态管理 ====================
    const state = {
      links: [],
      isEditing: false,
      editingId: null,
      deleteId: null,
      draggedItem: null,
      justDragged: false,
      notificationTimer: null,
      lastFocused: null
    };

    // ==================== DOM元素缓存 ====================
    const elements = {
      linksGrid: document.getElementById('linksGrid'),
      emptyState: document.getElementById('emptyState'),
      addLinkBtn: document.getElementById('addLinkBtn'),
      downloadBtn: document.getElementById('downloadBtn'),
      linkModal: document.getElementById('linkModal'),
      deleteConfirmModal: document.getElementById('deleteConfirmModal'),
      closeModal: document.getElementById('closeModal'),
      cancelBtn: document.getElementById('cancelBtn'),
      linkForm: document.getElementById('linkForm'),
      modalTitleText: document.getElementById('modalTitleText'),
      linkName: document.getElementById('linkName'),
      linkUrl: document.getElementById('linkUrl'),
      deleteConfirmText: document.getElementById('deleteConfirmText'),
      cancelDeleteBtn: document.getElementById('cancelDeleteBtn'),
      confirmDeleteBtn: document.getElementById('confirmDeleteBtn'),
      notification: document.getElementById('notification'),
      notificationText: document.getElementById('notificationText'),
      notificationIcon: document.getElementById('notificationIcon'),
      initialData: document.getElementById('initialData'),
      wechatHelperBtn: document.getElementById('wechatHelperBtn')
    };

    // ==================== 工具函数 ====================
    const utils = {
      generateId: () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8),

      escapeHtml: (text) => {
        const m = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return String(text).replace(/[&<>"']/g, c => m[c]);
      },

      getHostname: (url) => {
        try { return new URL(url).hostname; } catch { return ''; }
      },

      // 提取主域名：去掉子域名前缀，只保留根域名
      // 如 www.doubao.com → doubao.com、sc.gcut.edu.cn → gcut.edu.cn、chat.z.ai → z.ai
      // 最后两段是多段后缀（edu.cn、com.cn 等）时保留三段，否则保留两段
      getMainDomain: (hostname) => {
        if (!hostname) return '';
        const labels = hostname.split('.');
        const multiSuffixes = new Set(['com.cn', 'net.cn', 'org.cn', 'gov.cn', 'edu.cn', 'ac.cn', 'mil.cn', 'co.cn']);
        const keep = multiSuffixes.has(labels.slice(-2).join('.')) ? 3 : 2;
        return labels.slice(-keep).join('.');
      },
    };

    // ==================== 文件下载 ====================
    function downloadFile(filename, content) {
      const blob = new Blob([content], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      requestAnimationFrame(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });
    }

    // ==================== Favicon 加载（源站优先 → Google 兜底 → 学士帽，带缓存） ====================
    const faviconCache = new Map();

    function renderFaviconFallback(container) {
      container.innerHTML = '<i class="fas fa-graduation-cap favicon-fallback"></i>';
    }

    function loadFavicon(domain, container) {
      if (!domain) {
        renderFaviconFallback(container);
        return;
      }

      // 命中缓存：复用已加载的图片，避免拖拽重排时重复请求
      if (faviconCache.has(domain)) {
        const cached = faviconCache.get(domain);
        if (cached) container.appendChild(cached.cloneNode());
        else renderFaviconFallback(container);
        return;
      }

      const sources = [
        `https://${domain}/favicon.ico`,
        `https://www.google.com/s2/favicons?domain=${domain}&sz=32`
      ];

      let index = 0;
      const tryNext = () => {
        if (index >= sources.length) {
          faviconCache.set(domain, null);
          renderFaviconFallback(container);
          return;
        }
        const img = new Image();
        img.alt = '';
        img.onload = () => {
          // Google 服务取不到时返回 16×16 默认图标，继续降级
          if (index === 1 && img.naturalWidth <= 16) {
            index++;
            tryNext();
            return;
          }
          faviconCache.set(domain, img);
          container.appendChild(img);
        };
        img.onerror = () => { index++; tryNext(); };
        img.src = sources[index];
      };
      tryNext();
    }

    // ==================== UI管理 ====================
    const ui = {
      showNotification: (message, isError = false) => {
        if (state.notificationTimer) {
          clearTimeout(state.notificationTimer);
          elements.notification.classList.remove('show');
        }
        elements.notificationText.textContent = message;
        elements.notification.classList.toggle('error', isError);
        elements.notificationIcon.classList.toggle('fa-check-circle', !isError);
        elements.notificationIcon.classList.toggle('fa-exclamation-circle', isError);
        void elements.notification.offsetHeight;
        elements.notification.classList.add('show');
        state.notificationTimer = setTimeout(() => {
          elements.notification.classList.remove('show');
          state.notificationTimer = null;
        }, CONFIG.NOTIFICATION_DURATION);
      },

      toggleModal: (modal, show) => {
        if (show) {
          state.lastFocused = document.activeElement;
          modal.classList.add('show');
          const firstInput = modal.querySelector('input, button');
          if (firstInput) requestAnimationFrame(() => firstInput.focus());
        } else {
          modal.classList.remove('show');
          if (state.lastFocused?.focus) {
            state.lastFocused.focus();
            state.lastFocused = null;
          }
        }
      },

      renderLinks: () => {
        const { links } = state;

        if (!links?.length) {
          elements.linksGrid.style.display = 'none';
          elements.emptyState.style.display = 'block';
          return;
        }

        elements.emptyState.style.display = 'none';
        elements.linksGrid.style.display = 'grid';

        const fragment = document.createDocumentFragment();

        links.forEach((link, index) => {
          if (!link?.id) return;

          const colorSet = CARD_COLORS[index % CARD_COLORS.length];
          const hostname = utils.getHostname(link.url);

          const item = document.createElement('div');
          item.className = 'link-item';
          item.dataset.id = link.id;
          item.dataset.index = index;
          item.draggable = true;
          item.tabIndex = 0;
          item.setAttribute('role', 'listitem');
          item.style.cssText = `--card-accent: ${colorSet.accent}; --card-glow: ${colorSet.glow}; --card-accent-border: ${colorSet.border};`;

          const displayName = utils.escapeHtml(link.name || '未命名链接');
          const displayDomain = utils.escapeHtml(utils.getMainDomain(hostname) || hostname || link.url || '无地址');

          item.innerHTML = `
            <div class="drag-handle" aria-label="拖动排序">
              <i class="fas fa-grip-vertical" aria-hidden="true"></i>
            </div>
            <div class="link-favicon" aria-hidden="true"></div>
            <div class="link-content" aria-label="访问 ${displayName}">
              <div class="link-title">${displayName}</div>
              <div class="link-url">${displayDomain}</div>
            </div>
            <div class="link-actions">
              <button class="action-btn edit-btn" type="button" aria-label="编辑 ${displayName}" title="编辑 (右键点击链接也可)">
                <i class="fas fa-edit" aria-hidden="true"></i>
              </button>
              <button class="action-btn move-btn move-up" type="button" aria-label="上移 ${displayName}" title="上移">
                <i class="fas fa-chevron-up" aria-hidden="true"></i>
              </button>
              <button class="action-btn move-btn move-down" type="button" aria-label="下移 ${displayName}" title="下移">
                <i class="fas fa-chevron-down" aria-hidden="true"></i>
              </button>
              <button class="action-btn delete-btn" type="button" aria-label="删除 ${displayName}" title="删除">
                <i class="fas fa-trash-alt" aria-hidden="true"></i>
              </button>
            </div>
          `;

          loadFavicon(hostname, item.querySelector('.link-favicon'));

          fragment.appendChild(item);
        });

        elements.linksGrid.innerHTML = '';
        elements.linksGrid.appendChild(fragment);
      }
    };

    // ==================== 事件处理器 ====================
    const handlers = {
      // 打开链接
      openLink: (url) => {
        if (!url) return;
        try {
          const parsed = new URL(url);
          if (!['http:', 'https:'].includes(parsed.protocol)) return;
          // 统一用新标签页打开，避免同域链接覆盖当前导航页
          window.open(url, '_blank', 'noopener');
        } catch { /* 忽略非法 URL */ }
      },

      // 打开添加模态框
      openAddModal: () => {
        state.isEditing = false;
        state.editingId = null;
        elements.modalTitleText.textContent = '添加新链接';
        elements.linkForm.reset();
        ui.toggleModal(elements.linkModal, true);
      },

      // 打开编辑模态框
      openEditModal: (id) => {
        const link = handlers.findLinkById(id);
        if (!link) return;

        state.isEditing = true;
        state.editingId = id;
        elements.modalTitleText.textContent = '编辑链接';
        elements.linkName.value = link.name || '';
        elements.linkUrl.value = link.url || '';
        ui.toggleModal(elements.linkModal, true);
      },

      // 打开删除确认模态框
      openDeleteModal: (id, name) => {
        state.deleteId = id;
        elements.deleteConfirmText.textContent = `确定要删除"${name || '未命名链接'}"吗？此操作无法撤销！`;
        ui.toggleModal(elements.deleteConfirmModal, true);
      },

      // 关闭所有模态框
      closeModals: () => {
        ui.toggleModal(elements.linkModal, false);
        ui.toggleModal(elements.deleteConfirmModal, false);
        state.isEditing = false;
        state.editingId = null;
        state.deleteId = null;
      },

      // 保存链接
      saveLink: (e) => {
        e.preventDefault();

        const name = elements.linkName.value.trim();
        const url = elements.linkUrl.value.trim();

        if (!name || !url) {
          ui.showNotification('请填写链接标题和地址', true);
          return;
        }

        // 自动补全协议
        let finalUrl = url;
        if (!/^https?:\/\//i.test(url)) {
          finalUrl = `https://${url}`;
        }

        try {
          const parsed = new URL(finalUrl);
          if (!['http:', 'https:'].includes(parsed.protocol)) throw new Error('unsupported protocol');
        } catch {
          ui.showNotification('请输入有效的 http/https 链接', true);
          return;
        }

        if (state.isEditing && state.editingId) {
          const index = state.links.findIndex(l => l.id === state.editingId);
          if (index !== -1) {
            state.links[index] = { ...state.links[index], name, url: finalUrl };
            ui.showNotification('链接已更新');
          } else {
            ui.showNotification('该链接不存在，可能已被删除', true);
            return;
          }
        } else {
          state.links.push({
            id: utils.generateId(),
            name,
            url: finalUrl,
          });
          ui.showNotification('链接已添加');
        }

        ui.renderLinks();
        handlers.closeModals();
      },

      // 删除链接
      confirmDelete: () => {
        if (state.deleteId === null) return;

        const index = state.links.findIndex(l => l.id === state.deleteId);
        if (index !== -1) {
          const deletedName = state.links[index].name;
          state.links.splice(index, 1);
          ui.renderLinks();
          ui.showNotification(`已删除"${deletedName || '未命名链接'}"`);
        }

        handlers.closeModals();
      },

      // 上移/下移排序（触屏设备替代拖拽）
      moveLink: (id, direction) => {
        const index = state.links.findIndex(l => String(l.id) === String(id));
        const target = index + direction;
        if (index === -1 || target < 0 || target >= state.links.length) return;
        [state.links[index], state.links[target]] = [state.links[target], state.links[index]];
        ui.renderLinks();
        ui.showNotification(direction < 0 ? '链接已上移' : '链接已下移');
      },

      // 下载页面
      downloadPage: () => {
        try {
          const clone = document.documentElement.cloneNode(true);
          // 在克隆上更新数据，避免影响页面实时 DOM
          const dataScript = clone.querySelector('#initialData');
          if (dataScript) dataScript.textContent = JSON.stringify(state.links);
          clone.querySelector('.notification')?.classList.remove('show');
          clone.querySelectorAll('.modal').forEach(m => m.classList.remove('show'));
          const html = `<!DOCTYPE html>\n${clone.outerHTML}`;
          const d = new Date(), p = (n) => String(n).padStart(2, '0');
          const ts = `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
          const filename = `${ts}-xuefulu-backup.html`;
          downloadFile(filename, html);
          ui.showNotification(`备份已下载: ${filename}`);
        } catch (e) {
          console.error('Download failed:', e);
          ui.showNotification('下载失败，请重试', true);
        }
      },

      // 拖拽开始（仅从拖拽手柄触发，避免在卡片其他区域误触发排序）
      dragStart: (e) => {
        const handle = e.target.closest('.drag-handle');
        if (!handle) {
          e.preventDefault();
          return;
        }
        const item = handle.closest('.link-item');
        if (!item) return;
        state.draggedItem = item;
        item.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', item.dataset.id);
      },

      // 拖拽经过
      dragOver: (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
      },

      // 拖拽进入
      dragEnter: (e) => {
        e.preventDefault();
        const item = e.target.closest('.link-item');
        if (item && item !== state.draggedItem) {
          item.classList.add('drag-over');
        }
      },

      // 拖拽离开
      dragLeave: (e) => {
        const item = e.target.closest('.link-item');
        if (item) item.classList.remove('drag-over');
      },

      // 放置
      drop: (e) => {
        e.preventDefault();
        const target = e.target.closest('.link-item');
        if (!target) return;
        target.classList.remove('drag-over');

        if (state.draggedItem && state.draggedItem !== target) {
          const items = Array.from(elements.linksGrid.querySelectorAll('.link-item'));
          const fromIndex = parseInt(state.draggedItem.dataset.index);
          const toIndex = parseInt(target.dataset.index);

          if (!isNaN(fromIndex) && !isNaN(toIndex)) {
            const [moved] = state.links.splice(fromIndex, 1);
            state.links.splice(toIndex, 0, moved);
            ui.renderLinks();
            ui.showNotification('链接顺序已更新');
          }
        }
      },

      // 拖拽结束
      dragEnd: (e) => {
        const item = e.target.closest('.link-item');
        if (item) item.classList.remove('dragging');
        elements.linksGrid.querySelectorAll('.link-item').forEach(el => {
          el.classList.remove('drag-over');
        });
        state.draggedItem = null;
        state.justDragged = true;
      },

      // 键盘导航
      handleLinkKeydown: (e) => {
        // 按钮、输入框等可交互元素自己处理键盘事件，避免误触发打开链接
        if (e.target.closest('button, input, textarea, select, a')) return;
        const item = e.target.closest('.link-item');
        if (!item) return;
        const id = item.dataset.id;
        const link = handlers.findLinkById(id);
        if (!link) return;

        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          handlers.openLink(link.url);
        } else if (e.key === 'Delete' || e.key === 'Backspace') {
          e.preventDefault();
          handlers.openDeleteModal(link.id, link.name);
        } else if (e.key === 'e' && e.ctrlKey) {
          e.preventDefault();
          handlers.openEditModal(link.id);
        }
      },

      // 网格事件委托：点击打开/编辑/删除
      handleGridClick: (e) => {
        const item = e.target.closest('.link-item');
        if (!item) return;
        const link = handlers.findLinkById(item.dataset.id);
        if (!link) return;

        if (e.target.closest('.edit-btn')) {
          handlers.openEditModal(link.id);
        } else if (e.target.closest('.delete-btn')) {
          handlers.openDeleteModal(link.id, link.name);
        } else if (e.target.closest('.move-up')) {
          handlers.moveLink(link.id, -1);
        } else if (e.target.closest('.move-down')) {
          handlers.moveLink(link.id, 1);
        } else if (!e.target.closest('.drag-handle')) {
          // 整卡可点：除拖拽手柄和操作按钮外，点击任意区域都打开链接
          handlers.openLink(link.url);
        }
      },

      // 网格事件委托：右键卡片打开编辑
      handleGridContextMenu: (e) => {
        const item = e.target.closest('.link-item');
        if (!item || e.target.closest('button')) return;
        e.preventDefault();
        const link = handlers.findLinkById(item.dataset.id);
        if (link) handlers.openEditModal(link.id);
      },

      findLinkById: (id) => state.links.find(l => String(l.id) === String(id)),

      // 键盘快捷键
      handleKeydown: (e) => {
        if (e.key === 'Escape') {
          handlers.closeModals();
        }

        // Ctrl/Cmd + S 保存（防止浏览器默认保存）
        if ((e.ctrlKey || e.metaKey) && e.key === 's') {
          e.preventDefault();
          handlers.downloadPage();
        }
      },
    };

    // ==================== 初始化 ====================
    const init = () => {
      // 统一 ID 为字符串，保证新增/初始链接的严格相等比较一致
      state.links = JSON.parse(elements.initialData.textContent || '[]').map(link => ({ ...link, id: String(link.id) }));

      ui.renderLinks();

      elements.addLinkBtn.addEventListener('click', handlers.openAddModal);
      elements.downloadBtn.addEventListener('click', handlers.downloadPage);
      elements.wechatHelperBtn.addEventListener('click', () => {
        window.open('https://filehelper.weixin.qq.com/', '_blank');
      });
      [elements.closeModal, elements.cancelBtn, elements.cancelDeleteBtn].forEach(el => el.addEventListener('click', handlers.closeModals));
      elements.confirmDeleteBtn.addEventListener('click', handlers.confirmDelete);
      elements.linkForm.addEventListener('submit', handlers.saveLink);

      [elements.linkModal, elements.deleteConfirmModal].forEach(modal => {
        modal.addEventListener('click', (e) => {
          if (e.target === modal) handlers.closeModals();
        });
      });

      // 事件委托：拖拽和键盘导航
      elements.linksGrid.addEventListener('dragstart', handlers.dragStart);
      elements.linksGrid.addEventListener('dragover', handlers.dragOver);
      elements.linksGrid.addEventListener('dragenter', handlers.dragEnter);
      elements.linksGrid.addEventListener('dragleave', handlers.dragLeave);
      elements.linksGrid.addEventListener('drop', handlers.drop);
      elements.linksGrid.addEventListener('dragend', handlers.dragEnd);
      elements.linksGrid.addEventListener('keydown', handlers.handleLinkKeydown);
      elements.linksGrid.addEventListener('click', handlers.handleGridClick);
      elements.linksGrid.addEventListener('contextmenu', handlers.handleGridContextMenu);

      document.addEventListener('keydown', handlers.handleKeydown);

      // 拖拽结束后抑制一次 click（浏览器会在 drop 后补发），防止误打开链接；下次按下指针时复位
      document.addEventListener('pointerdown', () => { state.justDragged = false; }, true);
      document.addEventListener('click', (e) => {
        if (state.justDragged) {
          e.preventDefault();
          e.stopPropagation();
          state.justDragged = false;
        }
      }, true);

      // 先用本地年份兜底，避免同步完成前显示错误年份
      updateFooterYear(true);
      startSync();
    };

    // ==================== 时间同步与显示（原生 Intl 实现，无第三方依赖） ====================
    const TIME = {
      SYNC_INTERVAL_MS: 5 * 60 * 1000,
      offset: 0,
      syncTimer: null,
      formatter: new Intl.DateTimeFormat('zh-CN', {
        timeZone: 'Asia/Shanghai',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        weekday: 'long',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hourCycle: 'h23'
      })
    };

    const timeEl = document.getElementById('currentDateTime');
    const syncStatusEl = document.getElementById('timeSyncStatus');

    function getBeijingParts() {
      return TIME.formatter.formatToParts(new Date(Date.now() + TIME.offset));
    }

    function getBeijingPart(type) {
      const part = getBeijingParts().find(p => p.type === type);
      return part ? part.value : '';
    }

    function updateDisplay() {
      if (!timeEl) return;
      const parts = {};
      for (const p of getBeijingParts()) parts[p.type] = p.value;
      timeEl.textContent = `${parts.year}年${parts.month}月${parts.day}日 ${parts.weekday} ${parts.hour}:${parts.minute}:${parts.second}`;
    }

    function updateFooterYear(useLocal) {
      const yearEl = document.getElementById('footerYear');
      if (!yearEl) return;
      yearEl.textContent = useLocal ? new Date().getFullYear() : getBeijingPart('year');
    }

    async function syncTime() {
      if (syncStatusEl) {
        syncStatusEl.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
      }

      let best = null;
      let bestRtt = Infinity;

      // 多轮探测（3次），取最低 RTT 的结果（网络抖动最小）
      for (let attempt = 0; attempt < 3; attempt++) {
        const t0 = performance.now();
        try {
          const res = await fetch('https://api.shijian.online/timestamp/', { cache: 'no-store', mode: 'cors' });
          const data = await res.json();
          const t1 = performance.now();
          if (data.status === 1 && data.data && data.data.timestamp) {
            const rtt = t1 - t0;
            if (rtt < bestRtt) {
              bestRtt = rtt;
              // 估算网络时间：服务器时间 + 单向延迟（RTT/2）
              best = data.data.timestamp + Math.round(rtt / 2);
            }
          }
        } catch (e) { continue; }
      }

      if (best) {
        TIME.offset = best - Date.now();
        if (syncStatusEl) syncStatusEl.innerHTML = '';
        updateFooterYear(false);
      } else {
        if (syncStatusEl) syncStatusEl.innerHTML = '<i class="fas fa-exclamation-circle" style="color:#f59e0b;opacity:0.8" title="时间同步失败，显示为本机时间"></i>';
        updateFooterYear(true);
      }

      updateDisplay();
    }

    function startSync() {
      syncTime();
      if (TIME.syncTimer) clearInterval(TIME.syncTimer);
      TIME.syncTimer = setInterval(syncTime, TIME.SYNC_INTERVAL_MS);
      setInterval(updateDisplay, 1000);
    }

    // 统一启动入口
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>

</html>
