<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学府路1号 xuefulu.ai</title>
  <!-- 阻止浏览器缓存 HTML，确保每次访问都是最新版本 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/dayjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/plugin/utc.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/plugin/timezone.js"></script>
  <style>
    /* ==================== CSS变量系统 ==================== */
    :root {
      --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      --glass-bg: rgba(255, 255, 255, 0.15);
      --glass-border: rgba(255, 255, 255, 0.2);
      --glass-hover: rgba(255, 255, 255, 0.25);
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.8);
      --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 15px 40px rgba(0, 0, 0, 0.3);
      --transition-fast: 0.2s ease;
      --transition-normal: 0.3s ease;
      --radius-sm: 10px;
      --radius-md: 15px;
      --radius-lg: 20px;
    }

    /* ==================== 基础重置 ==================== */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-size: 100%;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
      background: var(--primary-gradient);
      min-height: 100dvh;
      padding: clamp(10px, 3vw, 20px);
      overflow-x: hidden;
      position: relative;
      line-height: 1.6;
    }

    /* 背景装饰 */
    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
      animation: float 8s ease-in-out infinite;
    }

    .bg-orb-1 {
      top: -10%;
      right: -5%;
      width: min(500px, 50vw);
      height: min(500px, 50vw);
      background: radial-gradient(circle, rgba(255, 255, 255, 0.3) 0%, transparent 70%);
    }

    .bg-orb-2 {
      bottom: -10%;
      left: -5%;
      width: min(400px, 40vw);
      height: min(400px, 40vw);
      background: radial-gradient(circle, rgba(118, 75, 162, 0.4) 0%, transparent 70%);
      animation-delay: -2s;
      animation-direction: reverse;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0) translateX(0);
      }

      50% {
        transform: translateY(-30px) translateX(20px);
      }
    }

    /* ==================== 布局容器 ==================== */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    /* ==================== 头部 ==================== */
    header {
      text-align: center;
      padding: clamp(20px, 5vw, 30px) 20px;
      color: var(--text-primary);
      margin-bottom: 0;
    }

    .logo {
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
    }

    .logo i {
      color: #ffd600;
      filter: drop-shadow(0 0 10px rgba(255, 214, 0, 0.4));
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.05);
      }
    }

    /* ==================== 链接类（替代重复 inline styles） ==================== */
    .header-logo-link,
    .header-title-link {
      text-decoration: none;
      color: inherit;
    }

    .header-logo-link {
      display: block;
    }

    .header-title-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .highlight-tag {
      background: #fde047;
      color: #111827;
      font-weight: 700;
      padding: 0.125rem 0.375rem;
      border-radius: 0.25rem;
    }

    /* 金色强调色（替代 inline style） */
    .gold-accent {
      color: #FFD700;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }

    /* ==================== 主内容区 ==================== */
    .main-content {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .links-container {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border-radius: var(--radius-lg);
      padding: clamp(20px, 4vw, 30px);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--glass-border);
    }

    .links-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .links-header h2 {
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.05rem;
      font-weight: 600;
    }

    /* ==================== 按钮系统 ==================== */
    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all var(--transition-normal);
      font-size: 0.95rem;
      outline: none;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      white-space: nowrap;
    }

    .btn:focus-visible,
    .link-item:focus-visible {
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.4);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-primary {
      --btn-shadow: rgba(102, 126, 234, 0.4);
      background: rgba(102, 126, 234, 0.8);
      color: white;
    }

    .btn-primary:hover {
      background: rgba(102, 126, 234, 0.95);
      box-shadow: 0 8px 20px var(--btn-shadow);
    }

    .btn-success {
      --btn-shadow: rgba(76, 175, 80, 0.4);
      background: rgba(76, 175, 80, 0.8);
      color: white;
    }

    .btn-success:hover {
      background: rgba(76, 175, 80, 0.95);
      box-shadow: 0 8px 20px var(--btn-shadow);
    }

    .btn-wechat {
      --btn-shadow: rgba(7, 193, 96, 0.4);
      background: rgba(7, 193, 96, 0.85);
      color: white;
    }

    .btn-wechat:hover {
      background: rgba(7, 193, 96, 1);
      box-shadow: 0 8px 20px var(--btn-shadow);
    }

    .btn-wechat i {
      transform: scale(1.05);
    }

    .btn-danger {
      --btn-shadow: rgba(229, 57, 53, 0.4);
      background: rgba(229, 57, 53, 0.8);
      color: white;
    }

    .btn-danger:hover {
      background: rgba(229, 57, 53, 0.95);
      box-shadow: 0 8px 20px var(--btn-shadow);
    }

    .btn-cancel {
      background: rgba(255, 255, 255, 0.2);
      color: white;
    }

    .btn-cancel:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    /* ==================== 链接网格 ==================== */
    .links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
      min-height: 100px;
    }

    @media (max-width: 640px) {
      .links-grid {
        grid-template-columns: 1fr;
      }
    }

    /* ==================== 链接卡片 ==================== */
    .link-item {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: move;
      transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      border: 1px solid var(--glass-border);
      position: relative;
      user-select: none;
      outline: none;
      overflow: hidden;
    }

    /* 左侧彩色强调条 */
    .link-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 4px;
      bottom: 4px;
      width: 4px;
      background: var(--card-accent, rgba(255, 255, 255, 0.3));
      border-radius: 0 4px 4px 0;
      transition: all var(--transition-normal);
    }

    .link-item:hover {
      background: rgba(255, 255, 255, 0.13);
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15), 0 0 20px var(--card-glow, transparent);
      border-color: var(--card-accent-border, var(--glass-border));
    }

    .link-item:hover::before {
      width: 5px;
      box-shadow: 0 0 10px var(--card-accent, transparent);
      top: 0;
      bottom: 0;
      border-radius: 0 3px 3px 0;
    }

    .link-item.dragging {
      opacity: 0.6;
      transform: rotate(2deg) scale(1.02);
      box-shadow: var(--shadow-lg);
      z-index: 100;
      background: rgba(255, 255, 255, 0.3);
    }

    .link-item.drag-over {
      border: 2px dashed rgba(255, 255, 255, 0.8);
      transform: scale(1.02);
      background: rgba(102, 126, 234, 0.25);
    }

    .link-item.drag-over::before {
      opacity: 0;
    }

    .link-item.drag-over::after {
      content: "释放放置";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(102, 126, 234, 0.9);
      color: white;
      font-weight: bold;
      border-radius: inherit;
      backdrop-filter: blur(4px);
      font-size: 0.9rem;
    }

    /* 链接Favicon */
    .link-favicon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: all var(--transition-normal);
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .link-favicon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: inherit;
      padding: 4px;
    }

    .link-favicon .favicon-fallback {
      color: var(--card-accent);
      font-size: 1.1rem;
    }

    .link-item:hover .link-favicon {
      transform: scale(1.08);
      border-color: var(--card-accent-border, rgba(255, 255, 255, 0.3));
      background: rgba(255, 255, 255, 0.15);
    }

    /* 拖拽手柄 */
    .drag-handle {
      color: rgba(255, 255, 255, 0.3);
      font-size: 1rem;
      cursor: grab;
      padding: 4px;
      transition: all var(--transition-fast);
      flex-shrink: 0;
    }

    .link-item:hover .drag-handle,
    .link-item.dragging .drag-handle {
      color: rgba(255, 255, 255, 0.7);
      transform: scale(1.1);
    }

    .link-item.dragging .drag-handle {
      cursor: grabbing;
    }

    /* 链接内容 */
    .link-content {
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

    .link-title {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 2px;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .link-url {
      font-size: 0.78rem;
      color: rgba(255, 255, 255, 0.45);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 操作按钮 */
    .link-actions {
      display: flex;
      gap: 5px;
      opacity: 0;
      transition: all var(--transition-fast);
      transform: translateX(8px);
    }

    .link-item:hover .link-actions,
    .link-item:focus-within .link-actions {
      opacity: 1;
      transform: translateX(0);
    }

    @media (pointer: coarse) {
      .link-actions {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition-fast);
      color: rgba(255, 255, 255, 0.6);
      flex-shrink: 0;
      font-size: 0.8rem;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.1);
      color: white;
    }

    .edit-btn:hover {
      background: rgba(102, 126, 234, 0.5);
    }

    .delete-btn:hover {
      background: rgba(229, 57, 53, 0.5);
    }

    /* ==================== 空状态 ==================== */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .empty-state i {
      font-size: 3.5rem;
      margin-bottom: 20px;
      opacity: 0.5;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    /* ==================== 模态框 ==================== */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(5px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity var(--transition-normal);
      padding: 20px;
    }

    .modal.show {
      display: flex;
      opacity: 1;
    }

    .modal-content {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 480px;
      padding: 28px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--glass-border);
      transform: scale(0.95);
      transition: transform var(--transition-normal);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal.show .modal-content {
      transform: scale(1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .modal-header h3 {
      color: var(--text-primary);
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .close-modal {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 1.5rem;
      cursor: pointer;
      color: white;
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .close-modal:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: rotate(90deg);
    }

    /* ==================== 表单 ==================== */
    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--text-primary);
      font-size: 0.95rem;
    }

    .form-control {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: var(--radius-sm);
      font-size: 1rem;
      transition: all var(--transition-fast);
      outline: none;
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }

    .form-control::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .form-control:focus {
      border-color: rgba(255, 255, 255, 0.6);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.15);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 28px;
    }

    /* 删除确认特殊样式 */
    .delete-confirm-content {
      text-align: center;
      padding: 20px;
    }

    .delete-confirm-content>i {
      font-size: 3.5rem;
      color: #ff6b6b;
      margin-bottom: 20px;
      display: inline-block;
      animation: shake 0.5s ease-in-out;
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-5px);
      }

      75% {
        transform: translateX(5px);
      }
    }

    .delete-confirm-content p {
      color: var(--text-primary);
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .confirm-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    /* ==================== 通知 ==================== */
    .notification {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: rgba(76, 175, 80, 0.95);
      backdrop-filter: blur(15px);
      color: white;
      padding: 14px 24px;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 1001;
      transform: translateY(100px) scale(0.9);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      max-width: min(400px, 90vw);
    }

    .notification.show {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    .notification.error {
      background: rgba(229, 57, 53, 0.95);
    }

    /* ==================== 页脚 ==================== */
    .footer {
      text-align: center;
      color: var(--text-secondary);
      padding: 30px 0 20px;
      font-size: 0.9rem;
    }

    .footer-content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .footer-link {
      color: #FFD700;
      text-decoration: none;
      transition: all var(--transition-fast);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
    }

    .footer-link:hover {
      color: white;
      text-decoration: underline;
      transform: translateY(-2px);
    }

    .separator {
      opacity: 0.4;
    }

    /* ==================== 时间显示 ==================== */
    .time-display {
      text-align: center;
      padding: 6px 0;
      color: var(--text-primary);
      position: relative;
      z-index: 1;
    }
    .time-display .time-main {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .time-display .time-sync-status {
      font-size: 0.7rem;
      opacity: 0.5;
      margin-left: 6px;
      vertical-align: middle;
    }

    /* ==================== 响应式优化 ==================== */
    @media (max-width: 768px) {
      .links-header {
        flex-direction: column;
        align-items: stretch;
      }

      .actions {
        width: 100%;
      }

      .btn {
        flex: 1;
        justify-content: center;
      }

      .modal-actions {
        flex-direction: column-reverse;
      }

      .modal-actions .btn {
        width: 100%;
        justify-content: center;
      }

      .notification {
        left: 16px;
        right: 16px;
        bottom: 16px;
      }
    }

    @media (max-width: 480px) {
      .logo {
        flex-direction: column;
        gap: 10px;
      }

      .confirm-actions {
        flex-direction: column-reverse;
      }

      .confirm-actions .btn {
        width: 100%;
      }

      .footer-content {
        flex-direction: column;
        gap: 8px;
      }

      .separator {
        display: none;
      }
    }

    /* 减少动画偏好 */
    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* 打印样式 */
    @media print {
      body {
        background: white;
        color: black;
      }

      .bg-orb,
      .actions,
      .link-actions,
      .drag-handle {
        display: none !important;
      }

      .links-container {
        background: white;
        border: 1px solid #ddd;
        box-shadow: none;
      }

      .link-item {
        background: #f5f5f5;
        border: 1px solid #ddd;
        break-inside: avoid;
      }
    }
  </style>
</head>

<body>
  <!-- 背景装饰 -->
  <div class="bg-orb bg-orb-1" aria-hidden="true"></div>
  <div class="bg-orb bg-orb-2" aria-hidden="true"></div>

  <div class="container">
    <header>
      <a href="https://xuefulu.ai/" target="_blank" rel="noopener" class="header-logo-link">
        <h1 class="logo">
          <i class="fas fa-graduation-cap" aria-hidden="true"></i>
          <span>学府路<span class="gold-accent">1</span>号 · <span
              class="gold-accent">xuefulu.ai</span></span>
        </h1>
      </a>
      <div class="time-display">
        <span class="time-main">
          <span id="currentDateTime">--</span>
          <span class="time-sync-status" id="timeSyncStatus"><i class="fas fa-spinner fa-spin"></i></span>
        </span>
      </div>
    </header>

    <main class="main-content">
      <section class="links-container">
        <div class="links-header">
          <h2><a href="https://xuefulu.ai/" target="_blank" rel="noopener" class="header-title-link"><i
                class="fas fa-compass" aria-hidden="true"></i> 打开浏览器，在地址栏输入 <span

  <script>
    /**
     * 学府路1号 - 链接管理器
     * 优化后的JavaScript代码，使用ES6+特性和更好的架构
     */

    // ==================== 配置常量 ====================
    const CONFIG = {
      NOTIFICATION_DURATION: 3000
    };

    // 卡片配色方案 - 从主渐变中提取的丰富色板
    const CARD_COLORS = [
      { accent: '#667eea', glow: 'rgba(102,126,234,0.12)', border: 'rgba(102,126,234,0.35)' },
      { accent: '#764ba2', glow: 'rgba(118,75,162,0.12)', border: 'rgba(118,75,162,0.35)' },
      { accent: '#f093fb', glow: 'rgba(240,147,251,0.12)', border: 'rgba(240,147,251,0.35)' },
      { accent: '#4ecdc4', glow: 'rgba(78,205,196,0.12)', border: 'rgba(78,205,196,0.35)' },
      { accent: '#ffd93d', glow: 'rgba(255,217,61,0.12)', border: 'rgba(255,217,61,0.35)' },
      { accent: '#ff6b6b', glow: 'rgba(255,107,107,0.12)', border: 'rgba(255,107,107,0.35)' },
      { accent: '#a8e6cf', glow: 'rgba(168,230,207,0.12)', border: 'rgba(168,230,207,0.35)' },
      { accent: '#ff8a5c', glow: 'rgba(255,138,92,0.12)', border: 'rgba(255,138,92,0.35)' },
    ];

    // ==================== 状态管理 ====================
    const state = {
      links: [],
      isEditing: false,
      editingId: null,
      deleteId: null,
      draggedItem: null,
      notificationTimer: null,
      lastFocused: null
    };

    // ==================== DOM元素缓存 ====================
    const elements = {
      linksGrid: document.getElementById('linksGrid'),
      emptyState: document.getElementById('emptyState'),
      addLinkBtn: document.getElementById('addLinkBtn'),
      downloadBtn: document.getElementById('downloadBtn'),
      linkModal: document.getElementById('linkModal'),
      deleteConfirmModal: document.getElementById('deleteConfirmModal'),
      closeModal: document.getElementById('closeModal'),
      cancelBtn: document.getElementById('cancelBtn'),
      linkForm: document.getElementById('linkForm'),
      modalTitleText: document.getElementById('modalTitleText'),
      linkName: document.getElementById('linkName'),
      linkUrl: document.getElementById('linkUrl'),
      deleteConfirmText: document.getElementById('deleteConfirmText'),
      cancelDeleteBtn: document.getElementById('cancelDeleteBtn'),
      confirmDeleteBtn: document.getElementById('confirmDeleteBtn'),
      notification: document.getElementById('notification'),
      notificationText: document.getElementById('notificationText'),
      initialData: document.getElementById('initialData'),
      wechatHelperBtn: document.getElementById('wechatHelperBtn')
    };

    // ==================== 工具函数 ====================
    const utils = {
      generateId: () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8),

      escapeHtml: (text) => {
        const m = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return String(text).replace(/[&<>"']/g, c => m[c]);
      },

      getDomain: (url) => {
        try { return new URL(url).hostname; } catch { return ''; }
      },
    };

    // ==================== 文件下载 ====================
    function downloadFile(filename, content) {
      const blob = new Blob([content], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      requestAnimationFrame(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });
    }

    // ==================== Favicon 加载（三级降级） ====================
    function loadFavicon(url, container, onFallback, guard) {
      const img = new Image();
      img.alt = '';
      img.onload = () => {
        if (guard && guard(img)) { onFallback(); return; }
        container.appendChild(img);
      };
      img.onerror = onFallback;
      img.src = url;
    }

    // ==================== UI管理 ====================
    const ui = {
      showNotification: (message, isError = false) => {
        if (state.notificationTimer) {
          clearTimeout(state.notificationTimer);
          elements.notification.classList.remove('show');
        }
        elements.notificationText.textContent = message;
        elements.notification.classList.toggle('error', isError);
        void elements.notification.offsetHeight;
        elements.notification.classList.add('show');
        state.notificationTimer = setTimeout(() => {
          elements.notification.classList.remove('show');
          state.notificationTimer = null;
        }, CONFIG.NOTIFICATION_DURATION);
      },

      toggleModal: (modal, show) => {
        if (show) {
          state.lastFocused = document.activeElement;
          modal.classList.add('show');
          const firstInput = modal.querySelector('input, button');
          if (firstInput) requestAnimationFrame(() => firstInput.focus());
        } else {
          modal.classList.remove('show');
          if (state.lastFocused?.focus) {
            state.lastFocused.focus();
            state.lastFocused = null;
          }
        }
      },

      renderLinks: () => {
        const { links } = state;

        if (!links?.length) {
          elements.linksGrid.style.display = 'none';
          elements.emptyState.style.display = 'block';
          return;
        }

        elements.emptyState.style.display = 'none';
        elements.linksGrid.style.display = 'grid';

        const fragment = document.createDocumentFragment();

        links.forEach((link, index) => {
          if (!link?.id) return;

          const colorSet = CARD_COLORS[index % CARD_COLORS.length];
          const domain = utils.getDomain(link.url);

          const item = document.createElement('div');
          item.className = 'link-item';
          item.dataset.id = link.id;
          item.dataset.index = index;
          item.draggable = true;
          item.tabIndex = 0;
          item.setAttribute('role', 'listitem');
          item.style.cssText = `--card-accent: ${colorSet.accent}; --card-glow: ${colorSet.glow}; --card-accent-border: ${colorSet.border};`;

          const displayName = utils.escapeHtml(link.name || '未命名链接');
          const displayDomain = utils.escapeHtml(domain || link.url || '无地址');

          item.innerHTML = `
            <div class="drag-handle" aria-label="拖动排序">
              <i class="fas fa-grip-vertical" aria-hidden="true"></i>
            </div>
            <div class="link-favicon" aria-hidden="true"></div>
            <div class="link-content" aria-label="访问 ${displayName}">
              <div class="link-title">${displayName}</div>
              <div class="link-url">${displayDomain}</div>
            </div>
            <div class="link-actions">
              <button class="action-btn edit-btn" type="button" aria-label="编辑 ${displayName}" title="编辑 (右键点击链接也可)">
                <i class="fas fa-edit" aria-hidden="true"></i>
              </button>
              <button class="action-btn delete-btn" type="button" aria-label="删除 ${displayName}" title="删除">
                <i class="fas fa-trash-alt" aria-hidden="true"></i>
              </button>
            </div>
          `;

          // 加载 Favicon：Google 服务 → 源站 /favicon.ico → 学士帽
          const faviconContainer = item.querySelector('.link-favicon');
          if (domain) {
            const toFallback = () => loadFavicon(
              `https://${domain}/favicon.ico`,
              faviconContainer,
              () => { faviconContainer.innerHTML = '<i class="fas fa-graduation-cap favicon-fallback"></i>'; }
            );
            loadFavicon(
              `https://www.google.com/s2/favicons?domain=${domain}&sz=32`,
              faviconContainer,
              toFallback,
              (img) => img.naturalWidth <= 16
            );
          } else {
            faviconContainer.innerHTML = '<i class="fas fa-graduation-cap favicon-fallback"></i>';
          }

          const content = item.querySelector('.link-content');
          const editBtn = item.querySelector('.edit-btn');
          const deleteBtn = item.querySelector('.delete-btn');

          content.addEventListener('click', () => handlers.openLink(link.url));
          content.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            handlers.openEditModal(link.id);
          });

          editBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            handlers.openEditModal(link.id);
          });

          deleteBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            handlers.openDeleteModal(link.id, link.name);
          });

          fragment.appendChild(item);
        });

        elements.linksGrid.innerHTML = '';
        elements.linksGrid.appendChild(fragment);
      }
    };

    // ==================== 事件处理器 ====================
    const handlers = {
      // 打开链接
      openLink: (url) => {
        if (!url) return;
        try {
          const isExternal = new URL(url).hostname !== window.location.hostname;
          window.open(url, isExternal ? '_blank' : '_self');
        } catch { window.open(url, '_self'); }
      },

      // 打开添加模态框
      openAddModal: () => {
        state.isEditing = false;
        state.editingId = null;
        elements.modalTitleText.textContent = '添加新链接';
        elements.linkForm.reset();
        ui.toggleModal(elements.linkModal, true);
      },

      // 打开编辑模态框
      openEditModal: (id) => {
        const link = state.links.find(l => l.id === id);
        if (!link) return;

        state.isEditing = true;
        state.editingId = id;
        elements.modalTitleText.textContent = '编辑链接';
        elements.linkName.value = link.name || '';
        elements.linkUrl.value = link.url || '';
        ui.toggleModal(elements.linkModal, true);
      },

      // 打开删除确认模态框
      openDeleteModal: (id, name) => {
        state.deleteId = id;
        elements.deleteConfirmText.textContent = `确定要删除"${name || '未命名链接'}"吗？此操作无法撤销！`;
        ui.toggleModal(elements.deleteConfirmModal, true);
      },

      // 关闭所有模态框
      closeModals: () => {
        ui.toggleModal(elements.linkModal, false);
        ui.toggleModal(elements.deleteConfirmModal, false);
        elements.linkForm.reset();
        state.isEditing = false;
        state.editingId = null;
        state.deleteId = null;
      },

      // 保存链接
      saveLink: (e) => {
        e.preventDefault();

        const name = elements.linkName.value.trim();
        const url = elements.linkUrl.value.trim();

        if (!name || !url) {
          ui.showNotification('请填写链接标题和地址', true);
          return;
        }

        // 自动补全协议
        let finalUrl = url;
        if (!/^https?:\/\//i.test(url)) {
          finalUrl = `https://${url}`;
        }

        try { new URL(finalUrl); } catch {
          ui.showNotification('请输入有效的URL地址', true);
          return;
        }

        if (state.isEditing && state.editingId) {
          const index = state.links.findIndex(l => l.id === state.editingId);
          if (index !== -1) {
            state.links[index] = { ...state.links[index], name, url: finalUrl };
            ui.showNotification('链接已更新');
          }
        } else {
          state.links.push({
            id: utils.generateId(),
            name,
            url: finalUrl,
          });
          ui.showNotification('链接已添加');
        }

        ui.renderLinks();
        handlers.closeModals();
      },

      // 删除链接
      confirmDelete: () => {
        if (state.deleteId === null) return;

        const index = state.links.findIndex(l => l.id === state.deleteId);
        if (index !== -1) {
          const deletedName = state.links[index].name;
          state.links.splice(index, 1);
          ui.renderLinks();
          ui.showNotification(`已删除"${deletedName || '未命名链接'}"`);
        }

        handlers.closeModals();
      },

      // 下载页面
      downloadPage: () => {
        try {
          const clone = document.documentElement.cloneNode(true);
          // 在克隆上更新数据，避免影响页面实时 DOM
          const dataScript = clone.querySelector('#initialData');
          if (dataScript) dataScript.textContent = JSON.stringify(state.links);
          clone.querySelector('.notification')?.classList.remove('show');
          clone.querySelectorAll('.modal').forEach(m => m.classList.remove('show'));
          const html = `<!DOCTYPE html>\n${clone.outerHTML}`;
          const d = new Date(), p = (n) => String(n).padStart(2, '0');
          const ts = `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
          const filename = `${ts}-xuefulu-backup.html`;
          downloadFile(filename, html);
          ui.showNotification(`备份已下载: ${filename}`);
        } catch (e) {
          console.error('Download failed:', e);
          ui.showNotification('下载失败，请重试', true);
        }
      },

      // 拖拽开始
      dragStart: (e) => {
        const item = e.target.closest('.link-item');
        if (!item) return;
        state.draggedItem = item;
        item.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', item.dataset.id);
      },

      // 拖拽经过
      dragOver: (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
      },

      // 拖拽进入
      dragEnter: (e) => {
        e.preventDefault();
        const item = e.target.closest('.link-item');
        if (item && item !== state.draggedItem) {
          item.classList.add('drag-over');
        }
      },

      // 拖拽离开
      dragLeave: (e) => {
        const item = e.target.closest('.link-item');
        if (item) item.classList.remove('drag-over');
      },

      // 放置
      drop: (e) => {
        e.preventDefault();
        const target = e.target.closest('.link-item');
        if (!target) return;
        target.classList.remove('drag-over');

        if (state.draggedItem && state.draggedItem !== target) {
          const items = Array.from(elements.linksGrid.querySelectorAll('.link-item'));
          const fromIndex = parseInt(state.draggedItem.dataset.index);
          const toIndex = parseInt(target.dataset.index);

          if (!isNaN(fromIndex) && !isNaN(toIndex)) {
            // 重新排序
            const [moved] = state.links.splice(fromIndex, 1);
            state.links.splice(toIndex, 0, moved);
            ui.renderLinks();
            ui.showNotification('链接顺序已更新');
          }
        }
      },

      // 拖拽结束
      dragEnd: (e) => {
        const item = e.target.closest('.link-item');
        if (item) item.classList.remove('dragging');
        elements.linksGrid.querySelectorAll('.link-item').forEach(el => {
          el.classList.remove('drag-over');
        });
        state.draggedItem = null;
      },

      // 键盘导航
      handleLinkKeydown: (e) => {
        const item = e.target.closest('.link-item');
        if (!item) return;
        const id = item.dataset.id;
        const link = state.links.find(l => l.id === id);
        if (!link) return;

        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          handlers.openLink(link.url);
        } else if (e.key === 'Delete' || e.key === 'Backspace') {
          e.preventDefault();
          handlers.openDeleteModal(link.id, link.name);
        } else if (e.key === 'e' && e.ctrlKey) {
          e.preventDefault();
          handlers.openEditModal(link.id);
        }
      },

      // 键盘快捷键
      handleKeydown: (e) => {
        if (e.key === 'Escape') {
          handlers.closeModals();
        }

        // Ctrl/Cmd + S 保存（防止浏览器默认保存）
        if ((e.ctrlKey || e.metaKey) && e.key === 's') {
          e.preventDefault();
          handlers.downloadPage();
        }
      },
    };

    // ==================== 初始化 ====================
    const init = () => {
      state.links = JSON.parse(elements.initialData.textContent || '[]');

      ui.renderLinks();

      elements.addLinkBtn.addEventListener('click', handlers.openAddModal);
      elements.downloadBtn.addEventListener('click', handlers.downloadPage);
      elements.wechatHelperBtn.addEventListener('click', () => {
        window.open('https://filehelper.weixin.qq.com/', '_blank');
      });
      [elements.closeModal, elements.cancelBtn, elements.cancelDeleteBtn].forEach(el => el.addEventListener('click', handlers.closeModals));
      elements.confirmDeleteBtn.addEventListener('click', handlers.confirmDelete);
      elements.linkForm.addEventListener('submit', handlers.saveLink);

      [elements.linkModal, elements.deleteConfirmModal].forEach(modal => {
        modal.addEventListener('click', (e) => {
          if (e.target === modal) handlers.closeModals();
        });
      });

      // 事件委托：拖拽和键盘导航
      elements.linksGrid.addEventListener('dragstart', handlers.dragStart);
      elements.linksGrid.addEventListener('dragover', handlers.dragOver);
      elements.linksGrid.addEventListener('dragenter', handlers.dragEnter);
      elements.linksGrid.addEventListener('dragleave', handlers.dragLeave);
      elements.linksGrid.addEventListener('drop', handlers.drop);
      elements.linksGrid.addEventListener('dragend', handlers.dragEnd);
      elements.linksGrid.addEventListener('keydown', handlers.handleLinkKeydown);

      document.addEventListener('keydown', handlers.handleKeydown);

    };

    // 启动应用
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
  <script>
    // ===== 时间同步与显示（复用 exam_clock.html 的网络时间同步方案） =====
    (function() {
      dayjs.extend(window.dayjs_plugin_utc);
      dayjs.extend(window.dayjs_plugin_timezone);

      const BJ_TZ = 'Asia/Shanghai';
      const SYNC_INTERVAL_MS = 5 * 60 * 1000;
      let timeOffset = 0;
      let syncTimer = null;

      const timeEl = document.getElementById('currentDateTime');
      const syncStatusEl = document.getElementById('timeSyncStatus');

      function getBeijingTime() {
        return dayjs(Date.now() + timeOffset).tz(BJ_TZ);
      }

      function updateDisplay() {
        if (!timeEl) return;
        const now = getBeijingTime();
        const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
        timeEl.textContent = now.format('YYYY年MM月DD日 ') + weekdays[now.day()] + ' ' + now.format('HH:mm:ss');
      }

      function updateFooterYear(isLocal) {
        const yearEl = document.getElementById('footerYear');
        if (!yearEl) return;
        yearEl.textContent = isLocal ? new Date().getFullYear() : getBeijingTime().year();
      }

      async function syncTime() {
        if (syncStatusEl) {
          syncStatusEl.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
        }

        // 预热请求：消除 DNS、TCP 握手开销
        try { await fetch('https://api.shijian.online/timestamp/', { cache: 'no-store', mode: 'cors' }); } catch(e) {}

        let best = null;
        let bestRtt = Infinity;

        // 多轮探测（3次），取最低 RTT 的结果（网络抖动最小）
        for (let attempt = 0; attempt < 3; attempt++) {
          const t0 = performance.now();
          try {
            const res = await fetch('https://api.shijian.online/timestamp/', { cache: 'no-store', mode: 'cors' });
            const data = await res.json();
            const t1 = performance.now();
            if (data.status === 1 && data.data && data.data.timestamp) {
              const rtt = t1 - t0;
              if (rtt < bestRtt) {
                bestRtt = rtt;
                // 估算网络时间：服务器时间 + 单向延迟（RTT/2）
                best = data.data.timestamp + Math.round(rtt / 2);
              }
            }
          } catch(e) { continue; }
        }

        if (best) {
          timeOffset = best - Date.now();
          if (syncStatusEl) syncStatusEl.innerHTML = '';
          updateFooterYear();
        } else {
          if (syncStatusEl) syncStatusEl.innerHTML = '<i class="fas fa-exclamation-circle" style="color:#f59e0b;opacity:0.8" title="时间同步失败，显示为本机时间"></i>';
          updateFooterYear(true);
        }

        updateDisplay();
      }

      function startSync() {
        syncTime();
        if (syncTimer) clearInterval(syncTimer);
        syncTimer = setInterval(syncTime, SYNC_INTERVAL_MS);
      }

      // 每秒更新显示
      setInterval(updateDisplay, 1000);

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', startSync);
      } else {
        startSync();
      }
    })();
  </script>
</body>
